<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brick Breaker</title>
<style>
  /* ================= Retro arcade shell ================= */
  :root {
    --bg: #0b0f14;
    --accent: #5cf2b0;
    --ink: #9fb4c7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* single-screen: the page never scrolls */
  }
  body {
    background: var(--bg);
    color: var(--accent);
    font-family: monospace;
  }
  /* Centered fixed-aspect stage: the JS resize pass sizes the canvas
     to the largest 16:10 rectangle that fits the viewport
     (letterbox — it shrinks to fit, never stretches). */
  #game {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
  }
  /* The paddle is the visible pointer: the OS cursor is hidden over
     the stage only — the menus/HUD keep a normal cursor so their
     CTAs still look clickable (ticket #40). Deliberately a one-line
     rule: the repo gate locks this declaration via a single-line
     selector-plus-declaration match. */
  #game { cursor: none; }
  /* Top bar HUD (PRD section 3). Overlay styling, no scroll impact. */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 1rem;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
  #hud b {
    font-weight: normal;
    color: var(--ink);
  }
  /* Life icons in the top bar (PRD section 3): one small paddle bar
     per remaining life, appended/removed by the game on every change. */
  #lives {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .life-icon {
    display: inline-block;
    width: 12px;
    height: 5px;
    border-radius: 2px;
    background: var(--accent);
  }
  /* Absolute-positioned game-state overlays (PRD section 3). */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: rgba(3, 6, 10, 0.6);
    text-align: center;
  }
  .screen h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .screen p {
    margin: 0;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
  }
  #btn-start,
  #btn-resume,
  #btn-restart {
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent);
    padding: 0.7em 1.6em;
    cursor: pointer;
  }
  #btn-start:hover,
  #btn-resume:hover,
  #btn-restart:hover {
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen difficulty selector (ticket #44): one group of
     three preset options; the active preset carries .selected. */
  .difficulty {
    display: flex;
    gap: 0.5rem;
  }
  .difficulty-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.5em 1.2em;
    cursor: pointer;
  }
  .difficulty-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen theme selector (ticket #46): one group of three
     skins; the active skin carries .selected. */
  .themes {
    display: flex;
    gap: 0.5rem;
  }
  .theme-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.5em 1.2em;
    cursor: pointer;
  }
  .theme-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen sound controls (ticket #47): the mute toggle reads
     like the other start-screen options; the slider follows it. */
  .sound {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .sound-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.5em 1.2em;
    cursor: pointer;
  }
  .sound-opt.muted {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  .sound .vol {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
  }
  #sound-volume {
    width: 120px;
    accent-color: var(--accent);
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <header id="hud">
    <span>Score <b id="hud-score">0</b></span>
    <span>Level <b id="hud-level">1</b></span>
    <span>High <b id="hiscore">0</b></span>
    <span>Lives <span id="lives"></span></span>
  </header>

  <section class="screen" id="screen-start">
    <h1>Brick Breaker</h1>
    <p>Clear the wall &middot; Keep the ball up</p>
    <div class="difficulty">
      <button id="difficulty-easy" type="button" class="difficulty-opt" data-difficulty="easy">Easy</button>
      <button id="difficulty-normal" type="button" class="difficulty-opt selected" data-difficulty="normal">Normal</button>
      <button id="difficulty-hard" type="button" class="difficulty-opt" data-difficulty="hard">Hard</button>
    </div>
    <div class="themes">
      <button id="theme-classic" type="button" class="theme-opt selected" data-theme="classic">Classic</button>
      <button id="theme-neon" type="button" class="theme-opt" data-theme="neon">Neon</button>
      <button id="theme-minimal" type="button" class="theme-opt" data-theme="minimal">Minimal</button>
    </div>
    <div class="sound">
      <button id="btn-mute" type="button" class="sound-opt">Sound On</button>
      <label class="vol">Vol<input id="sound-volume" type="range" min="0" max="100" value="100"></label>
    </div>
    <button id="btn-start" type="button">Start Game</button>
  </section>

  <section class="screen" id="screen-gameover">
    <h1>Game Over</h1>
    <p id="gameover-final">Final score 0</p>
    <button id="btn-restart" type="button">Try Again</button>
  </section>

  <section class="screen" id="screen-pause">
    <h1>Paused</h1>
    <p>The board is holding &middot; Esc or P resumes</p>
    <button id="btn-resume" type="button">Resume</button>
  </section>

<script>
"use strict";
// ================================================================
// BRICK BREAKER — campaign 2: shell, paddle, ball, lives, game over,
// brick grid, ball-brick collision, scoring, level progression and
// the win condition
//
// Single file: fixed-aspect 960×600 (16:10) logical stage, rendered
// at an internal-resolution scale factor and letterboxed/centered in
// the viewport (fit, not stretch), a requestAnimationFrame loop with
// a clamped frame delta, start / pause / game-over overlay screens
// (the pause freezes the whole simulation; resume via the overlay
// CTA or a fresh Escape/KeyP press), keyboard and pointer paddle
// control, a served ball with wall and paddle
// bounces (position-dependent angle, speed-preserving), a fixed-pool
// brick grid the ball breaks for colour-valued points, level
// progression on a cleared board (faster serve per level, capped),
// the lose-a-life / game-over / restart flow, and the power-up drop /
// catch framework with the expand paddle, extra ball (a fixed ball
// pool capped at MAX_BALLS — a life is lost only when the last live
// ball falls) and sticky paddle (a timed window during which paddle
// contact catches a ball that a click re-launches) effects, and
// synthesized Web Audio SFX (named recipes per required event on a
// single master gain bus, built on the first user gesture, degrading
// to silent where Web Audio is missing), and the high score
// persisted in localStorage under a named key — loaded at boot,
// shown in the #hiscore top-bar element, and rewritten as a JSON
// number only when the live score overtakes it; a start-screen
// difficulty selector (Easy / Normal / Hard) persisted in
// localStorage under its own named key and applied per run; and
// three selectable retro themes (Classic / Neon / Minimal)
// persisted in localStorage under their own named key, driven by
// one THEMES table that at boot and on every selection change
// applies the CSS custom properties and the canvas palette in a
// single pass; and a start-screen sound toggle with a volume
// slider, persisted as JSON { muted, volume } under their own
// named key and driving the master bus level live (mute wins over
// volume)
// ================================================================

// ---- Tunables (var: addressable as globals, e.g. from the console) ----
var CANVAS_SCALE = 2;             // canvas pixels per stage pixel
var GAME_W = 960;                 // fixed logical stage width (16:10)
var GAME_H = 600;                 // fixed logical stage height (16:10)
var UI_FONT = "monospace";        // retro face for canvas UI text
var MAX_FRAME_SECONDS = 1 / 30;   // dt clamp: no teleports after tab switches
var random = Math.random;          // mutable hook: test suites pin it for determinism
var HIGH_SCORE_KEY = "brickbreaker.highScore";
var PLAYER_LIVES = 3;             // lives per run (PRD section 2 loss rule)
// Paddle (internal canvas px, so values scale with CANVAS_SCALE)
var BASE_PADDLE_W = 120;           // resting width; the runtime width widens on expand
var PADDLE_HEIGHT = 14;
var PADDLE_BOTTOM_GAP = 24;       // clear space between paddle and bottom edge
var PADDLE_SPEED = 720;           // keyboard travel speed, px/s
// Ball
var BALL_RADIUS = 8;
var MAX_BALLS = 5;              // live-ball cap; the ball pool is sized to this
var BALL_SERVE_SPEED = 480;       // level-1 launch speed on click/tap, px/s
var LEVEL_SPEED_GROWTH = 1.15;    // per-level serve-speed multiplier (PRD section 4)
var MAX_BALL_SPEED = 1500;        // ceiling the per-level growth caps at, px/s
var MAX_PADDLE_BOUNCE_ANGLE = Math.PI / 3;  // 60 deg from vertical at the rim
// Pin nudge: when collideBricks pins a ball flush to a brick face it
// nudges it this far OUTSIDE, so a re-computed overlap of the pinned
// position is strictly zero — a flush pin can never re-register as
// (ULP-rounding-dependent) contact on a LATER frame.
var BRICK_PIN_EPS = 1e-6;
// Bricks: grid geometry (internal canvas px) over a fixed-size pool
var BRICK_ROWS = 5;
var BRICK_COLS = 10;
var BRICK_SIDE_MARGIN = 24;
var BRICK_TOP_MARGIN = 64;
var BRICK_GAP = 6;
var BRICK_HEIGHT = 26;
// Hard bound on the post-hit seam drain in updateBalls(). With
// multi-hit bricks (ticket #42) a ball wedged in a gap narrower
// than itself can ping-pong between the two seam faces forever:
// clearing the left neighbour needs the centre at
// leftRightFace + R or beyond, clearing the right neighbour needs
// it at rightLeftFace - R or below, and the two bounds are
// 2*R - GAP apart with 2*R > GAP — no position satisfies both.
// The drain therefore rescan-caps at one-plus-the-pool-size;
// residual overlap past the cap is the documented seam artifact,
// never a busy loop.
var MAX_BRICK_RESCANS_PER_SUBSTEP = BRICK_ROWS * BRICK_COLS + 1;
// Brick colours map to named per-colour point values (PRD section 2)
// and per-colour durability (ticket #42): the top tier is
// multi-hit, the base tier is one-hit, so a colour still encodes
// exactly one point value.
var COLOR_BRICK_A = "#ef5d62";
var POINTS_BRICK_A = 30;
var COLOR_BRICK_B = "#f2a541";
var POINTS_BRICK_B = 20;
var COLOR_BRICK_C = "#4fc1e9";
var POINTS_BRICK_C = 10;
// Per-tier hit points to break (ticket #42): the top tier takes the
// most hits, the base tier still dies in one. The fixed tier scores
// zero and can never be charged (unbreakable); its hp of 0 keeps
// the damage-rendering comparison (hp < tier hp) permanently false.
var HP_BRICK_A = 3;
var HP_BRICK_B = 2;
var HP_BRICK_C = 1;
var HP_BRICK_FIXED = 0;
// Fixed bricks (ticket #43): unbreakable, worth nothing — a ball
// must get behind them, not break them. The tier is a table entry
// like the others so the draw pass stays a plain colour lookup.
var COLOR_BRICK_FIXED = "#8b93a7";
var POINTS_BRICK_FIXED = 0;
var BRICK_TIERS = [
  { color: COLOR_BRICK_A, points: POINTS_BRICK_A, hp: HP_BRICK_A },
  { color: COLOR_BRICK_B, points: POINTS_BRICK_B, hp: HP_BRICK_B },
  { color: COLOR_BRICK_C, points: POINTS_BRICK_C, hp: HP_BRICK_C },
  { color: COLOR_BRICK_FIXED, points: POINTS_BRICK_FIXED, hp: HP_BRICK_FIXED, unbreakable: true }
];
var TIER_FIXED = BRICK_TIERS.length - 1; // index of the unbreakable tier
// Level layout table (ticket #43): BRICK_ROWS row-strings of
// BRICK_COLS cells — '.' = empty, 'A'/'B'/'C' = the matching tier
// letter, 'X' = fixed brick. Level k takes
// LEVEL_PATTERNS[(k - 1) % LEVEL_PATTERNS.length], cycling forever.
var CELL_TIER = { A: 0, B: 1, C: 2, X: TIER_FIXED };
var LEVEL_PATTERNS = [
  // 0 — tiered wall: the solid classic grid
  [ "AAAAAAAAAA", "BBBBBBBBBB", "CCCCCCCCCC", "AAAAAAAAAA", "BBBBBBBBBB" ],
  // 1 — gated fort: fixed top wall with a two-column gate the ball
  //   is guided up (and back down) to the pocket behind the wall
  [ "XXXX..XXXX", "AAAA..AAAA", "BBBB..BBBB", "CCCC..CCCC", "BBBB..BBBB" ],
  // 2 — checker scatter: sparse alternating cells with an open rim
  [ "A.C.C.C.C.", "B.A.B.A.B.", "C.B.C.B.C.", "A.B.A.B.A.", "B.C.B.C.B." ],
  // 3 — overhang: a fixed slab hovering above an open field
  [ "AAAAAAAAAA", "CC.XXXX.CC", "BB.XX...BB", "BB......BB", "CCCC.CCCCC" ]
];
// Damaged fill of a tier colour: a non-lethal hit dims the brick in
// place. Channels scaled down by BRICK_DARK_FACTOR, computed once at
// module load — the hit and draw paths never allocate.
var BRICK_DARK_FACTOR = 0.45;
function darkenHex(hex, factor) {
  var out = "#";
  for (var i = 1; i < hex.length; i += 2) {
    out += Math.round(parseInt(hex.slice(i, i + 2), 16) * factor)
      .toString(16).padStart(2, "0");
  }
  return out;
}
BRICK_TIERS.forEach(function (t) { t.dark = darkenHex(t.color, BRICK_DARK_FACTOR); });
// Power-ups (PRD section 4): capsules released by destroyed bricks
var POWERUP_DROP_RATE = 0.25;      // normal-preset baseline; the run rolls its snapshot
var CAPSULE_FALL_SPEED = 200;      // descent speed, px/s
var CAPSULE_W = 24;                // capsule footprint, internal px
var CAPSULE_H = 14;
var CAPSULE_POOL_SIZE = 4;         // fixed pre-allocated pool of concurrent capsules
// Enumerated capsule kinds; later effects add a constant, a pool
// entry here, and a case in applyCapsule() — the catch handler itself
// never changes.
var KIND_EXPAND = 0;
var KIND_EXTRA = 1;
var KIND_STICKY = 2;
var KIND_LIFE = 3;
var KIND_MULTIPLIER = 4;
var CAPSULE_KINDS = [KIND_EXPAND, KIND_EXTRA, KIND_STICKY, KIND_LIFE, KIND_MULTIPLIER];
var COLOR_CAPSULE_EXPAND = "#ffd23f";
var COLOR_CAPSULE_EXTRA = "#63d4ff";
var COLOR_CAPSULE_STICKY = "#d05ce3";
var COLOR_CAPSULE_LIFE = "#ff5c7a";
var COLOR_CAPSULE_MULT = "#6eff8f";
// Exhaustive kind-to-colour table, indexed by kind: every enumerated
// kind has exactly one row. A new kind adds a row here and an entry
// in CAPSULE_KINDS — never a branch in the draw pass.
var CAPSULE_COLORS = [
  COLOR_CAPSULE_EXPAND, COLOR_CAPSULE_EXTRA, COLOR_CAPSULE_STICKY,
  COLOR_CAPSULE_LIFE, COLOR_CAPSULE_MULT,
];
var PADDLE_EXPAND_FACTOR = 1.6;         // widened width = the run's base paddle width * factor
var PADDLE_EXPAND_DURATION_S = 6;       // simulated seconds of widen
var STICKY_DURATION_S = 6;              // simulated seconds the paddle still catches
var MULT_VALUE = 2;                     // armed kills are worth this many times their tier points
var MULT_DURATION_S = 6;                // simulated seconds the multiplier window stays armed
// Difficulty presets (ticket #44): the start-screen choice maps to a
// row of named knobs. beginRun() snapshots the selected row onto the
// run, so switching presets between runs never mutates the global
// tuning above.
var DIFFICULTY_KEY = "brickbreaker.difficulty";
var DEFAULT_DIFFICULTY = "normal";
var DIFFICULTY = {
  easy: { serveSpeed: 400, paddleWidth: 150, dropRate: 0.35 },
  // normal is the legacy tuning: the row references the named
  // constants, keeping a single source of truth.
  normal: {
    serveSpeed: BALL_SERVE_SPEED,
    paddleWidth: BASE_PADDLE_W,
    dropRate: POWERUP_DROP_RATE,
  },
  hard: { serveSpeed: 560, paddleWidth: 96, dropRate: 0.15 },
};

// ---- Palette (the page accent lives in the CSS --accent property;
// a canvas-drawn mirror is added with the canvas-text gameplay tickets) ----
var COLOR_BG = "#0b0f14";
var COLOR_PADDLE = "#5cf2b0";
var COLOR_BALL = "#e8ecf1";

// ---- Themes (selectable retro skins, ticket #46) ----
// One row per theme: the CSS custom-property triple (applied to
// document.documentElement and picked up by the stylesheet via
// --bg/--accent/--ink) and the canvas palette mirrors the draw
// pass reads (COLOR_BG / COLOR_PADDLE / COLOR_BALL and the four
// BRICK_TIERS colours in A/B/C/fixed order). Applying a theme is
// a single write-through pass, so a selection change never adds
// per-frame branches to the draw path.
var THEME_KEY = "brickbreaker.theme";
var DEFAULT_THEME = "classic";
var THEMES = {
  // classic is the legacy look: every mirror references the named
  // module-load constants above, keeping one source of truth (the
  // DIFFICULTY.normal row precedent).
  classic: {
    css: { bg: "#0b0f14", accent: "#5cf2b0", ink: "#9fb4c7" },
    palette: {
      bg: COLOR_BG,
      paddle: COLOR_PADDLE,
      ball: COLOR_BALL,
      bricks: [COLOR_BRICK_A, COLOR_BRICK_B, COLOR_BRICK_C, COLOR_BRICK_FIXED],
    },
  },
  // neon: saturated cyan/magenta over a deep violet-black ground.
  neon: {
    css: { bg: "#0a0118", accent: "#00f0ff", ink: "#8f86c9" },
    palette: {
      bg: "#0a0118",
      paddle: "#00f0ff",
      ball: "#ffffff",
      bricks: ["#ff2d78", "#ffbe0b", "#7c4dff", "#5b4b8a"],
    },
  },
  // minimal: near-monochrome warm stone over an off-white ground.
  minimal: {
    css: { bg: "#f2efe9", accent: "#14141a", ink: "#8d877c" },
    palette: {
      bg: "#f2efe9",
      paddle: "#14141a",
      ball: "#14141a",
      bricks: ["#57534e", "#78716c", "#a8a29e", "#d6d3d1"],
    },
  },
};

// ---- Audio: synthesized SFX on a master gain bus (ticket #27) ----
// All sound effects are synthesized with the Web Audio API (PRD
// section 4) — no audio files. The context is constructed only on
// the first user gesture (click or keydown), never on page load;
// before then — and in engines without Web Audio — every schedule is
// a silent no-op. Each sound's envelope gain connects to the single
// MASTER_BUS gain node, whose level tracks MASTER_GAIN live so a
// console reassignment applies to the next sound (and 0 silences
// everything). Mirrors the campaign-1 audio architecture (ticket #9).
var MASTER_GAIN = 0.2;                 // master bus level (0..1); the sound-settings block rewrites it from effectiveMaster() at boot and on every change
var WAVE_SINE = "sine";               // named waveform sources
var WAVE_SQUARE = "square";
var WAVE_NOISE = "noise";
// Named per-recipe constants: wave, frequency (Hz) and duration (s).
var SFX_PADDLE_BOUNCE = { wave: WAVE_SINE,   freq: 220, dur: 0.05 };
var SFX_BRICK_BREAK   = { wave: WAVE_NOISE,  freq: 900, dur: 0.09 };
var SFX_POWERUP_CATCH = { wave: WAVE_SQUARE, freq: 660, dur: 0.12 };
var SFX_GAME_OVER     = { wave: WAVE_SINE,   freq: 110, dur: 0.50 };
var SFX_PEAK = 0.5;                    // every envelope peaks here; the bus scales it
var SFX_DECAY_FLOOR = 0.001;           // decay target: exp ramps cannot reach exact 0
var SFX_EXP_EPS = 1e-4;                // exp-ramp guard: start and target stay positive
var SFX_NOISE_BUFFER_SECONDS = 0.25;   // shared noise source length
var audioCtx = null;                   // AudioContext, built on the first gesture
var MASTER_BUS = null;                 // the one gain node wired to destination
var noiseBuffer = null;                // white noise, built once, reused per hit
// Build the audio graph on the first user gesture; later calls reuse
// the existing context, resuming it if the browser has suspended it.
// Silently no-ops when the platform has no Web Audio.
function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return;
  }
  if (typeof AudioContext === "undefined") return; // silent, no error
  audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  MASTER_BUS = audioCtx.createGain();
  MASTER_BUS.gain.value = MASTER_GAIN;
  MASTER_BUS.connect(audioCtx.destination);
  var frames = Math.max(1, Math.ceil(audioCtx.sampleRate * SFX_NOISE_BUFFER_SECONDS));
  noiseBuffer = audioCtx.createBuffer(1, frames, audioCtx.sampleRate);
  var data = noiseBuffer.getChannelData(0);
  for (var i = 0; i < data.length; i += 1) data[i] = random() * 2 - 1;
}
// Schedule one shot of a named recipe: the source — an oscillator for
// sine/square, or the shared noise buffer through a lowpass at the
// recipe frequency for noise — feeds a freshly shaped envelope gain,
// which connects to the single MASTER_BUS. The envelope peaks at
// SFX_PEAK, then decays to SFX_DECAY_FLOOR at the recipe duration,
// so the node's audio is bounded. Both ramp values are clamped to
// SFX_EXP_EPS (exp ramps must stay positive); the start is set at the
// schedule time, so a console zeroed SFX_PEAK/SFX_DECAY_FLOOR can
// never make the scheduler throw.
function scheduleSound(recipe) {
  if (!audioCtx) return; // audio not enabled yet: silent no-op
  var t0 = audioCtx.currentTime;
  MASTER_BUS.gain.value = MASTER_GAIN; // live console retunes apply
  var input = null; // node feeding the envelope
  if (recipe.wave === WAVE_NOISE) {
    input = audioCtx.createBiquadFilter();
    input.type = "lowpass";
    input.frequency.value = recipe.freq;
    var noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    noiseSrc.connect(input);
    noiseSrc.start(t0);
    noiseSrc.stop(t0 + recipe.dur);
  } else {
    input = audioCtx.createOscillator();
    input.type = recipe.wave;
    input.frequency.value = recipe.freq;
  }
  var env = audioCtx.createGain();
  env.gain.setValueAtTime(Math.max(SFX_PEAK, SFX_EXP_EPS), t0);

      c.active = false; // caught: consumed by its effect
      applyCapsule(c.kind);
    } else if (c.y - CAPSULE_H > canvas.height) {
      c.active = false; // missed: fell past the bottom edge
    }
  }
}

// ---- Balls (fixed pool, tickets #21/#26) ----
function liveBallCount() {
  var n = 0;
  for (var i = 0; i < balls.length; i += 1) if (balls[i].active) n += 1;
  return n;
}
// An extra-ball catch spawns at the paddle centre and joins active
// play immediately: straight up at the (level-grown) serve speed.
// The pool is the named MAX_BALLS cap — a catch beyond it is a no-op.
function spawnExtraBall() {
  var free = null;
  for (var i = 0; i < balls.length; i += 1) {
    if (balls[i].active) continue;
    free = balls[i];
    break;
  }
  if (!free) return;
  free.active = true;
  free.attached = false;
  free.attachOff = 0;
  free.x = paddle.x;
  free.y = paddleTop() - BALL_RADIUS;
  free.vx = 0;
  free.vy = -serveSpeed;
}
// A click/tap launches EVERY attached ball at the (level-grown)
// serve speed, each inheriting the position-dependent paddle-angle
// logic for its own offset from the paddle centre.
function launchAttachedBalls() {
  ensureAudio(); // a click/tap is a user gesture: build the audio graph once
  if (gameState !== "playing") return;
  for (var i = 0; i < balls.length; i += 1) {
    var b = balls[i];
    if (!b.active || !b.attached) continue;
    var rel = (b.x - paddle.x) / (paddleW / 2);
    if (rel > 1) rel = 1;
    else if (rel < -1) rel = -1;
    b.attached = false;
    b.vx = serveSpeed * Math.sin(rel * MAX_PADDLE_BOUNCE_ANGLE);
    b.vy = -serveSpeed * Math.cos(rel * MAX_PADDLE_BOUNCE_ANGLE);
  }
}
canvas.addEventListener("click", launchAttachedBalls);
canvas.addEventListener("touchend", launchAttachedBalls);

function updateBalls(dt) {
  var pt = paddleTop();
  for (var i = 0; i < balls.length; i += 1) {
    var b = balls[i];
    if (!b.active) continue;
    if (b.attached) {
      // Rides the paddle at its catch offset; all motion is
      // paddle-driven while attached.
      b.x = paddle.x + b.attachOff;
      b.y = pt - BALL_RADIUS;
      continue;
    }
    var prevBottom = b.y + BALL_RADIUS;
    // Integrate in sub-steps of at most one ball radius, so a fast
    // ball can never skip a brick face inside a clamped frame.
    var travel = Math.hypot(b.vx, b.vy) * dt;
    var steps = Math.max(1, Math.ceil(travel / BALL_RADIUS));
    var sdt = dt / steps;
    var bricked = false;
    for (var s = 0; s < steps; s += 1) {
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;
      bounceWalls(b);
      if (collideBricks(b)) {
        bricked = true;
        // The gap is narrower than the ball: pinning to a brick face
        // can land the ball inside the seam neighbour. Drain the
        // residual overlap now. Bounded: in a seam the two pin faces
        // are mutually exclusive (ball wider than gap), so a wedged
        // ball can cycle the pins forever — a physically-wrong
        // position, but the frame must end (ticket #42 round 2).
        var rescans = 0;
        while (rescans < MAX_BRICK_RESCANS_PER_SUBSTEP && collideBricks(b)) {
          rescans += 1;
        }
        break;
      }
    }
    if (bricked) continue; // reflected by a brick (or re-served on a win)
    // Paddle: sweep test across the top face (no tunnelling even on a
    // clamped frame). While the sticky window is live the contact
    // catches; otherwise the outgoing angle derives from the hit
    // offset and the incoming speed is preserved.
    if (
      b.vy > 0 &&
      prevBottom <= pt &&
      b.y + BALL_RADIUS >= pt &&
      Math.abs(b.x - paddle.x) <= paddleW / 2 + BALL_RADIUS
    ) {
      if (simTime < stickyUntil) {
        b.attached = true;
        var catchOff = b.x - paddle.x;
        if (catchOff > paddleW / 2) catchOff = paddleW / 2;
        else if (catchOff < -paddleW / 2) catchOff = -paddleW / 2;
        b.attachOff = catchOff;
        b.vx = 0;
        b.vy = 0;
        b.x = paddle.x + catchOff;
        b.y = pt - BALL_RADIUS;
      } else {
        var rel = (b.x - paddle.x) / (paddleW / 2);
        if (rel > 1) rel = 1;
        else if (rel < -1) rel = -1;
        var speed = Math.hypot(b.vx, b.vy);
        var angle = rel * MAX_PADDLE_BOUNCE_ANGLE;
        b.vx = speed * Math.sin(angle);
        b.vy = -speed * Math.cos(angle);
        b.y = pt - BALL_RADIUS; // push out above the paddle
        scheduleSound(SFX_PADDLE_BOUNCE);
      }
    }
    // Dropped below the bottom edge: only the last live ball costs a
    // life; the others are simply gone and the run carries on.
    if (b.y - BALL_RADIUS > canvas.height) {
      b.active = false;
      if (liveBallCount() === 0) loseLife();
    }
  }
}
// Walls: mirror the velocity component, pin to the inner edge. The
// bottom is open — that is how a life is lost.
function bounceWalls(b) {
  if (b.x - BALL_RADIUS < 0) {
    b.x = BALL_RADIUS;
    b.vx = Math.abs(b.vx);
  } else if (b.x + BALL_RADIUS > canvas.width) {
    b.x = canvas.width - BALL_RADIUS;
    b.vx = -Math.abs(b.vx);
  }
  if (b.y - BALL_RADIUS < 0) {
    b.y = BALL_RADIUS;
    b.vy = Math.abs(b.vy);
  }
}
// Circle vs brick overlap resolved along the shallowest axis; the
// sign-based flip preserves the incoming speed exactly. One brick
// per call (the first contact in pool order); the sub-step loop
// drains follow-on seam overlaps after a hit. Multi-hit tiers
// (ticket #42): a brick may pay at most ONE hp per frame — the
// charge flag (cleared in update() at frame end) makes same-frame
// re-contacts resolve the overlap but cost no further hp. A
// non-lethal hit reflects the ball normally but scores nothing,
// drops nothing and leaves bricksLeft untouched; only the lethal
// hit routes to destroyBrick().
//
// NOTE: a charged brick still RESOLVES (reflect + pin) on re-contact.
// In a seam narrower than the ball the two pin faces are mutually
// exclusive (the ball cannot clear both neighbours at once), so the
// drain must be bounded by MAX_BRICK_RESCANS_PER_SUBSTEP or a wedged
// ball would cycle the pins forever (ticket #42 review round 2).
function collideBricks(b) {
  for (var i = 0; i < bricks.length; i += 1) {
    var k = bricks[i];
    if (!k.active) continue;
    var cx = k.x + k.w / 2;
    var cy = k.y + k.h / 2;
    var ovx = k.w / 2 + BALL_RADIUS - Math.abs(b.x - cx);
    var ovy = k.h / 2 + BALL_RADIUS - Math.abs(b.y - cy);
    if (ovx <= 0 || ovy <= 0) continue;
    if (ovx < ovy) {
      b.vx = b.x < cx ? -Math.abs(b.vx) : Math.abs(b.vx);
      b.x = b.x < cx
        ? k.x - BALL_RADIUS - BRICK_PIN_EPS
        : k.x + k.w + BALL_RADIUS + BRICK_PIN_EPS;
    } else {
      b.vy = b.y < cy ? -Math.abs(b.vy) : Math.abs(b.vy);
      b.y = b.y < cy
        ? k.y - BALL_RADIUS - BRICK_PIN_EPS
        : k.y + k.h + BALL_RADIUS + BRICK_PIN_EPS;
    }
    // Unbreakable bricks only reflect: no destroy, no score, no
    // drop, no bricksLeft effect — the per-frame damage charge is
    // spent on breakable bricks only (the win counts breakables).
    if (!k.unbreakable && !k.charged) {
      k.charged = true; // spent this frame's single damage charge
      k.hp -= 1;
      if (k.hp <= 0) destroyBrick(i);
    }
    return true;
  }
  return false;
}

// ---- Flow ----
function setScreen(which) {
  screenStart.style.display = which === "start" ? "flex" : "none";
  screenPause.style.display = which === "paused" ? "flex" : "none";
  screenOver.style.display = which === "gameover" ? "flex" : "none";
}
function startGame() {
  ensureAudio(); // a click is a user gesture: build the audio graph once
  if (gameState !== "start") return; // the button only lives on the start screen
  gameState = "playing";
  setScreen("playing");
  beginRun();
}
function restartRun() {
  ensureAudio(); // a click is a user gesture: build the audio graph once
  if (gameState !== "gameover") return; // the button only lives on that screen
  gameState = "playing";
  setScreen("playing");
  beginRun();
}
// One reset path shared by first start and restart: a fresh
// attached serve, the level-1 pattern grid (spawnLevel below), and a
// drained power-up state (no capsule or widen carries over). The
// selected difficulty's knobs are snapshotted onto the run here.
function beginRun() {
  score = 0;
  level = 1;
  lives = PLAYER_LIVES;
  var preset = DIFFICULTY[selectedDifficulty];
  serveSpeed = preset.serveSpeed;
  basePaddleW = preset.paddleWidth;
  paddleW = basePaddleW;
  dropRate = preset.dropRate;
  simTime = 0;
  expandUntil = -1;
  stickyUntil = -1;
  multUntil = -1;
  for (var i = 0; i < capsules.length; i += 1) capsules[i].active = false;
  spawnLevel();
  serveBall();
  renderLives();
  syncHud();
}
btnStart.addEventListener("click", startGame);
btnRestart.addEventListener("click", restartRun);
// Pause / resume (ticket #24): a state-gated toggle bridging only
// "playing" <-> "paused"; every other state ignores the pause keys
// (campaign-1 edge-triggered, state-gated transition precedent).
// The simulation is frozen for free: frame() runs update(dt) only in
// "playing", so simTime, paddle, balls and power-ups all stand still
// while paused, and the next frame after resume moves on.
function togglePause() {
  if (gameState === "playing") {
    gameState = "paused";
    setScreen("paused");
  } else if (gameState === "paused") {
    gameState = "playing";
    setScreen("playing");
  }
}
// Edge trigger: a keydown counts as one press only if the key is not
// held already, so browser auto-repeat of a held Escape/KeyP never
// re-toggles the pause screen.
function onPauseKeyPress(code) {
  if (pauseKeys.has(code)) return; // held already: auto-repeat, not a press
  pauseKeys.add(code);
  togglePause();
}
function resumeGame() {
  ensureAudio(); // a click is a user gesture: build the audio graph once
  if (gameState !== "paused") return; // the button only lives on the pause screen
  gameState = "playing";
  setScreen("playing");
}
btnResume.addEventListener("click", resumeGame);

// ---- Lives / game over ----
// A fresh serve always parks ONE resting ball at the paddle centre:
// every slot is drained and slot 0 rides the paddle, so an extra ball
// never carries across a serve. The sticky WINDOW does: it is a fixed
// sim-time span anchored at the moment the capsule was caught, and a serve does
// not disarm it — a window still armed when the serve lands stays
// armed until stickyUntil (the run-level reset in beginRun() is the
// one place sticky state is cleared).
function serveBall() {
  for (var i = 0; i < balls.length; i += 1) {
    balls[i].active = false;
    balls[i].attached = false;
    balls[i].attachOff = 0;
    balls[i].vx = 0;
    balls[i].vy = 0;
  }
  var b0 = balls[0];
  b0.active = true;
  b0.attached = true;
  b0.x = paddle.x;
  b0.y = paddleTop() - BALL_RADIUS;
}
// A life was lost: fresh serve, or game over when none remain. The
// ball-drop path is the in-play caller and decides (via the live-
// ball count) whether the dropped ball was the last one in play.
function loseLife() {
  lives -= 1;
  renderLives();
  if (lives <= 0) {
    lives = 0;
    enterGameOver();
  } else {
    serveBall();
  }
}
function enterGameOver() {
  gameState = "gameover";
  scheduleSound(SFX_GAME_OVER);
  // Re-serve: the frozen field behind the overlay shows the ball at
  // rest on the paddle; no live ball carries over.
  serveBall();
  gameoverFinal.textContent = "Final score " + score;
  setScreen("gameover");
  syncHud();
}
// The #lives node holds exactly one icon span per remaining life;
// it is rebuilt only when a life is gained or lost.
function renderLives() {
  while (livesEl.firstChild) livesEl.removeChild(livesEl.firstChild);
  for (var i = 0; i < lives; i += 1) {
    var icon = document.createElement("span");
    icon.className = "life-icon";
    livesEl.appendChild(icon);
  }
}

// ---- Frame loop ----
// Per-frame order: resize -> update(dt) -> syncScore -> draw, so a
// record overtaken inside update persists on the same frame it happens.
function frame(time) {
  var dt = lastFrameTime === null
    ? 0
    : Math.min(Math.max(0, (time - lastFrameTime) / 1000), MAX_FRAME_SECONDS);
  lastFrameTime = time;
  if (resizePending) {
    resizePending = false;
    resizeCanvas();
  }
  if (gameState === "playing") update(dt);
  syncScore();
  draw();
  requestAnimationFrame(frame);
}
// Promote the live score to the persisted high score when it rises;
// the same frame also refreshes the #hiscore readout.
function syncScore() {
  if (score > highScore) {
    highScore = score;
    saveHighScore();
    syncHud();
  }
}
function update(dt) {
  simTime += dt;
  updatePaddle(dt);
  updateBalls(dt);
  updatePowerups(dt);
  // Frame end: reset the per-brick damage charges so the next
  // frame's contacts can cost hp again (ticket #42 cap).
  for (var i = 0; i < bricks.length; i += 1) bricks[i].charged = false;
}
function draw() {
  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (gameState === "start") return;
  drawBricks();
  // Outside "playing" the field is frozen: capsules stay pooled but
  // undrawn, so the game-over screen shows a tidy board.
  if (gameState === "playing") drawPowerups();
  drawPaddle();
  drawBalls();
}
function drawBricks() {
  for (var i = 0; i < bricks.length; i += 1) {
    var b = bricks[i];
    if (!b.active) continue;
    // Damaged bricks (hp below the tier's full hp) paint the dimmed
    // variant of their tier colour; full-hp bricks — including every
    // one-hit brick — render exactly as before.
    ctx.fillStyle = b.hp < BRICK_TIERS[b.tier].hp ? BRICK_TIERS[b.tier].dark : BRICK_TIERS[b.tier].color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
}
function drawPowerups() {
  for (var i = 0; i < capsules.length; i += 1) {
    var c = capsules[i];
    if (!c.active) continue;
    ctx.fillStyle = CAPSULE_COLORS[c.kind];
    ctx.fillRect(c.x - CAPSULE_W / 2, c.y, CAPSULE_W, CAPSULE_H);
  }
}
function drawPaddle() {
  ctx.fillStyle = COLOR_PADDLE;
  ctx.fillRect(paddle.x - paddleW / 2, paddleTop(), paddleW, PADDLE_HEIGHT);
}
function drawBalls() {
  ctx.fillStyle = COLOR_BALL;
  for (var i = 0; i < balls.length; i += 1) {
    var b = balls[i];
    if (!b.active) continue;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_RADIUS, 0, 2 * Math.PI);
    ctx.fill();
  }
}

// ---- Boot ----
resizeCanvas();
paddle.x = canvas.width / 2;
serveBall();
setScreen("start");
renderLives();
syncHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
