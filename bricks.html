<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brick Breaker</title>
<style>
  /* ================= Retro arcade shell ================= */
  :root {
    --bg: #0b0f14;
    --accent: #5cf2b0;
    --ink: #9fb4c7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* single-screen: the page never scrolls */
  }
  body {
    background: var(--bg);
    color: var(--accent);
    font-family: monospace;
  }
  /* Centered fixed-aspect stage: the JS resize pass sizes the canvas
     to the largest 16:10 rectangle that fits the viewport
     (letterbox — it shrinks to fit, never stretches). */
  #game {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
  }
  /* The paddle is the visible pointer: the OS cursor is hidden over
     the stage only — the menus/HUD keep a normal cursor so their
     CTAs still look clickable (ticket #40). Deliberately a one-line
     rule: the repo gate locks this declaration via a single-line
     selector-plus-declaration match. */
  #game { cursor: none; }
  /* Top bar HUD (PRD section 3). Overlay styling, no scroll impact. */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 1rem;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
  #hud b {
    font-weight: normal;
    color: var(--ink);
  }
  /* Life icons in the top bar (PRD section 3): one small paddle bar
     per remaining life, appended/removed by the game on every change. */
  #lives {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .life-icon {
    display: inline-block;
    width: 12px;
    height: 5px;
    border-radius: 2px;
    background: var(--accent);
  }
  /* Absolute-positioned game-state overlays (PRD section 3). */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: rgba(3, 6, 10, 0.6);
    text-align: center;
  }
  /* Extremely short windows (ticket #111): if the start panel
     ever outgrows the viewport, it scrolls within the panel
     instead of clipping; safe centering keeps the CTA reachable
     at the bottom when it does. Never-observed fallback — the
     compacted rhythm fits the 577px fold outright. */
  #screen-start {
    overflow-y: auto;
    justify-content: safe center;
    /* Ticket #113: the added full screen row costs ~40px of the
       577px fold budget; tightening ONLY the start panel's gap
       (the other overlays keep 0.75rem) buys the headroom back
       without touching the locked type scale. */
    gap: 0.55rem;
  }
  .screen h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .screen p {
    margin: 0;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
  }
  #btn-start,
  #btn-resume,
  #btn-restart,
  #btn-menu {
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent);
    padding: 0.7em 1.6em;
    cursor: pointer;
  }
  #btn-start:hover,
  #btn-resume:hover,
  #btn-restart:hover,
  #btn-menu:hover {
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen difficulty selector (ticket #44): one group of
     three preset options; the active preset carries .selected. */
  .difficulty {
    display: flex;
    gap: 0.5rem;
  }
  .difficulty-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.45em 1.2em;
    cursor: pointer;
  }
  .difficulty-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen theme selector (ticket #46): one group of three
     skins; the active skin carries .selected. */
  .themes {
    display: flex;
    gap: 0.5rem;
  }
  .theme-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.45em 1.2em;
    cursor: pointer;
  }
  .theme-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen mode selector (ticket #74, alleyway row ticket
     #76): one group of named play modes; the active mode carries
     .selected. The row's generic .mode-opt treatment means every
     further option button needs no restyling. */
  .modes {
    display: flex;
    gap: 0.5rem;
  }
  .mode-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.45em 1.2em;
    cursor: pointer;
  }
  .mode-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen fast-forward selector (ticket #102): the warp
     multiplier applied while the right mouse button is held; the
     active option carries .selected. */
  .fastfwd {
    display: flex;
    gap: 0.5rem;
  }
  .fastfwd-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.45em 1.2em;
    cursor: pointer;
  }
  .fastfwd-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen native full screen toggle (ticket #113): one
     STATIC button — not a radio row — whose label and state the
     fullscreenchange pass keeps in sync with
     document.fullscreenElement. */
  .fullscreen {
    display: flex;
    gap: 0.5rem;
  }
  .fs-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.45em 1.2em;
    cursor: pointer;
  }
  .fs-opt.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Top-five leaderboard (ticket #48): one ranked row per entry,
     rebuilt in place on insert, reset, or boot; an empty list
     renders as a single placeholder row. */
  .leaderboard {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    min-height: 1.4em;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .leaderboard-row {
    min-width: 8ch;
    text-align: left;
  }
  .leaderboard-row.placeholder {
    color: rgba(159, 180, 199, 0.5);
  }
  /* Capsule legend (ticket #99): the static start-screen listing of
     every powerup. The container holds exactly one row per kind,
     rendered from CAPSULE_LEGEND at boot — a 2-column grid keeps all
     eight rows on four compact lines. Swatches reuse the in-game
     per-kind capsule colours so the legend can't drift from play. */
  .capsule-legend-heading {
    margin: 0;
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(159, 180, 199, 0.7);
  }
  .capsule-legend {
    display: grid;
    grid-template-columns: repeat(2, max-content);
    gap: 0.15rem 2rem;
    font-size: 0.75rem;
    line-height: 1.15;
  }
  .capsule-legend-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .capsule-legend-swatch {
    display: inline-block;
    width: 14px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .capsule-legend-label {
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .capsule-legend-blurb {
    letter-spacing: 0.05em;
    color: rgba(159, 180, 199, 0.7);
  }
  /* The reset control (ticket #48): clears high score AND
     leaderboard alike — a secondary action, styled as a muted
     opt button, not the primary accent CTA. */
  #btn-reset-hiscore {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(159, 180, 199, 0.4);
    padding: 0.45em 1.2em;
    cursor: pointer;
  }
  #btn-reset-hiscore:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen sound controls (ticket #47): the mute toggle reads
     like the other start-screen options; the slider follows it. */
  .sound {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .sound-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.45em 1.2em;
    cursor: pointer;
  }
  .sound-opt.muted {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Shared start-screen control treatment: the volume row and the
     ball-speed row (ticket #73) both pair a label with a range slider. */
  .sound .vol, .speed .vol {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
  }
  #sound-volume, #ball-speed {
    width: 120px;
    accent-color: var(--accent);
  }
  /* Start-screen ball-speed option (ticket #73): the slider follows
     the volume slider's row treatment, on its own tidy row. The .vol
     and range rules are shared with the sound row above. Ticket #90
     adds the live readout span (inherits the row-label treatment) and
     the .slider track wrapper whose ::after pseudo-element is the
     visible 100% notch: 100 is the mid of the 50..150 range, so the
     tick anchors at left: 50%, coloured through the theme accent.
     CSS only, no image, theme-aware via the existing palette vars. */
  .speed {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .speed .slider {
    position: relative;
    display: inline-flex;
  }
  .speed .slider::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 14px;
    background: var(--accent);
    opacity: 0.75;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <header id="hud">
    <span>Score <b id="hud-score">0</b></span>
    <span>Level <b id="hud-level">1</b></span>
    <span>High <b id="hiscore">0</b></span>
    <span>Lives <span id="lives"></span></span>
  </header>

  <section class="screen" id="screen-start">
    <h1>Brick Breaker</h1>
    <p>Clear the wall &middot; Keep the ball up</p>
    <div class="difficulty">
      <button id="difficulty-easy" type="button" class="difficulty-opt" data-difficulty="easy">Easy</button>
      <button id="difficulty-normal" type="button" class="difficulty-opt selected" data-difficulty="normal">Normal</button>
      <button id="difficulty-hard" type="button" class="difficulty-opt" data-difficulty="hard">Hard</button>
    </div>
    <div class="themes">
      <button id="theme-classic" type="button" class="theme-opt selected" data-theme="classic">Classic</button>
      <button id="theme-neon" type="button" class="theme-opt" data-theme="neon">Neon</button>
      <button id="theme-minimal" type="button" class="theme-opt" data-theme="minimal">Minimal</button>
    </div>
    <div class="modes">
      <button id="mode-classic" type="button" class="mode-opt selected" data-mode="classic">Classic</button>
      <button id="mode-exciting" type="button" class="mode-opt" data-mode="exciting">Exciting</button>
      <button id="mode-alleyway" type="button" class="mode-opt" data-mode="alleyway">Alleyway</button>
    </div>
    <div class="sound">
      <button id="btn-mute" type="button" class="sound-opt">Sound On</button>
      <label class="vol">Vol<input id="sound-volume" type="range" min="0" max="100" value="100"></label>
    </div>
    <div class="speed">
      <label class="vol" id="ball-speed-label">Ball Speed<span id="ball-speed-value">100%</span>
        <span class="slider"><input id="ball-speed" type="range" min="50" max="150" step="5" value="100"></span>
      </label>
    </div>
    <div class="fastfwd">
      <button id="fastfwd-off" type="button" class="fastfwd-opt" data-fastfwd="off">Off</button>
      <button id="fastfwd-1-5" type="button" class="fastfwd-opt" data-fastfwd="1.5">1.5&times;</button>
      <button id="fastfwd-2-0" type="button" class="fastfwd-opt selected" data-fastfwd="2.0">2.0&times;</button>
      <button id="fastfwd-3-0" type="button" class="fastfwd-opt" data-fastfwd="3.0">3.0&times;</button>
    </div>
    <div class="fullscreen">
      <button id="btn-fullscreen" type="button" class="fs-opt">Full Screen</button>
    </div>
    <div class="leaderboard" id="leaderboard-start"></div>
    <div class="capsule-legend-heading">Capsules</div>
    <div class="capsule-legend" id="capsule-legend"></div>
    <button id="btn-reset-hiscore" type="button">Reset High Score</button>
    <button id="btn-start" type="button">Start Game</button>
  </section>

  <section class="screen" id="screen-gameover">
    <h1>Game Over</h1>
    <p id="gameover-final">Final score 0</p>
    <div class="leaderboard" id="leaderboard-gameover"></div>
    <button id="btn-restart" type="button">Try Again</button>
    <button id="btn-menu" type="button">Menu</button>
  </section>

  <section class="screen" id="screen-pause">
    <h1>Paused</h1>
    <p>The board is holding &middot; Esc or P resumes</p>
    <p>Esc resume &middot; M menu</p>
    <button id="btn-resume" type="button">Resume</button>
  </section>

// ================================================================
// BRICK BREAKER — campaign 2: shell, paddle, ball, lives, game over,
// brick grid, ball-brick collision, scoring, level progression and
// the win condition
//
// Single file: a default landscape 960×600 (16:10) logical stage —
// the alleyway play mode switches it to a portrait 480×800 arena
// with its own 5×10 brick grid (ticket #76) — rendered at an
// internal-resolution scale factor and letterboxed/centered in the
// viewport (fit, not stretch), a requestAnimationFrame loop with
// a clamped frame delta, start / pause / game-over overlay screens
// (the pause freezes the whole simulation; resume via the overlay
// CTA or a fresh Escape/KeyP press), keyboard and pointer paddle
// control, a served ball with wall and paddle
// bounces (position-dependent angle, speed-preserving), a fixed-pool
// brick grid the ball breaks for colour-valued points, level
// progression on a cleared board (faster serve per level, capped),
// the lose-a-life / game-over / restart flow, and the power-up drop /
// catch framework with the expand paddle, extra ball (a fixed ball
// pool capped at MAX_BALLS — a life is lost only when the last live
// ball falls) and sticky paddle (a timed window during which paddle
// contact catches a ball that a click re-launches) effects, and
// synthesized Web Audio SFX (named recipes per required event on a
// single master gain bus, built on the first user gesture, degrading
// to silent where Web Audio is missing), and the high score
// persisted in localStorage under a named key — loaded at boot,
// shown in the #hiscore top-bar element, and rewritten as a JSON
// number only when the live score overtakes it; a local top-five
// leaderboard under its own named key — populated at game over,
// rendered on the start and game-over screens, and cleared with
// the high score by the single start-screen reset control; a
// start-screen
// difficulty selector (Easy / Normal / Hard) persisted in
// localStorage under its own named key and applied per run; and
// three selectable retro themes (Classic / Neon / Minimal)
// persisted in localStorage under their own named key, driven by
// one THEMES table that at boot and on every selection change
// applies the CSS custom properties and the canvas palette in a
// single pass; named start-screen play modes
// (Classic / Exciting / Alleyway) persisted in localStorage under
// their own named key, snapshotted per run — classic keeps the
// legacy economy (× 1.0 drop factor, the five-kind capsule table,
// the MAX_BALLS live-ball cap); exciting multiplies the preset's
// drop rate by the named EXCITING_DROP_FACTOR and rolls three
// capsule kinds that exist ONLY in its drop table (ticket #75):
// invulnerable (a timed window in which the ball smashes through
// breakable bricks — fixed bricks still stop it — with no capsule
// drops and a tinted, glowing ball), multiball (every in-flight
// ball instantly fans into ten at a fixed angular spread, capped at
// MAX_BALLS_EXCITE concurrent balls on the boot-sized pool), and
// blast (a timed window in which every brick hit detonates all
// breakable bricks within the named radius — one scan per hit, no
// chaining, fixed bricks anchor without breaking); alleyway
// (ticket #76) plays the classic economy on a portrait 480×800
// stage with its own brick grid and pattern table;
// and a start-screen sound toggle with a volume
// slider, persisted as JSON { muted, volume } under their own
// named key and driving the master bus level live (mute wins over
// volume), and a start-screen ball-speed slider (50-150%, persisted
// as an integer percent under its own named key) that beginRun()
// snapshots: it scales each run's serve speed and growth ceiling
// by the same factor; in-repo image assets (assets/bricks) are
// embedded at build time as a marker-delimited base64 payload and
// decoded to cached ImageBitmaps BEFORE the first frame (ticket
// #137 asset contract — degrading to the procedural paint when no
// decoder is available, e.g. the headless vm suites)
// ================================================================

// ---- Tunables (var: addressable as globals, e.g. from the console) ----
var CANVAS_SCALE = 2;             // canvas pixels per stage pixel
// Stage dimensions (logical px). CLASSIC_* is the landscape
// default; ALLEYWAY_* is the portrait arena (ticket #76).
// GAME_W/GAME_H are the RUNTIME stage size: they start at the
// landscape default and beginRun() re-sets them per mode, so the
// backing store, the CSS letterbox fit and the pointer mapping all
// follow the selected mode.
var CLASSIC_W = 960;              // landscape logical stage width (16:10)
var CLASSIC_H = 600;              // landscape logical stage height (16:10)
var ALLEYWAY_W = 480;             // alleyway portrait arena width
var ALLEYWAY_H = 800;             // alleyway portrait arena height
var GAME_W = CLASSIC_W;           // runtime stage width: beginRun() (re)sets per mode
var GAME_H = CLASSIC_H;           // runtime stage height: beginRun() (re)sets per mode
var UI_FONT = "monospace";        // retro face for canvas UI text
var MAX_FRAME_SECONDS = 1 / 30;   // dt clamp: no teleports after tab switches
var random = Math.random;          // mutable hook: test suites pin it for determinism
var HIGH_SCORE_KEY = "brickbreaker.highScore";
var LEADERBOARD_KEY = "brickbreaker.leaderboard";  // top-five list (ticket #48)
var LEADERBOARD_MAX = 5;                           // the top-five cap
var LEADERBOARD_EMPTY_TEXT = "no scores yet";       // empty-list placeholder row
var PLAYER_LIVES = 3;             // lives per run (PRD section 2 loss rule)
// Paddle (internal canvas px, so values scale with CANVAS_SCALE)
var BASE_PADDLE_W = 120;           // resting width; the runtime width widens on expand
var PADDLE_HEIGHT = 14;
var PADDLE_BOTTOM_GAP = 24;       // clear space between paddle and bottom edge
var PADDLE_SPEED = 720;           // keyboard travel speed, px/s (per-run value: runPaddleKeySpeed, #89)
// Boundary dressing (ticket #69): the decorative wall and danger-
// line weights and rhythm. The dash arrays are prebuilt at module
// load — setLineDash must receive the SAME reference every frame,
// never a fresh literal, or the draw path would churn garbage.
var WALL_LINE_W = 2;               // solid wall thickness, canvas px
var DANGER_LINE_W = 2;             // dashed danger-line thickness, canvas px
var DANGER_DASH = [12, 10];        // on/off rhythm of the bottom danger line, canvas px
var NO_DASH = [];                  // setLineDash reset argument (restores solid)
// Ball
var BALL_RADIUS = 8;
var MAX_BALLS = 5;              // normal-play live-ball cap (classic); extra-ball catches stop here
var MAX_BALLS_EXCITE = 30;      // EXCITING concurrent-ball cap (multiball x10); the ball pool is sized to this at boot
var BALL_SERVE_SPEED = 480;       // level-1 launch speed on click/tap, px/s
var LEVEL_SPEED_GROWTH = 1.15;    // per-level serve-speed multiplier (PRD section 4)
var MAX_BALL_SPEED = 1500;        // ceiling the per-level growth caps at, px/s
// Ball-speed option (ticket #73): the start-screen slider's bounds
// and default, in percent. The slider never replaces the named
// serve knobs — beginRun() multiplies them by ballSpeedPct/100.
var BALL_SPEED_KEY = "brickbreaker.speed";
var MIN_BALL_SPEED_PCT = 50;
var MAX_BALL_SPEED_PCT = 150;
var DEFAULT_BALL_SPEED_PCT = 100;
var MAX_PADDLE_BOUNCE_ANGLE = Math.PI / 3;  // 60 deg from vertical at the rim
// Random lateral jitter added to every serve launch angle (#97):
// kills the "park the paddle, eat a whole column" exploit. Bound:
// |rel * MAX_PADDLE_BOUNCE_ANGLE + jitter|
//   <= PI/3 + LAUNCH_JITTER_ANGLE < PI/2,
// so cos(ang) > 0 and the ball ALWAYS leaves upward (vy < 0)
// for the full rel range [-1,1] at any draw. Console-retunable.
var LAUNCH_JITTER_ANGLE = 0.12;            // ~6.9 deg of lateral randomness per launch
// Pin nudge: when collideBricks pins a ball flush to a brick face it
// nudges it this far OUTSIDE, so a re-computed overlap of the pinned
// position is strictly zero — a flush pin can never re-register as
// (ULP-rounding-dependent) contact on a LATER frame.
var BRICK_PIN_EPS = 1e-6;
// Bricks: grid geometry (internal canvas px) over a fixed-size pool
var CLASSIC_BRICK_ROWS = 5;       // landscape grid rows
var CLASSIC_BRICK_COLS = 10;      // landscape grid columns
var ALLEYWAY_BRICK_ROWS = 10;     // alleyway portrait grid rows
var ALLEYWAY_BRICK_COLS = 5;      // alleyway portrait grid columns
var BRICK_ROWS = CLASSIC_BRICK_ROWS; // runtime: beginRun() (re)sets per mode
var BRICK_COLS = CLASSIC_BRICK_COLS; // runtime: beginRun() (re)sets per mode
// BRICK_SIDE_MARGIN was 24 px (ticket #98): that left the outermost
// bricks so close to the side walls that the limited angles the
// paddle can impart made off-centre bricks almost unreachable.
// Widened to 40 canvas px in BOTH modes (classic 10-col and
// alleyway 5-col portrait — see the #98 entry in docs/DECISIONS.md)
// so balls have breathing room to develop reflection angles; the
// field stays centred and symmetric because layoutBricks() derives
// the column width from the margin. Modest, not a reflow.
var BRICK_SIDE_MARGIN = 40;
var BRICK_TOP_MARGIN = 64;   // untouched by the #98 widening
var BRICK_GAP = 6;
var BRICK_HEIGHT = 26;
// Hard bound on the post-hit seam drain in updateBalls(). With
// multi-hit bricks (ticket #42) a ball wedged in a gap narrower
// than itself can ping-pong between the two seam faces forever:
// clearing the left neighbour needs the centre at
// leftRightFace + R or beyond, clearing the right neighbour needs
// it at rightLeftFace - R or below, and the two bounds are
// 2*R - GAP apart with 2*R > GAP — no position satisfies both.
// The drain therefore rescan-caps at one-plus-the-pool-size;
// residual overlap past the cap is the documented seam artifact,
// never a busy loop.
var MAX_BRICK_RESCANS_PER_SUBSTEP = BRICK_ROWS * BRICK_COLS + 1;
// Brick colours map to named per-colour point values (PRD section 2)
// and per-colour durability (ticket #42): the top tier is
// multi-hit, the base tier is one-hit, so a colour still encodes
// exactly one point value.
var COLOR_BRICK_A = "#ef5d62";
var POINTS_BRICK_A = 30;
var COLOR_BRICK_B = "#f2a541";
var POINTS_BRICK_B = 20;
var COLOR_BRICK_C = "#4fc1e9";
var POINTS_BRICK_C = 10;
// Per-tier hit points to break (ticket #42): the top tier takes the
// most hits, the base tier still dies in one. The fixed tier scores
// zero and can never be charged (unbreakable); its hp of 0 keeps its
// wear depth (`tier.hp - b.hp`) at 0, so it always renders the base
// ramp stage and never a crack.
var HP_BRICK_A = 3;
var HP_BRICK_B = 2;
var HP_BRICK_C = 1;
var HP_BRICK_FIXED = 0;
// Fixed bricks (ticket #43): unbreakable, worth nothing — a ball
// must get behind them, not break them. The tier is a table entry
// like the others so the draw pass stays a plain colour lookup.
var COLOR_BRICK_FIXED = "#8b93a7";
var POINTS_BRICK_FIXED = 0;
var BRICK_TIERS = [
  { color: COLOR_BRICK_A, points: POINTS_BRICK_A, hp: HP_BRICK_A },

// ---- Audio: synthesized SFX on a master gain bus (ticket #27) ----
// All sound effects are synthesized with the Web Audio API (PRD
// section 4) — no audio files. The context is constructed only on
// the first user gesture (click or keydown), never on page load;
// before then — and in engines without Web Audio — every schedule is
// a silent no-op. Each sound's envelope gain connects to the single
// MASTER_BUS gain node, whose level tracks MASTER_GAIN live so a
// console reassignment applies to the next sound (and 0 silences
// everything). Mirrors the campaign-1 audio architecture (ticket #9).
var MASTER_GAIN = 0.2;                 // master bus level (0..1); the sound-settings block rewrites it from effectiveMaster() at boot and on every change
var WAVE_SINE = "sine";               // named waveform sources
var WAVE_SQUARE = "square";
var WAVE_NOISE = "noise";
// Named per-recipe constants: wave, frequency (Hz) and duration (s).
var SFX_PADDLE_BOUNCE = { wave: WAVE_SINE,   freq: 220, dur: 0.05 };
var SFX_BRICK_BREAK   = { wave: WAVE_NOISE,  freq: 900, dur: 0.09 };

// bus; freq is filled per hit from SFX_BRICK_CHIP_FREQ (indexed by
// the hp the brick had at impact), so the pitch descends as the
// brick weakens. The recipe object is shared and mutated in place —
// the hit path allocates nothing of its own.
// Chip pitch by hp-at-impact (index = hp, [1..3]): rising with hp so
// a weakening brick's cues descend (tier-3 > tier-2 > tier-1), and
// every entry sits below the destruction pop (SFX_BRICK_BREAK.freq
// = 900) so chip and pop read differently. Declared before the recipe
// so the recipe's initial freq cannot drift from the table.
var SFX_BRICK_CHIP_FREQ = [0, 440, 550, 660];
var SFX_BRICK_CHIP    = { wave: WAVE_SINE,   freq: SFX_BRICK_CHIP_FREQ[3], dur: 0.04 };

// on the same bus. Deliberately distinct and quieter than the brick
// chip/pop — a different wave (square, not the chip's sine or the
// pop's noise), a frequency below every chip pitch and the pop,
// and its OWN envelope peak (SFX_WALL_BOUNCE_PEAK) at half the
// standard SFX_PEAK, so rapid wall rattle reads as quiet texture
// instead of competing with brick sounds. The optional `peak` field
// makes scheduleSound() honour a per-recipe level; recipes without
// one keep peaking at SFX_PEAK exactly as before.
var SFX_WALL_BOUNCE_PEAK = 0.25;      // boot-time default: half of SFX_PEAK at startup, so the rattle stays quiet

// siblings, scheduled through the SAME scheduleSound() bus/envelope
// path — the mute/volume plumbing therefore applies unchanged.
var SFX_CATCH_INVULNERABLE = { wave: WAVE_SINE,   freq: 880,  dur: 0.10 };
var SFX_CATCH_MULTIBALL    = { wave: WAVE_SQUARE, freq: 990,  dur: 0.12 };
var SFX_CATCH_BLAST        = { wave: WAVE_NOISE,  freq: 1200, dur: 0.15 };
var SFX_GAME_OVER     = { wave: WAVE_SINE,   freq: 110, dur: 0.50 };
var SFX_PEAK = 0.5;                    // envelope peak for every recipe that carries no own `peak` (SFX_WALL_BOUNCE peaks lower); the bus scales it

var SFX_EXP_EPS = 1e-4;                // exp-ramp guard: start and target stay positive
var SFX_NOISE_BUFFER_SECONDS = 0.25;   // shared noise source length

var MASTER_BUS = null;                 // the one gain node wired to destination
var noiseBuffer = null;                // white noise, built once, reused per hit
// Build the audio graph on the first user gesture; later calls reuse
// the existing context, resuming it if the browser has suspended it.
// Silently no-ops when the platform has no Web Audio.
function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return;
  }
  if (typeof AudioContext === "undefined") return; // silent, no error
  audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  MASTER_BUS = audioCtx.createGain();
  MASTER_BUS.gain.value = MASTER_GAIN;
  MASTER_BUS.connect(audioCtx.destination);
  var frames = Math.max(1, Math.ceil(audioCtx.sampleRate * SFX_NOISE_BUFFER_SECONDS));
  noiseBuffer = audioCtx.createBuffer(1, frames, audioCtx.sampleRate);
  var data = noiseBuffer.getChannelData(0);
  for (var i = 0; i < data.length; i += 1) data[i] = random() * 2 - 1;
}
// Schedule one shot of a named recipe: the source — an oscillator for
// sine/square, or the shared noise buffer through a lowpass at the
// recipe frequency for noise — feeds a freshly shaped envelope gain,
// which connects to the single MASTER_BUS. The envelope peaks at the
// recipe's own `peak` when it carries one (SFX_WALL_BOUNCE's quiet
// rattle level), else SFX_PEAK, then decays to SFX_DECAY_FLOOR at
// the recipe duration, so the node's audio is bounded. Both ramp
// values are clamped to SFX_EXP_EPS (exp ramps must stay positive);
// the start is set at the schedule time, so a console zeroed
// SFX_PEAK / SFX_DECAY_FLOOR (read live here) or a recipe
// .peak (also read live) can never make the scheduler throw.
function scheduleSound(recipe) {
  if (!audioCtx) return; // audio not enabled yet: silent no-op
  var t0 = audioCtx.currentTime;
  MASTER_BUS.gain.value = MASTER_GAIN; // live console retunes apply
  var peak = recipe.peak === undefined ? SFX_PEAK : recipe.peak;
  var input = null; // node feeding the envelope
  if (recipe.wave === WAVE_NOISE) {
    input = audioCtx.createBiquadFilter();
    input.type = "lowpass";
    input.frequency.value = recipe.freq;
    var noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    noiseSrc.connect(input);
    noiseSrc.start(t0);
    noiseSrc.stop(t0 + recipe.dur);
  } else {
    input = audioCtx.createOscillator();
    input.type = recipe.wave;
    input.frequency.value = recipe.freq;
  }
  var env = audioCtx.createGain();
  env.gain.setValueAtTime(Math.max(peak, SFX_EXP_EPS), t0);
  env.gain.exponentialRampToValueAtTime(
    Math.max(SFX_DECAY_FLOOR, SFX_EXP_EPS), t0 + recipe.dur);
  input.connect(env);
  env.connect(MASTER_BUS);
  if (input.start) { // oscillator path (buffer sources started above)
    input.start(t0);
    input.stop(t0 + recipe.dur);
  }
}
// Schedule the non-lethal chip cue for a multi-hit brick (ticket
// #72): pitch keyed on the hp the brick had at impact, so a 3-hp
// brick's first chip is higher than its second. Reuses the shared
// SFX_BRICK_CHIP recipe in place — no per-hit allocation. The fatal
// hit plays the destruction pop instead and never calls here.
function scheduleBrickChip(hpAtHit) {
  // Clamp assumes the table covers exactly [1..3] hp (the current max
  // tier hp); a future >3-hp tier would silently chip at the 3-hp
  // pitch — extend SFX_BRICK_CHIP_FREQ before raising any tier's hp.
  var i = Math.min(Math.max(1, hpAtHit), SFX_BRICK_CHIP_FREQ.length - 1);
  SFX_BRICK_CHIP.freq = SFX_BRICK_CHIP_FREQ[i];
  scheduleSound(SFX_BRICK_CHIP);
}

// ---- Leaderboard: the local top five (ticket #48) ----
// The in-memory mirror of the stored list: at most LEADERBOARD_MAX
// positive integers in descending order. The one insertion point is
// enterGameOver(): a final score records iff it is an integer > 0
// and the list has room, or strictly beats the list's lowest entry —
// a tie with the lowest of a FULL list never displaces it, and
// duplicates are kept while the list has room.
function loadLeaderboard() {
  try {
    var value = JSON.parse(localStorage.getItem(LEADERBOARD_KEY));
    if (!Array.isArray(value)) return [];
    var list = [];
    for (var i = 0; i < value.length; i += 1) {
      // One invalid entry voids the whole stored list: a botched
      // write must never leak into the ranking.
      if (!Number.isInteger(value[i]) || value[i] <= 0) return [];
      list.push(value[i]);
    }
    // The write path always stores descending order; re-sort and
    // re-cap at load so hand-edited storage is normalised, not
    // trusted.
    list.sort(function (a, b) { return b - a; });
    return list.slice(0, LEADERBOARD_MAX);
  } catch {
    return []; // storage unavailable, blocked, or corrupt: empty start
  }
}
function saveLeaderboard() {
  try {
    localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboard));
  } catch {
    // Non-persistent storage (e.g. blocked): the session still works.
  }
}
// Inserts a run's final score; reports whether the list changed.
function recordLeaderboardScore(finalScore) {
  if (!Number.isInteger(finalScore) || finalScore <= 0) return false;
  if (leaderboard.length >= LEADERBOARD_MAX &&
      finalScore <= leaderboard[leaderboard.length - 1]) return false;
  leaderboard.push(finalScore);
  leaderboard.sort(function (a, b) { return b - a; });
  while (leaderboard.length > LEADERBOARD_MAX) leaderboard.pop();
  saveLeaderboard();
  renderLeaderboards();
  return true;
}
// Both screen containers re-drawn in one pass; it runs only at
// boot, insertion, or reset — never in the per-frame path. An empty
// list renders as the single placeholder row, keeping both screens'
// layout identical.
function renderLeaderboards() {
  for (var j = 0; j < leaderboardEls.length; j += 1) {
    var box = leaderboardEls[j];
    while (box.firstChild) box.removeChild(box.firstChild);
    if (leaderboard.length === 0) {
      var placeholder = document.createElement("div");
      placeholder.className = "leaderboard-row placeholder";
      placeholder.textContent = LEADERBOARD_EMPTY_TEXT;
      box.appendChild(placeholder);
      continue;
    }
    for (var i = 0; i < leaderboard.length; i += 1) {
      var row = document.createElement("div");
      row.className = "leaderboard-row";
      row.textContent = (i + 1) + ". " + leaderboard[i];
      box.appendChild(row);
    }
  }
}
// The single clearing control (ticket #48): one click deletes BOTH
// persistence keys and drops both in-memory mirrors to their empty
// baselines; a later qualifying run re-persists records as usual.

  } catch {
    // As above.
  }

  leaderboard.length = 0;
  syncHud();
  renderLeaderboards();
}

// ---- Native full screen (ticket #113) ----
// document.body is the toggle target: the canvas, HUD and overlay
// screens go full screen together — no wrapper DOM (see
// docs/DECISIONS.md). The SINGLE source of truth is
// document.fullscreenElement; the button is a pure mirror synced
// by the fullscreenchange pass. Esc is left to the browser (it
// exits natively and the pass below reacts to the change).
var FS_LABEL_OFF = "Full Screen";
var FS_LABEL_ON = "Exit Full Screen";
function toggleFullscreen() {
  // Feature-support guard: browsers without the API get a silent
  // no-op, never an error.
  if (typeof document.requestFullscreen !== "function") return;
  // Both calls return a promise; a permission denial or transient
  // failure must NEVER throw into a user gesture (docs/DECISIONS.md).
  var promise = document.fullscreenElement
    ? document.exitFullscreen()
    : document.body.requestFullscreen();
  if (promise && typeof promise.catch === "function") {
    promise.catch(function () {});
  }
}
// Reflect the browser's actual state onto the button; called at
// boot and on every fullscreenchange.
function syncFullscreenButton() {
  var active = !!document.fullscreenElement;
  btnFullscreen.textContent = active ? FS_LABEL_ON : FS_LABEL_OFF;
  // Toggle ONLY the `active` token, leaving any other class on the
  // button untouched (a wholesale className write would clobber them).
  var tokens = btnFullscreen.className.split(" ").filter(function (t) { return t !== "" && t !== "active"; });
  if (active) tokens.push("active");

}

// pass enqueues the SAME deferred refit the resize path uses —

function onFullscreenChange() {
  syncFullscreenButton();
  resizePending = true;
}
document.addEventListener("fullscreenchange", onFullscreenChange);
btnFullscreen.addEventListener("click", function () {
  toggleFullscreen();

syncFullscreenButton(); // boot: before the first frame

function loadSoundSettings() {

    if (typeof value.muted === "boolean") muted = value.muted;
    if (Number.isInteger(value.volume) &&

  } catch {

      JSON.stringify({ muted: soundMuted, volume: soundVolume }));
  } catch {
    // Non-persistent storage (e.g. blocked): the session still works.
  }

  applySoundSettings(!soundMuted, soundVolume);

soundVolumeInput.addEventListener("input", function () {

  var v = parseInt(soundVolumeInput.value, 10);
  var volume = Number.isInteger(v) ? Math.min(100, Math.max(0, v)) : soundVolume;

// ---- Ball-speed option: start-screen slider (ticket #73) ----
// The percent by which each run's serve speed and growth ceiling
// are scaled, persisted as a JSON integer under the named key (the
// high-score / difficulty / theme / sound encoding precedent).
// Corrupt or out-of-range stored values fall back to the default:
// a botched write must never break boot. beginRun() snapshots the
// live value, so a mid-run move only affects the NEXT run — the
// slider scales the named serve knobs, never replaces them.
//
// Ticket #90: the slider steps 50..150 in 5% increments (step="5"),
// a live readout next to the row label mirrors the current percent
// (boot, input, double-click reset), and a double-click on the readout
// or the row label is the reset gesture back to 100. An off-grid hand-
// stored value (e.g. 123) still loads and displays untouched —
// only a user move re-anchors onto the grid (nearest stop).
function loadBallSpeed() {
  try {
    var value = JSON.parse(localStorage.getItem(BALL_SPEED_KEY));
    return Number.isInteger(value) &&
      value >= MIN_BALL_SPEED_PCT && value <= MAX_BALL_SPEED_PCT
      ? value
      : DEFAULT_BALL_SPEED_PCT;
  } catch {
    return DEFAULT_BALL_SPEED_PCT; // storage unavailable, blocked, or corrupt: play on
  }
}
function saveBallSpeed() {
  try {
    // Persisted as a JSON integer: 125, not "125".
    localStorage.setItem(BALL_SPEED_KEY, JSON.stringify(ballSpeedPct));
  } catch {
    // Non-persistent storage (e.g. blocked): the session still works.
  }
}
// Ticket #90: the 5% snap grid (step="5") — console-retunable, like
// the other ball-speed knobs. Clamps into [50, 150], then anchors
// onto the nearest stop: the floor 50 is grid-aligned, so stops are
// 50, 55, ..., 150.
var BALL_SPEED_STEP_PCT = 5;
function snapBallSpeedPct(raw) {
  var clamped = Math.min(MAX_BALL_SPEED_PCT, Math.max(MIN_BALL_SPEED_PCT, raw));
  return MIN_BALL_SPEED_PCT +
    Math.round((clamped - MIN_BALL_SPEED_PCT) / BALL_SPEED_STEP_PCT) *
    BALL_SPEED_STEP_PCT;
}
var ballSpeedPct = loadBallSpeed();
// Ticket #90: the readout span and the row label (the label wraps
// the readout, so in a real browser a double-click on either target
// hits the single handler below). Both are start-screen controls:
// event wiring only, never touched by the frame loop.
var ballSpeedValue = document.getElementById("ball-speed-value");
var ballSpeedLabel = document.getElementById("ball-speed-label");

// called at boot (storage may override the static 100 default) and
// by the double-click reset. Pure DOM writes, no storage traffic.
function syncBallSpeedControl() {
  if (ballSpeedInput.value !== String(ballSpeedPct)) {
    ballSpeedInput.value = String(ballSpeedPct);
  }
  if (ballSpeedValue.textContent !== String(ballSpeedPct) + "%") {
    ballSpeedValue.textContent = String(ballSpeedPct) + "%";
  }
}
syncBallSpeedControl(); // boot: before the first frame
ballSpeedInput.addEventListener("input", function () {
  // A range input reports its own value as a string; clamp into
  // [50, 150] and snap onto the 5% grid (ticket #90) so programmatic
  // off-grid writes degrade to the nearest stop. An identical
  // re-application is a no-op, so no redundant storage write fires.
  var v = parseInt(ballSpeedInput.value, 10);
  if (!Number.isInteger(v)) return;
  var pct = snapBallSpeedPct(v);
  if (pct === ballSpeedPct) return;
  ballSpeedPct = pct;
  saveBallSpeed();
  syncBallSpeedControl();
});
// The reset gesture (ticket #90): a double-click on the readout or
// the row label parks the slider at the 100% notch. Exactly one
// persistence write; an already-100 gesture is a no-op that writes
// nothing (the same invariant as a no-op slider move).
function resetBallSpeed(e) {
  // A double-click on the SLIDER itself is a fine-adjust gesture, not a
  // reset: the label wraps the input, so its double-clicks bubble up
  // here — swallow those and honour the gesture on the text only.
  if (e && e.target === ballSpeedInput) return;
  if (ballSpeedPct === DEFAULT_BALL_SPEED_PCT) return;
  ballSpeedPct = DEFAULT_BALL_SPEED_PCT;
  saveBallSpeed();
  syncBallSpeedControl();

ballSpeedLabel.addEventListener("dblclick", resetBallSpeed);

// ---- Fixed-aspect stage ----
// The playfield is a GAME_W × GAME_H logical stage whose mode
// (landscape classic/exciting, portrait alleyway — ticket #76)
// beginRun() (re)selects; the backing store (stage × CANVAS_SCALE)
// follows it via resizeCanvas(). The visible size is the largest
// stage-shaped rectangle fitting the viewport, written as CSS px
// (letterbox, centered by CSS) — fit, not stretch (PRD section 5
// responsive scaling). The fit is UNCAPPED: on large viewports the
// stage up-scales (fit > 1) so the game grows with the screen,
// and on small viewports it still down-scales (fit < 1), always
// preserving the stage aspect. The backing store stays
// GAME_W × CANVAS_SCALE — the browser scales the bitmap via the
// CSS size, which suits the chunky retro raster (see
// docs/DECISIONS.md, ticket #101).
function resizeCanvas() {
  if (canvas.width !== GAME_W * CANVAS_SCALE) canvas.width = GAME_W * CANVAS_SCALE;
  if (canvas.height !== GAME_H * CANVAS_SCALE) canvas.height = GAME_H * CANVAS_SCALE;
  fitStageCss();
}
function fitStageCss() {
  // No 1:1 cap (ticket #101): the stage grows with the screen.
  var fit = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
  var w = Math.round(GAME_W * fit) + "px";
  var h = Math.round(GAME_H * fit) + "px";
  if (canvas.style.width !== w) canvas.style.width = w;
  if (canvas.style.height !== h) canvas.style.height = h;
}
window.addEventListener("resize", function () {
  resizePending = true; // defer the refit to the next frame
});

// ---- HUD (write-through only when a value changed) ----
function setText(el, value) {
  var text = String(value);
  if (el.textContent !== text) el.textContent = text;
}
function syncHud() {
  setText(hudScore, score);
  setText(hudLevel, level);
  setText(hiscoreEl, highScore);
}

// ---- Paddle (input + kinematics) ----
function paddleTop() {
  return canvas.height - PADDLE_BOTTOM_GAP - PADDLE_HEIGHT;
}
function clampPaddle() {
  var half = paddleW / 2;
  if (paddle.x < half) paddle.x = half;
  if (paddle.x > canvas.width - half) paddle.x = canvas.width - half;
}
function updatePaddle(dt) {
  // update() only runs in "playing", so releasing a key stops the
  // paddle automatically; both key and pointer write the same x.
  var dir = (keys.right.size > 0 ? 1 : 0) - (keys.left.size > 0 ? 1 : 0);
  if (dir !== 0) paddle.x += dir * runPaddleKeySpeed * dt;
  clampPaddle();
}
function onKeyDown(e) {
  ensureAudio(); // a keydown is a user gesture: build the audio graph once
  if (e.code === "Escape" || e.code === "KeyP") {
    onPauseKeyPress(e.code);
  } else if (e.code === "KeyM") {
    // Abandon a paused run to the start screen. Gated to "paused"
    // alone: in every other state M is a no-op (no pause from start,
    // no churn on game over), and browser auto-repeat of a held M
    // lands in "start" after the first edge, so it is a no-op too.
    if (gameState === "paused") quitToMenu();
  } else if (e.code === "KeyF") {
    // Native full screen toggle (ticket #113): valid in ANY game
    // state (a keydown is a user gesture). No preventDefault
    // needed. The repeat guard stops a HELD F flapping the toggle
    // — only the press edge counts (docs/DECISIONS.md).
    if (e.repeat) return;
    toggleFullscreen();
  } else if (e.code === "KeyL" || e.code === "KeyK") {
    // Secret level-skip keys (ticket #77, deliberately undocumented
    // in the UI — docs/DECISIONS.md is the record): Shift+L advances
    // exactly as a clear would, Shift+K steps back one level.
    // Gated to "playing" alone; the held-set mirrors the pause-key
    // edge gate so auto-repeat steps once per physical press, and
    // the shiftKey flag is read on the press itself, so a Shift that
    // is released before the letter is never a combo.
    if (!e.shiftKey || levelSkipKeys.has(e.code)) return;
    levelSkipKeys.add(e.code);
    if (gameState === "playing") {
      if (e.code === "KeyL") advanceLevel();
      else stepLevelBack();
    }
  } else if (e.code === "ArrowLeft" || e.code === "KeyA") {
    keys.left.add(e.code);
    e.preventDefault();
  } else if (e.code === "ArrowRight" || e.code === "KeyD") {
    keys.right.add(e.code);
    e.preventDefault();
  } else if (e.code === "Space" || e.code === "Enter") {
    // The keyboard twin of the canvas click/tap: routes through the
    // same launch path (launchAttachedBalls), not a duplicate physics.
    // State gating is that function's job — outside "playing" (and
    // while no ball is attached) the press is a no-op. Space and
    // Enter are not pause keys, so the pause screen stays put.
    launchAttachedBalls();
    // Deliberately no preventDefault: the page is overflow:hidden
    // (nothing to scroll), and suppressing the Enter/Space default
    // would disable native keyboard activation of a focused CTA
    // (e.g. Tab to Resume + Enter); the resulting CTA re-clicks are
    // all state-gated no-ops.

function onKeyUp(e) {

  else if (e.code === "KeyL" || e.code === "KeyK") levelSkipKeys.delete(e.code);
  else if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left.delete(e.code);
  else if (e.code === "ArrowRight" || e.code === "KeyD") keys.right.delete(e.code);
}
// A blurred window drops its keyups; clear the held sets with it so
// the paddle cannot keep gliding on ghost keys and the next Escape
// press cannot be swallowed as a ghost-held pause key.
function onBlur() {
  pauseKeys.clear();
  levelSkipKeys.clear();
  keys.left.clear();
  keys.right.clear();
  rmbHeld = false; // a blurred release cannot leave the warp stuck
}
window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);
window.addEventListener("blur", onBlur);
// Fast-forward hold (ticket #102): only button 2 (the right mouse)
// arms the flag; a window-level mouseup (button 2), blur, or cancel
// releases it, so a button-up that lands off-page, a tab switch, or
// an aborted track can never leave a stuck warp.
var rmbHeld = false;
function onRmbDown(e) {
  if (e.button === 2) rmbHeld = true;
}
function releaseRmbHeld(e) {
  if (e.button === 2) rmbHeld = false;
}
// A genuine window "cancel" (tracking aborted) normally carries no

function cancelRmbHeld() {

window.addEventListener("mousedown", onRmbDown);
window.addEventListener("mouseup", releaseRmbHeld);
window.addEventListener("cancel", cancelRmbHeld);
// Right-click over the stage is game input (fast-forward), not a
// browser menu: the context menu is suppressed over the canvas at
// ALL states (documented judgement, ticket #102 — the overlays
// cover the stage except in play, where the suppression matters).
canvas.addEventListener("contextmenu", function (e) {
  e.preventDefault();
});
// The canvas CSS footprint is the letterboxed stage rect, so the
// client-px -> internal-px transform maps through the bounding
// rect: a fraction of the visible stage width becomes a fraction

// event, so a window resize can never leave a stale rect behind.
// Steering is instant 1:1 positional tracking (ticket #95,
// superseding the #91 step cap and out-of-rect hold): the mapped
// x is assigned directly and clamped to the paddle's reachable
// range. Over the stage the paddle centre sits exactly under the
// cursor; a cursor left/right of the stage hugs the corresponding
// wall; a cursor above/below the stage (vertical letterbox, HUD)
// still steers by its horizontal position. A large jump is just
// "aim, and the paddle goes there" — aiming, which is what the
// cursor is for (the #40-era teleport complaint predates the
// rect-relative, clamped mapping).
// Two guards survive: a degenerate rect (zero width, e.g. while
// the canvas is hidden) is ignored — dividing by it would poison
// every later event — and a malformed clientX (missing/NaN) is

function setPaddleX(clientX) {
  var rect = canvas.getBoundingClientRect();

  if (isNaN(clientX)) return; // malformed coordinate: ignore the event
  paddle.x = ((clientX - rect.left) / rect.width) * canvas.width;
  clampPaddle(); // wall-hug: clamps to the reachable range
}
// Window-level pointer tracking (ticket #40, steering redesigned
// by #95): the listeners live on window, not the canvas, so the
// paddle keeps following the cursor wherever it is — over the
// stage it tracks 1:1, off the stage it hugs the nearest wall.
window.addEventListener("mousemove", function (e) {
  setPaddleX(e.clientX);
});
window.addEventListener("touchmove", function (e) {
  if (e.touches && e.touches.length > 0) {
    setPaddleX(e.touches[0].clientX);
  }
  e.preventDefault(); // keep the page from scrolling while dragging
}, { passive: false });

// ---- Bricks (fixed-size pool, mutated in place across levels) ----
// Geometry derives from the run's stage size (the backing store is
// fixed FOR A RUN — beginRun() picks it per mode and it holds for
// the whole run), so one layout is stable for the run and never
// needs a re-fit.
function layoutBricks() {
  var bw = (canvas.width - 2 * BRICK_SIDE_MARGIN - (BRICK_COLS - 1) * BRICK_GAP) / BRICK_COLS;
  for (var i = 0; i < bricks.length; i += 1) {
    var row = Math.floor(i / BRICK_COLS);
    var col = i % BRICK_COLS;
    bricks[i].x = BRICK_SIDE_MARGIN + col * (bw + BRICK_GAP);
    bricks[i].y = BRICK_TOP_MARGIN + row * (BRICK_HEIGHT + BRICK_GAP);
    bricks[i].w = bw;
    bricks[i].h = BRICK_HEIGHT;
  }
}
// Activate the pattern assigned to the current level (module
// global) into the fixed pool in place: the run's mode owns the
// table (ticket #76) — alleyway levels pull from the portrait
// ALLEYWAY_LEVEL_PATTERNS, so a portrait board never reads as a
// transposed landscape wall — and level k takes table[(k - 1) %
// table.length], cycling forever with no allocation. '.' leaves a
// cell dormant, a tier letter arms the matching one-hit tier, 'X'
// arms the unbreakable fixed tier. bricksLeft counts breakable
// bricks only, so fixed bricks never block a win.
function spawnLevel() {
  // Every board transition is shard-free: the killing blow on the
  // LAST brick can burst debris the same frame the next board spawns
  // (advanceLevel runs straight through), so the SPAWN — not just
  // the run reset — drains the decorative pool. No shard ever paints
  // over a fresh board.
  for (var d = 0; d < debris.length; d += 1) debris[d].active = false;
  var table = runMode === "alleyway" ? ALLEYWAY_LEVEL_PATTERNS : LEVEL_PATTERNS;
  var pattern = table[(level - 1) % table.length];
  var left = 0;
  for (var i = 0; i < bricks.length; i += 1) {
    var row = Math.floor(i / BRICK_COLS);
    var col = i % BRICK_COLS;
    var line = pattern[row];
    var ch = line ? line.charAt(col) : "";
    if (ch === "") ch = ".";
    var b = bricks[i];
    b.charged = false; // new board: frame damage flags reset
    if (ch === ".") {
      b.active = false;
      b.tier = 0; // dormant cells carry no tier: the pool's state
                  // stays a pure function of the current pattern
      b.unbreakable = false;
    } else {
      b.active = true;
      b.tier = CELL_TIER[ch];
      b.unbreakable = ch === "X";
      b.hp = BRICK_TIERS[b.tier].hp; // full durability
      if (ch !== "X") left += 1;
    }
  }
  bricksLeft = left;
  layoutBricks();
}
// One kill path shared by the lethal physics hit, the blast radius
// (ticket #75) and console access: a brick whose durability the hit
// drained to zero is destroyed outright, credits exactly its tier's
// points (times the live multiplier), and the final brick wins the
// level. Fixed bricks are immune — a kill attempt on them is a
// silent no-op. No capsule drop fires while the invulnerability
// window is live (ticket #75): pass-through kills must not cascade
// into fresh capsule rain.
function destroyBrick(index) {
  var b = bricks[index];
  if (!b.active || b.unbreakable) return;
  var cx = b.x + b.w / 2;   // burst + drop anchor BEFORE the kill
  var cy = b.y + b.h / 2;
  b.active = false;
  bricksLeft -= 1;
  burstDebris(cx, cy, index * 977 + score);
  // A kill while the multiplier window is armed is worth MULT_VALUE
  // times the tier's points.
  var pts = BRICK_TIERS[b.tier].points;
  score += simTime < multUntil ? pts * MULT_VALUE : pts;
  scheduleSound(SFX_BRICK_BREAK);
  syncHud();
  if (!invulnActive()) maybeDropCapsule(b.x + b.w / 2, b.y + b.h);
  if (bricksLeft === 0) advanceLevel();
}
// EXCITING-mode window predicates (ticket #75): the expiry vars are
// sim-time stamps (the expand/sticky/mult convention), -1 = unarmed.
function invulnActive() {
  return invulnUntil !== -1 && simTime < invulnUntil;
}
function blastActive() {
  return blastUntil !== -1 && simTime < blastUntil;
}
// Cleared board: the level rises by exactly 1, the next layout is
// spawned into the same pool, and the next serve is the current
// speed grown by LEVEL_SPEED_GROWTH (capped at the run's scaled
// serve ceiling).
function advanceLevel() {
  level += 1;
  serveSpeed = Math.min(serveSpeed * LEVEL_SPEED_GROWTH, serveCeiling);
  spawnLevel();
  serveBall();
  syncHud();
}
// Step back one level, flooring at 1 (ticket #77): the target
// level's layout respawns pristine into the same pool, and the
// serve speed is RECOMPUTED as the level's own legitimate speed —
// the run's level-1 base grown by the named factor per level
// (capped exactly like the forward progression) — not a delta off
// whatever the drifted runtime speed holds. Score, lives and the
// multiplier window are untouched.
function stepLevelBack() {
  if (level <= 1) return; // the floor: level 1 cannot go back
  level -= 1;
  serveSpeed = Math.min(
    runServeBase * Math.pow(LEVEL_SPEED_GROWTH, level - 1),
    serveCeiling // the run's scaled ceiling, so back-steps agree with the forward chain under the slider
  );
  spawnLevel();
  serveBall();
  syncHud();
}

// ---- Power-ups (drop / fall / catch, ticket #25) ----
// A destroyed brick rolls its drop through the mutable `random` hook
// against the run's capsule table (the mode's list — the classic five
// kinds or the exciting eight, ticket #75); a hit takes the first free
// slot of the fixed pool, so a drop never allocates and quietly
// vanishes when the pool is full.
function maybeDropCapsule(x, y) {
  if (random() >= dropRate) return; // rolled against the run's snapshot
  for (var i = 0; i < capsules.length; i += 1) {
    var c = capsules[i];
    if (c.active) continue;
    c.active = true;
    c.kind = runCapsuleKinds[Math.floor(random() * runCapsuleKinds.length)];
    c.x = x;
    c.y = y;
    return;
  }
}
// One dispatch per kind; later effects slot in here. Catching expand
// (re)arms the widen: the expiry is set to now + the full duration,
// never added to whatever the previous arm had left. The blip is the
// shared catch sound for the legacy five kinds and a small distinct
// recipe per EXCITING kind (ticket #75) — both through the same bus.
function applyCapsule(kind) {
  if (kind === KIND_INVULNERABLE) {
    scheduleSound(SFX_CATCH_INVULNERABLE);
  } else if (kind === KIND_MULTIBALL) {
    scheduleSound(SFX_CATCH_MULTIBALL);
  } else if (kind === KIND_BLAST) {
    scheduleSound(SFX_CATCH_BLAST);
  } else {
    scheduleSound(SFX_POWERUP_CATCH); // the legacy catch blip
  }
  if (kind === KIND_EXPAND) {
    paddleW = basePaddleW * PADDLE_EXPAND_FACTOR;
    expandUntil = simTime + PADDLE_EXPAND_DURATION_S;
    clampPaddle();
  } else if (kind === KIND_EXTRA) {
    spawnExtraBall();
  } else if (kind === KIND_STICKY) {
    // (Re)arm the catch window: the expiry is set to now + the full
    // duration, never added to whatever the previous arm had left.
    stickyUntil = simTime + STICKY_DURATION_S;
  } else if (kind === KIND_LIFE) {
    // Restored in place; the cap is hard, so a catch at
    // PLAYER_LIVES spends the capsule without touching lives.
    if (lives < PLAYER_LIVES) {
      lives += 1;
      renderLives();
    }
  } else if (kind === KIND_MULTIPLIER) {
    // (Re)arm the score window: the expiry is set to now + the full
    // duration, never added to whatever the previous arm had left.
    multUntil = simTime + MULT_DURATION_S;
  } else if (kind === KIND_INVULNERABLE) {
    // (Re)arm the pass-through window: the expiry is set to now +
    // the full duration, never extended additively.
    invulnUntil = simTime + INVULNERABLE_DURATION_S;
  } else if (kind === KIND_MULTIBALL) {
    spawnMultiball(); // instant: no window, one fan per in-flight ball
  } else if (kind === KIND_BLAST) {
    // (Re)arm the detonation window: full duration, never extended.
    blastUntil = simTime + BLAST_DURATION_S;
  }
}
// The capture fan is built over a SNAPSHOT of the in-flight parents
// (collected in this one-shot scratch, allocated once at boot) so a
// clone can never clone itself: the pool doubles as its own roster.
// Sized at module load from MAX_BALLS_EXCITE: the live-ball cap can
// never exceed the pool, so np ≤ pool length = scratch length always
// holds; a console retune of the var takes effect from the next page
// load (the house-standard module-load capture).
var multiballParents = new Array(MAX_BALLS_EXCITE);
// MULTIBALL (ticket #75): every in-flight ball is replaced by TEN —
// the parent keeps its exact vector, nine clones spawn at the parent
// position with the same vector rotated by (j - 4) × the named
// spread step (a symmetric fan around the incoming direction, speed
// preserved). Fully deterministic and allocation-free: parents are
// iterated in pool order, clones take free slots in pool order, and
// spawning stops the moment the run's ball cap would be exceeded
// (excess spawns skipped, never queued). Parked (attached) balls
// are not in flight, so they do not fan — only live velocity can be
// meaningfully rotated.
function spawnMultiball() {
  var np = 0;
  for (var i = 0; i < balls.length; i += 1) {
    if (balls[i].active && !balls[i].attached) multiballParents[np++] = i;
  }
  for (var n = 0; n < np; n += 1) {
    if (liveBallCount() >= runBallCap) break;
    var p = balls[multiballParents[n]];
    var baseAngle = Math.atan2(p.vy, p.vx);
    var speed = Math.hypot(p.vx, p.vy);
    for (var j = 0; j < MULTIBALL_CLONES && liveBallCount() < runBallCap; j += 1) {
      var free = null;
      for (var s = 0; s < balls.length; s += 1) {
        if (!balls[s].active) { free = balls[s]; break; }
      }
      if (!free) break; // the cap equals the pool size: never both
      var a = baseAngle + (j - (MULTIBALL_CLONES - 1) / 2) * MULTIBALL_SPREAD_STEP;
      free.active = true;
      free.attached = false;
      free.attachOff = 0;
      free.x = p.x;
      free.y = p.y;
      free.vx = speed * Math.cos(a);
      free.vy = speed * Math.sin(a);
    }
  }
}
// BLAST (ticket #75): every breakable brick inside the named radius
// of the impact point detonates — one SCAN per hit event (no
// chaining: blast-destroyed bricks do not themselves detonate).
// Fixed bricks anchor blasts without breaking. The final-brick win
// respawns the board, so the scan aborts if the level changed.
function blastAround(x, y) {
  var r2 = BLAST_RADIUS_PX * BLAST_RADIUS_PX;

// cursor lets a kill flood saturate the pool instead of growing it.
// Purely decorative: no collision, no score, no behaviour coupling.
var DEBRIS_POOL_SIZE = 32;
var DEBRIS_PER_KILL = 4;
var DEBRIS_LIFE_S = 0.5;
var DEBRIS_SIZE = 14;                 // shard footprint, canvas px
var DEBRIS_SPREAD = 160;              // added outward speed range, canvas px/s
var DEBRIS_SPRITES = ["debris-1", "debris-2"];
var debris = [];
(function () {
  for (var d = 0; d < DEBRIS_POOL_SIZE; d += 1) {
    debris.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, img: 0 });
  }
})();
var debrisCursor = 0;
// Same multiply-XOR scramble family as the crack points: fixed seed
// in, reproducible float in [0, 1) out.
function debrisScramble(seed) {
  var h = (seed * 2654435761) >>> 0;
  h = ((h ^ (h >>> 15)) * 2246822519) >>> 0;
  return ((h >>> 13) & 0xffff) / 0xffff;
}
function burstDebris(cx, cy, seed) {
  if (!ASSETS[DEBRIS_SPRITES[0]] && !ASSETS[DEBRIS_SPRITES[1]]) return; // decode lost: no shards
  for (var s = 0; s < DEBRIS_PER_KILL; s += 1) {
    var d = debris[debrisCursor];
    debrisCursor = (debrisCursor + 1) % debris.length;
    var ang = 2 * Math.PI * debrisScramble(seed + s * 613);
    var spd = 40 + DEBRIS_SPREAD * debrisScramble(seed + s * 613 + 7);
    d.active = true;
    d.x = cx;
    d.y = cy;
    d.vx = Math.cos(ang) * spd;
    d.vy = Math.sin(ang) * spd;
    d.life = DEBRIS_LIFE_S;
    d.img = s % 2;
  }
}
function updateDebris(dt) {
  for (var i = 0; i < debris.length; i += 1) {
    var d = debris[i];
    if (!d.active) continue;
    d.life -= dt;
    if (d.life <= 0) { d.active = false; continue; }
    d.x += d.vx * dt;
    d.y += d.vy * dt;
  }
}
function drawDebris() {
  for (var i = 0; i < debris.length; i += 1) {
    var d = debris[i];
    if (!d.active) continue;
    var spr = ASSETS[DEBRIS_SPRITES[d.img]];
    if (!spr) continue; // one lost decode loses half the shards, not the frame
    ctx.globalAlpha = 0.9 * (d.life / DEBRIS_LIFE_S); // fades out over the shard's life
    ctx.drawImage(spr, d.x - DEBRIS_SIZE / 2, d.y - DEBRIS_SIZE / 2, DEBRIS_SIZE, DEBRIS_SIZE);
  }
  ctx.globalAlpha = 1;
}

// ---- Frame loop ----
// Per-frame order: resize -> update(dt) -> syncScore -> draw, so a
// record overtaken inside update persists on the same frame it happens.
function frame(time) {
  // Clamp the REAL frame first: a stalled tab yields at most one
  // MAX_FRAME_SECONDS step, and the warp below multiplies the
  // CLAMPED value (ticket #102 ordering: clamp, THEN scale), so
  // tab-stall + held warp can never produce a giant simDt.
  var dt = lastFrameTime === null
    ? 0
    : Math.min(Math.max(0, (time - lastFrameTime) / 1000), MAX_FRAME_SECONDS);
  lastFrameTime = time;
  if (resizePending) {
    resizePending = false;
    resizeCanvas();
  }
  // Warp (ticket #102): right mouse held with a non-OFF knob scales
  // the single simulation dt that EVERY gameplay system consumes
  // (ball integration + its sub-stepping, capsules, powerup timers,
  // level/score) — the whole sim accelerates consistently. The
  // render still runs once per REAL frame below, so draw can never
  // desynchronise from the sim.
  var simDt = dt * (rmbHeld && fastFwdMult > 0 ? fastFwdMult : 1);
  if (gameState === "playing") update(simDt);
  syncScore();
  draw();
  requestAnimationFrame(frame);
}
// Promote the live score to the persisted high score when it rises;
// the same frame also refreshes the #hiscore readout.
function syncScore() {
  if (score > highScore) {
    highScore = score;
    saveHighScore();
    syncHud();
  }
}
function update(dt) {
  simTime += dt;
  updatePaddle(dt);
  updateBalls(dt);
  updatePowerups(dt);
  updateDebris(dt);
  // Frame end: reset the per-brick damage charges so the next
  // frame's contacts can cost hp again (ticket #42 cap).
  for (var i = 0; i < bricks.length; i += 1) bricks[i].charged = false;
}
function draw() {
  // Arena background (tickets #138/#143): the cached bitmap is
  // drawn from the active set's table — a missing/undecoded slot
  // keeps the themed fill.
  var bg = ASSETS.bg || null;
  if (bg) {
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  if (gameState === "start") return;
  drawBoundary();
  drawBricks();
  // Outside "playing" the field is frozen: capsules and debris stay
  // pooled but undrawn, so the game-over screen shows a tidy board.
  if (gameState === "playing") {
    drawPowerups();
    drawDebris();
  }
  drawPaddle();
  drawBalls();
}
// Ticket #69: dress the ball's actual travel boundary. The three
// solid segments are the exact surfaces bounceWalls() reflects from
// (it compares the ball against 0 / canvas.width for the sides and
// 0 for the top, and reads canvas.width/height here too — no second
// source of truth), and the dashed segment is the open bottom edge
// where a life is lost (updateBalls drops the ball once it is fully
// past the bottom edge: b.y - BALL_RADIUS > canvas.height). Decorative: one fixed path each, theme-indexed
// colour lookups (COLOR_WALL/COLOR_DANGER follow applyTheme), and
// the prebuilt DANGER_DASH/NO_DASH arrays — zero per-frame
// allocation. Drawn under bricks/paddle/balls.
function drawBoundary() {
  ctx.lineWidth = WALL_LINE_W;
  ctx.strokeStyle = COLOR_WALL;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(canvas.width, 0); // top
  ctx.moveTo(0, 0);
  ctx.lineTo(0, canvas.height); // left
  ctx.moveTo(canvas.width, 0);
  ctx.lineTo(canvas.width, canvas.height); // right
  ctx.stroke();
  ctx.lineWidth = DANGER_LINE_W;
  ctx.strokeStyle = COLOR_DANGER;
  ctx.setLineDash(DANGER_DASH);
  ctx.beginPath();
  ctx.moveTo(0, canvas.height); // the open edge a life falls out of
  ctx.lineTo(canvas.width, canvas.height);
  ctx.stroke();
  ctx.setLineDash(NO_DASH);
}
function drawBricks() {
  for (var i = 0; i < bricks.length; i += 1) {
    var b = bricks[i];
    if (!b.active) continue;
    var tier = BRICK_TIERS[b.tier];
    // Wear (ticket #71): the fill is the tier's precomputed ramp
    // indexed by damage taken — full hp paints ramp[0], the base
    // colour, exactly as before; the unbreakable tier (hp 0, delta
    // 0) keeps the bare fill path with no crack strokes.
    ctx.fillStyle = tier.ramp[tier.hp - b.hp];
    ctx.fillRect(b.x, b.y, b.w, b.h);
    var dmg = tier.hp - b.hp;
    // Material skin (ticket #138): the multi-hit tiers A/B overlay
    // their cached texture at an opacity proportional to hp LOST —
    // opacity grows with damage taken, zero at full hp — so each hit
    // exposes a deeper wear ramp AND adds a crack line, and every
    // stage reads at a glance. The guard skips the draw at full hp:
    // an alpha-0 drawImage is an invisible per-frame GPU fill for
    // nothing. Tier C/fixed stay bare themed fills (no texture slot
    // for them); a missing skin decode keeps the themed paint.
    if (dmg > 0 && b.tier < 2 && tier.hp > 0) {
      var skin = ASSETS[BRICK_SKIN_NAMES[b.tier]];
      if (skin) {
        ctx.globalAlpha = BRICK_SKIN_ALPHA * (tier.hp - b.hp) / tier.hp;
        ctx.drawImage(skin, b.x, b.y, b.w, b.h);
        ctx.globalAlpha = 1;
      }
    }
    if (dmg > 0) drawBrickCracks(i, b, tier, dmg);
  }
}
// Crack overlay (ticket #71): at every intermediate damage stage a
// brick also strokes short crack polylines — one per damage taken,
// capped at CRACK_LINES_MAX, so a deeper crack keeps the stage-1
// polyline untouched (prefix stability). Each polyline is three
// points (near top / middle / near bottom of the brick). All
// coordinates are NORMALISED [0,1] pairs precomputed ONCE at module
// load from the brick's pool index by a fixed integer scramble — no
// `random` hook, so a brick keeps its own crack forever, a respawn
// inherits the same one, and the draw path only indexes:
// zero per-frame allocation.
var CRACK_LINE_W = 2;                 // crack stroke width, canvas px
var CRACK_LINES_MAX = 2;              // polylines at the deepest stage
var CRACK_POINTS_PER = 6;             // three normalised (x, y) points
var CRACK_POINTS = [];                // per pool index: CRACK_LINES_MAX × 6 floats
// Deterministic float in [0, 1) from a small integer seed: a fixed
// multiply-XOR scramble, not the testable `random` hook.
function crackScramble(seed) {
  var h = (seed * 2654435761) >>> 0;
  h = ((h ^ (h >>> 15)) * 2246822519) >>> 0;
  return ((h >>> 13) & 0xffff) / 0xffff;
}
function buildCrackPoints() {
  CRACK_POINTS.length = 0; // rebuild from scratch (module load)
  for (var i = 0; i < BRICK_ROWS * BRICK_COLS; i += 1) {
    var pts = [];
    for (var line = 0; line < CRACK_LINES_MAX; line += 1) {
      var seed = i * 73 + line * 191 + 1;
      // Keep the ink inside the brick face: x in [0.15, 0.85].
      pts.push(
        0.15 + 0.7 * crackScramble(seed + 0), 0.05,
        0.15 + 0.7 * crackScramble(seed + 1), 0.50,
        0.15 + 0.7 * crackScramble(seed + 2), 0.95
      );
    }
    CRACK_POINTS.push(pts);
  }
}
buildCrackPoints();
function drawBrickCracks(index, b, tier, dmg) {
  var lines = dmg > CRACK_LINES_MAX ? CRACK_LINES_MAX : dmg;
  var p = CRACK_POINTS[index];
  // The crack ink is the tier's DEEPEST wear shade (a precomputed
  // ramp entry, so theme-tracking and allocation-free alike).
  ctx.strokeStyle = tier.ramp[tier.hp - 1];
  ctx.lineWidth = CRACK_LINE_W;
  for (var l = 0; l < lines; l += 1) {
    var o = l * CRACK_POINTS_PER;
    ctx.beginPath();
    ctx.moveTo(b.x + p[o] * b.w, b.y + p[o + 1] * b.h);
    ctx.lineTo(b.x + p[o + 2] * b.w, b.y + p[o + 3] * b.h);
    ctx.lineTo(b.x + p[o + 4] * b.w, b.y + p[o + 5] * b.h);
    ctx.stroke();
  }
}
function drawPowerups() {
  // Icon sheet (ticket #138): each kind overlays its cached 16px
  // sheet frame CENTRED on the capsule — the themed fill stays the
  // legend's colour anchor, the glyph adds at-a-glance identity.
  // Kinds without a reserved frame keep the bare fill.
  var sheet = ASSETS.powerups || null;
  for (var i = 0; i < capsules.length; i += 1) {
    var c = capsules[i];
    if (!c.active) continue;
    ctx.fillStyle = CAPSULE_DRAW_COLORS[c.kind];
    ctx.fillRect(c.x - CAPSULE_W / 2, c.y, CAPSULE_W, CAPSULE_H);
    var frame = CAPSULE_ICON_FRAMES[c.kind];
    if (sheet && frame >= 0) {
      ctx.drawImage(sheet, frame * ICON_FRAME_W, 0, ICON_FRAME_W, ICON_FRAME_W,
        c.x - ICON_FRAME_W / 2, c.y - 1, ICON_FRAME_W, ICON_FRAME_W);
    }
  }
}
function drawPaddle() {
  var top = paddleTop();
  var x = paddle.x - paddleW / 2;
  // Skin (ticket #138): the cached paddle texture stretched to the
  // live width (it widens cleanly on expand); the themed fill is the
  // fallback whenever the set is undecoded or a decode failed.
  var skin = ASSETS.paddle || null;
  if (skin) {
    ctx.drawImage(skin, x, top, paddleW, PADDLE_HEIGHT);
  } else {
    ctx.fillStyle = COLOR_PADDLE;
    ctx.fillRect(x, top, paddleW, PADDLE_HEIGHT);
  }
}
function drawBalls() {
  // EXCITING invulnerability (ticket #75): while the window is live
  // every active ball wears a tinted core plus one soft halo so the
  // state is legible at a glance. Both passes read the named colour
  // vars; the halo pass runs only while armed, so a lapsed window
  // costs the bare legacy draw exactly.
  var invuln = invulnActive();
  if (invuln) {
    ctx.globalAlpha = INVULN_GLOW_ALPHA;
    ctx.fillStyle = COLOR_BALL_INVLUN;
    for (var i = 0; i < balls.length; i += 1) {
      var h = balls[i];
      if (!h.active) continue;
      ctx.beginPath();
      ctx.arc(h.x, h.y, INVULN_GLOW_RADIUS_PX, 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // Sprite + trail (ticket #138): the cached ball bitmap replaces
  // the vector circle when the theme carries the art set; an ARMED
  // invulnerability window keeps the tinted vector core, because the
  // tint is the state's legible signal. Behind it, three cached
  // ghosts strung at fixed fractions of the ball's OWN speed (a
  // faster ball leaves a longer, wider wake — the trail sells
  // speed), each smaller and fainter; a parked serve wears none.
  var sprite = !invuln ? ASSETS.ball : null;
  var trail = ASSETS["ball-trail"] || null;
  for (var i = 0; i < balls.length; i += 1) {
    var b = balls[i];
    if (!b.active) continue;
    var speed = 0;
    if (trail) {
      speed = Math.hypot(b.vx, b.vy);
      if (speed > TRAIL_MIN_SPEED_PX) {
        var nx = b.vx / speed;
        var ny = b.vy / speed;
        for (var g = 0; g < BALL_TRAIL_LENGTH; g += 1) {
          var dist = speed * BALL_TRAIL_LAG * (g + 1);
          var size = BALL_TRAIL_SIZES[g];
          ctx.globalAlpha = BALL_TRAIL_ALPHAS[g];
          ctx.drawImage(trail, b.x - nx * dist - size / 2, b.y - ny * dist - size / 2, size, size);
        }
        ctx.globalAlpha = 1;
      }
    }
    if (sprite) {
      ctx.drawImage(sprite, b.x - BALL_RADIUS, b.y - BALL_RADIUS, BALL_RADIUS * 2, BALL_RADIUS * 2);
    } else {
      ctx.fillStyle = invuln ? COLOR_BALL_INVLUN : COLOR_BALL;
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_RADIUS, 0, 2 * Math.PI);
      ctx.fill();
    }
  }
}

// ---- Boot ----
resizeCanvas();
paddle.x = canvas.width / 2;
serveBall();
setScreen("start");
renderLives();
renderLeaderboards();
buildCapsuleLegend();
syncHud();
// Asset contract: the loop starts only once every embedded bitmap
// has settled (or the fallback decided there is nothing to wait
// for — that branch is synchronous, so headless boots register
// the first frame immediately).
bootAssets(function () { requestAnimationFrame(frame); });
</script>
