<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brick Breaker</title>
<style>
  /* ================= Retro arcade shell ================= */
  :root {
    --bg: #0b0f14;
    --accent: #5cf2b0;
    --ink: #9fb4c7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* single-screen: the page never scrolls */
  }
  body {
    background: var(--bg);
    color: var(--accent);
    font-family: monospace;
  }
  /* Centered fixed-aspect stage: the JS resize pass sizes the canvas
     to the largest 16:10 rectangle that fits the viewport
     (letterbox — it shrinks to fit, never stretches). */
  #game {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
  }
  /* The paddle is the visible pointer: the OS cursor is hidden over
     the stage only — the menus/HUD keep a normal cursor so their
     CTAs still look clickable (ticket #40). Deliberately a one-line
     rule: the repo gate locks this declaration via a single-line
     selector-plus-declaration match. */
  #game { cursor: none; }
  /* Top bar HUD (PRD section 3). Overlay styling, no scroll impact. */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 1rem;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
  #hud b {
    font-weight: normal;
    color: var(--ink);
  }
  /* Life icons in the top bar (PRD section 3): one small paddle bar
     per remaining life, appended/removed by the game on every change. */
  #lives {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .life-icon {
    display: inline-block;
    width: 12px;
    height: 5px;
    border-radius: 2px;
    background: var(--accent);
  }
  /* Absolute-positioned game-state overlays (PRD section 3). */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: rgba(3, 6, 10, 0.6);
    text-align: center;
  }
  .screen h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .screen p {
    margin: 0;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
  }
  #btn-start,
  #btn-resume,
  #btn-restart,
  #btn-menu {
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent);
    padding: 0.7em 1.6em;
    cursor: pointer;
  }
  #btn-start:hover,
  #btn-resume:hover,
  #btn-restart:hover,
  #btn-menu:hover {
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen difficulty selector (ticket #44): one group of
     three preset options; the active preset carries .selected. */
  .difficulty {
    display: flex;
    gap: 0.5rem;
  }
  .difficulty-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.5em 1.2em;
    cursor: pointer;
  }
  .difficulty-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen theme selector (ticket #46): one group of three
     skins; the active skin carries .selected. */
  .themes {
    display: flex;
    gap: 0.5rem;
  }
  .theme-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.5em 1.2em;
    cursor: pointer;
  }
  .theme-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen mode selector (ticket #74, alleyway row ticket
     #76): one group of named play modes; the active mode carries
     .selected. The row's generic .mode-opt treatment means every
     further option button needs no restyling. */
  .modes {
    display: flex;
    gap: 0.5rem;
  }
  .mode-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.5em 1.2em;
    cursor: pointer;
  }
  .mode-opt.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Top-five leaderboard (ticket #48): one ranked row per entry,
     rebuilt in place on insert, reset, or boot; an empty list
     renders as a single placeholder row. */
  .leaderboard {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    min-height: 1.4em;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .leaderboard-row {
    min-width: 8ch;
    text-align: left;
  }
  .leaderboard-row.placeholder {
    color: rgba(159, 180, 199, 0.5);
  }
  /* The reset control (ticket #48): clears high score AND
     leaderboard alike — a secondary action, styled as a muted
     opt button, not the primary accent CTA. */
  #btn-reset-hiscore {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(159, 180, 199, 0.4);
    padding: 0.5em 1.2em;
    cursor: pointer;
  }
  #btn-reset-hiscore:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Start-screen sound controls (ticket #47): the mute toggle reads
     like the other start-screen options; the slider follows it. */
  .sound {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .sound-opt {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(92, 242, 176, 0.4);
    padding: 0.5em 1.2em;
    cursor: pointer;
  }
  .sound-opt.muted {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(92, 242, 176, 0.12);
  }
  /* Shared start-screen control treatment: the volume row and the
     ball-speed row (ticket #73) both pair a label with a range slider. */
  .sound .vol, .speed .vol {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
  }
  #sound-volume, #ball-speed {
    width: 120px;
    accent-color: var(--accent);
  }
  /* Start-screen ball-speed option (ticket #73): the slider follows
     the volume slider's row treatment, on its own tidy row. The .vol
     and range rules are shared with the sound row above. */
  .speed {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <header id="hud">
    <span>Score <b id="hud-score">0</b></span>
    <span>Level <b id="hud-level">1</b></span>
    <span>High <b id="hiscore">0</b></span>
    <span>Lives <span id="lives"></span></span>
  </header>

  <section class="screen" id="screen-start">
    <h1>Brick Breaker</h1>
    <p>Clear the wall &middot; Keep the ball up</p>
    <div class="difficulty">
      <button id="difficulty-easy" type="button" class="difficulty-opt" data-difficulty="easy">Easy</button>
      <button id="difficulty-normal" type="button" class="difficulty-opt selected" data-difficulty="normal">Normal</button>
      <button id="difficulty-hard" type="button" class="difficulty-opt" data-difficulty="hard">Hard</button>
    </div>
    <div class="themes">
      <button id="theme-classic" type="button" class="theme-opt selected" data-theme="classic">Classic</button>
      <button id="theme-neon" type="button" class="theme-opt" data-theme="neon">Neon</button>
      <button id="theme-minimal" type="button" class="theme-opt" data-theme="minimal">Minimal</button>
    </div>
    <div class="modes">
      <button id="mode-classic" type="button" class="mode-opt selected" data-mode="classic">Classic</button>
      <button id="mode-exciting" type="button" class="mode-opt" data-mode="exciting">Exciting</button>
      <button id="mode-alleyway" type="button" class="mode-opt" data-mode="alleyway">Alleyway</button>
    </div>
    <div class="sound">
      <button id="btn-mute" type="button" class="sound-opt">Sound On</button>
      <label class="vol">Vol<input id="sound-volume" type="range" min="0" max="100" value="100"></label>
    </div>
    <div class="speed">
      <label class="vol">Ball Speed<input id="ball-speed" type="range" min="50" max="150" value="100"></label>
    </div>
    <div class="leaderboard" id="leaderboard-start"></div>
    <button id="btn-reset-hiscore" type="button">Reset High Score</button>
    <button id="btn-start" type="button">Start Game</button>
  </section>

  <section class="screen" id="screen-gameover">
    <h1>Game Over</h1>
    <p id="gameover-final">Final score 0</p>
    <div class="leaderboard" id="leaderboard-gameover"></div>
    <button id="btn-restart" type="button">Try Again</button>
    <button id="btn-menu" type="button">Menu</button>
  </section>

  <section class="screen" id="screen-pause">
    <h1>Paused</h1>
    <p>The board is holding &middot; Esc or P resumes</p>
    <p>Esc resume &middot; M menu</p>
    <button id="btn-resume" type="button">Resume</button>
  </section>

<script>
"use strict";
// ================================================================
// BRICK BREAKER — campaign 2: shell, paddle, ball, lives, game over,
// brick grid, ball-brick collision, scoring, level progression and
// the win condition
//
// Single file: a default landscape 960×600 (16:10) logical stage —
// the alleyway play mode switches it to a portrait 480×800 arena
// with its own 5×10 brick grid (ticket #76) — rendered at an
// internal-resolution scale factor and letterboxed/centered in the
// viewport (fit, not stretch), a requestAnimationFrame loop with
// a clamped frame delta, start / pause / game-over overlay screens
// (the pause freezes the whole simulation; resume via the overlay
// CTA or a fresh Escape/KeyP press), keyboard and pointer paddle
// control, a served ball with wall and paddle
// bounces (position-dependent angle, speed-preserving), a fixed-pool
// brick grid the ball breaks for colour-valued points, level
// progression on a cleared board (faster serve per level, capped),
// the lose-a-life / game-over / restart flow, and the power-up drop /
// catch framework with the expand paddle, extra ball (a fixed ball
// pool capped at MAX_BALLS — a life is lost only when the last live
// ball falls) and sticky paddle (a timed window during which paddle
// contact catches a ball that a click re-launches) effects, and
// synthesized Web Audio SFX (named recipes per required event on a
// single master gain bus, built on the first user gesture, degrading
// to silent where Web Audio is missing), and the high score
// persisted in localStorage under a named key — loaded at boot,
// shown in the #hiscore top-bar element, and rewritten as a JSON
// number only when the live score overtakes it; a local top-five
// leaderboard under its own named key — populated at game over,
// rendered on the start and game-over screens, and cleared with
// the high score by the single start-screen reset control; a
// start-screen
// difficulty selector (Easy / Normal / Hard) persisted in
// localStorage under its own named key and applied per run; and
// three selectable retro themes (Classic / Neon / Minimal)
// persisted in localStorage under their own named key, driven by
// one THEMES table that at boot and on every selection change
// applies the CSS custom properties and the canvas palette in a
// single pass; named start-screen play modes
// (Classic / Exciting / Alleyway) persisted in localStorage under
// their own named key, snapshotted per run — classic keeps the
// legacy economy (× 1.0 drop factor, the five-kind capsule table,
// the MAX_BALLS live-ball cap); exciting multiplies the preset's
// drop rate by the named EXCITING_DROP_FACTOR and rolls three
// capsule kinds that exist ONLY in its drop table (ticket #75):
// invulnerable (a timed window in which the ball smashes through
// breakable bricks — fixed bricks still stop it — with no capsule
// drops and a tinted, glowing ball), multiball (every in-flight
// ball instantly fans into ten at a fixed angular spread, capped at
// MAX_BALLS_EXCITE concurrent balls on the boot-sized pool), and
// blast (a timed window in which every brick hit detonates all
// breakable bricks within the named radius — one scan per hit, no
// chaining, fixed bricks anchor without breaking); alleyway
// (ticket #76) plays the classic economy on a portrait 480×800
// stage with its own brick grid and pattern table;
// and a start-screen sound toggle with a volume
// slider, persisted as JSON { muted, volume } under their own
// named key and driving the master bus level live (mute wins over
// volume), and a start-screen ball-speed slider (50-150%, persisted
// as an integer percent under its own named key) that beginRun()
// snapshots: it scales each run's serve speed and growth ceiling
// by the same factor
// ================================================================

// ---- Tunables (var: addressable as globals, e.g. from the console) ----
var CANVAS_SCALE = 2;             // canvas pixels per stage pixel
// Stage dimensions (logical px). CLASSIC_* is the landscape
// default; ALLEYWAY_* is the portrait arena (ticket #76).
// GAME_W/GAME_H are the RUNTIME stage size: they start at the
// landscape default and beginRun() re-sets them per mode, so the
// backing store, the CSS letterbox fit and the pointer mapping all
// follow the selected mode.
var CLASSIC_W = 960;              // landscape logical stage width (16:10)
var CLASSIC_H = 600;              // landscape logical stage height (16:10)
var ALLEYWAY_W = 480;             // alleyway portrait arena width
var ALLEYWAY_H = 800;             // alleyway portrait arena height
var GAME_W = CLASSIC_W;           // runtime stage width: beginRun() (re)sets per mode
var GAME_H = CLASSIC_H;           // runtime stage height: beginRun() (re)sets per mode
var UI_FONT = "monospace";        // retro face for canvas UI text
var MAX_FRAME_SECONDS = 1 / 30;   // dt clamp: no teleports after tab switches
var random = Math.random;          // mutable hook: test suites pin it for determinism
var HIGH_SCORE_KEY = "brickbreaker.highScore";
var LEADERBOARD_KEY = "brickbreaker.leaderboard";  // top-five list (ticket #48)
var LEADERBOARD_MAX = 5;                           // the top-five cap
var LEADERBOARD_EMPTY_TEXT = "no scores yet";       // empty-list placeholder row
var PLAYER_LIVES = 3;             // lives per run (PRD section 2 loss rule)
// Paddle (internal canvas px, so values scale with CANVAS_SCALE)
var BASE_PADDLE_W = 120;           // resting width; the runtime width widens on expand
var PADDLE_HEIGHT = 14;
var PADDLE_BOTTOM_GAP = 24;       // clear space between paddle and bottom edge
var PADDLE_SPEED = 720;           // keyboard travel speed, px/s
// Boundary dressing (ticket #69): the decorative wall and danger-
// line weights and rhythm. The dash arrays are prebuilt at module
// load — setLineDash must receive the SAME reference every frame,
// never a fresh literal, or the draw path would churn garbage.
var WALL_LINE_W = 2;               // solid wall thickness, canvas px
var DANGER_LINE_W = 2;             // dashed danger-line thickness, canvas px
var DANGER_DASH = [12, 10];        // on/off rhythm of the bottom danger line, canvas px
var NO_DASH = [];                  // setLineDash reset argument (restores solid)
// Ball
var BALL_RADIUS = 8;
var MAX_BALLS = 5;              // normal-play live-ball cap (classic); extra-ball catches stop here
var MAX_BALLS_EXCITE = 30;      // EXCITING concurrent-ball cap (multiball x10); the ball pool is sized to this at boot
var BALL_SERVE_SPEED = 480;       // level-1 launch speed on click/tap, px/s
var LEVEL_SPEED_GROWTH = 1.15;    // per-level serve-speed multiplier (PRD section 4)
var MAX_BALL_SPEED = 1500;        // ceiling the per-level growth caps at, px/s
// Ball-speed option (ticket #73): the start-screen slider's bounds
// and default, in percent. The slider never replaces the named
// serve knobs — beginRun() multiplies them by ballSpeedPct/100.
var BALL_SPEED_KEY = "brickbreaker.speed";
var MIN_BALL_SPEED_PCT = 50;
var MAX_BALL_SPEED_PCT = 150;
var DEFAULT_BALL_SPEED_PCT = 100;
var MAX_PADDLE_BOUNCE_ANGLE = Math.PI / 3;  // 60 deg from vertical at the rim
// Pin nudge: when collideBricks pins a ball flush to a brick face it
// nudges it this far OUTSIDE, so a re-computed overlap of the pinned
// position is strictly zero — a flush pin can never re-register as
// (ULP-rounding-dependent) contact on a LATER frame.
var BRICK_PIN_EPS = 1e-6;
// Bricks: grid geometry (internal canvas px) over a fixed-size pool
var CLASSIC_BRICK_ROWS = 5;       // landscape grid rows
var CLASSIC_BRICK_COLS = 10;      // landscape grid columns
var ALLEYWAY_BRICK_ROWS = 10;     // alleyway portrait grid rows
var ALLEYWAY_BRICK_COLS = 5;      // alleyway portrait grid columns
var BRICK_ROWS = CLASSIC_BRICK_ROWS; // runtime: beginRun() (re)sets per mode
var BRICK_COLS = CLASSIC_BRICK_COLS; // runtime: beginRun() (re)sets per mode
var BRICK_SIDE_MARGIN = 24;
var BRICK_TOP_MARGIN = 64;
var BRICK_GAP = 6;
var BRICK_HEIGHT = 26;
// Hard bound on the post-hit seam drain in updateBalls(). With
// multi-hit bricks (ticket #42) a ball wedged in a gap narrower
// than itself can ping-pong between the two seam faces forever:
// clearing the left neighbour needs the centre at
// leftRightFace + R or beyond, clearing the right neighbour needs
// it at rightLeftFace - R or below, and the two bounds are
// 2*R - GAP apart with 2*R > GAP — no position satisfies both.
// The drain therefore rescan-caps at one-plus-the-pool-size;
// residual overlap past the cap is the documented seam artifact,
// never a busy loop.
var MAX_BRICK_RESCANS_PER_SUBSTEP = BRICK_ROWS * BRICK_COLS + 1;
// Brick colours map to named per-colour point values (PRD section 2)
// and per-colour durability (ticket #42): the top tier is
// multi-hit, the base tier is one-hit, so a colour still encodes
// exactly one point value.
var COLOR_BRICK_A = "#ef5d62";
var POINTS_BRICK_A = 30;
var COLOR_BRICK_B = "#f2a541";
var POINTS_BRICK_B = 20;
var COLOR_BRICK_C = "#4fc1e9";
var POINTS_BRICK_C = 10;
// Per-tier hit points to break (ticket #42): the top tier takes the
// most hits, the base tier still dies in one. The fixed tier scores
// zero and can never be charged (unbreakable); its hp of 0 keeps its
// wear depth (`tier.hp - b.hp`) at 0, so it always renders the base
// ramp stage and never a crack.
var HP_BRICK_A = 3;
var HP_BRICK_B = 2;
var HP_BRICK_C = 1;
var HP_BRICK_FIXED = 0;
// Fixed bricks (ticket #43): unbreakable, worth nothing — a ball
// must get behind them, not break them. The tier is a table entry
// like the others so the draw pass stays a plain colour lookup.
var COLOR_BRICK_FIXED = "#8b93a7";
var POINTS_BRICK_FIXED = 0;
var BRICK_TIERS = [
  { color: COLOR_BRICK_A, points: POINTS_BRICK_A, hp: HP_BRICK_A },
  { color: COLOR_BRICK_B, points: POINTS_BRICK_B, hp: HP_BRICK_B },
  { color: COLOR_BRICK_C, points: POINTS_BRICK_C, hp: HP_BRICK_C },
  { color: COLOR_BRICK_FIXED, points: POINTS_BRICK_FIXED, hp: HP_BRICK_FIXED, unbreakable: true }
];
var TIER_FIXED = BRICK_TIERS.length - 1; // index of the unbreakable tier
// Level layout table (ticket #43): BRICK_ROWS row-strings of
// BRICK_COLS cells — '.' = empty, 'A'/'B'/'C' = the matching tier
// letter, 'X' = fixed brick. Level k takes
// LEVEL_PATTERNS[(k - 1) % LEVEL_PATTERNS.length], cycling forever.
var CELL_TIER = { A: 0, B: 1, C: 2, X: TIER_FIXED };
var LEVEL_PATTERNS = [
  // 0 — tiered wall: the solid classic grid
  [ "AAAAAAAAAA", "BBBBBBBBBB", "CCCCCCCCCC", "AAAAAAAAAA", "BBBBBBBBBB" ],
  // 1 — gated fort: fixed top wall with a two-column gate the ball
  //   is guided up (and back down) to the pocket behind the wall
  [ "XXXX..XXXX", "AAAA..AAAA", "BBBB..BBBB", "CCCC..CCCC", "BBBB..BBBB" ],
  // 2 — checker scatter: sparse alternating cells with an open rim
  [ "A.C.C.C.C.", "B.A.B.A.B.", "C.B.C.B.C.", "A.B.A.B.A.", "B.C.B.C.B." ],
  // 3 — overhang: a fixed slab hovering above an open field
  [ "AAAAAAAAAA", "CC.XXXX.CC", "BB.XX...BB", "BB......BB", "CCCC.CCCCC" ]
];
// Alleyway pattern table (ticket #76): ALLEYWAY_BRICK_ROWS
// row-strings of ALLEYWAY_BRICK_COLS cells — the SAME cell grammar
// as LEVEL_PATTERNS ('.' = empty, A/B/C = tiers, X = fixed), but
// designed PORTRAIT: tall corridors and offset fixed slabs that read
// as vertical alley structure, never as a squeezed landscape wall.
// Deliberately a separate table (docs/DECISIONS.md): transposing the
// landscape 5×10 strings would keep their wide-wall proportions on
// a narrow field. Level k in alleyway mode takes
// ALLEYWAY_LEVEL_PATTERNS[(k - 1) % ALLEYWAY_LEVEL_PATTERNS.length].
var ALLEYWAY_LEVEL_PATTERNS = [
  // 0 — spine: paired fixed posts flank tiered pillars for five
  //   storeys, then staggered single guards on open rows
  [ "AXBXC", "AXBXC", "AXBXC", "AXBXC", "AXBXC",
    ".....", "A.C.A", ".....", "B.C.B", "....." ],
  // 1 — slalom: offset fixed slabs (left, then right) form a
  //   zig-zag corridor between stacked tiered ledges
  [ ".....", ".AAA.", "XXX..", "B.C.B", ".....",
    "...XX", "A.B.A", ".....", ".CCC.", "....." ]
];
// Per-tier wear ramp (ticket #71): a PRECOMPUTED table of one fill
// per damage stage, indexed by damage taken (0 = full hp = base
// colour). Every stage darkens the tier's base colour by a further
// BRICK_WEAR_STEP of RELATIVE channel factor (factor 1 - step*d),
// so adjacent stages differ by a fixed lightness step well above
// the ~15% perceivability floor for every theme palette; a 3-hp
// brick therefore shows three distinct states (1.00 / 0.72 / 0.44
// at the default step — the deepest stage matches the old single
// dim's ~0.45). Rebuilt from each tier's CURRENT base colour at
// module load and in applyTheme(), so the theme pass re-derives the
// whole ramp in one shot and the draw path only ever indexes it:
// tier.ramp[tier.hp - brick.hp]. Zero per-frame allocation.
var BRICK_WEAR_STEP = 0.28;
function darkenHex(hex, factor) {
  if (factor > 1) factor = 1;   // console retunes stay in [0, 1]:
  if (factor < 0) factor = 0;   // a negative factor would poison the hex
  var out = "#";
  for (var i = 1; i < hex.length; i += 2) {
    out += Math.round(parseInt(hex.slice(i, i + 2), 16) * factor)
      .toString(16).padStart(2, "0");
  }
  return out;
}
function buildTierRamps() {
  for (var i = 0; i < BRICK_TIERS.length; i += 1) {
    var t = BRICK_TIERS[i];

// ---- Audio: synthesized SFX on a master gain bus (ticket #27) ----
// All sound effects are synthesized with the Web Audio API (PRD
// section 4) — no audio files. The context is constructed only on
// the first user gesture (click or keydown), never on page load;
// before then — and in engines without Web Audio — every schedule is
// a silent no-op. Each sound's envelope gain connects to the single
// MASTER_BUS gain node, whose level tracks MASTER_GAIN live so a
// console reassignment applies to the next sound (and 0 silences
// everything). Mirrors the campaign-1 audio architecture (ticket #9).
var MASTER_GAIN = 0.2;                 // master bus level (0..1); the sound-settings block rewrites it from effectiveMaster() at boot and on every change
var WAVE_SINE = "sine";               // named waveform sources
var WAVE_SQUARE = "square";
var WAVE_NOISE = "noise";
// Named per-recipe constants: wave, frequency (Hz) and duration (s).
var SFX_PADDLE_BOUNCE = { wave: WAVE_SINE,   freq: 220, dur: 0.05 };
var SFX_BRICK_BREAK   = { wave: WAVE_NOISE,  freq: 900, dur: 0.09 };
// Non-lethal chip cue (ticket #72): a short sine blip on the same
// bus; freq is filled per hit from SFX_BRICK_CHIP_FREQ (indexed by
// the hp the brick had at impact), so the pitch descends as the
// brick weakens. The recipe object is shared and mutated in place —
// the hit path allocates nothing of its own.
// Chip pitch by hp-at-impact (index = hp, [1..3]): rising with hp so
// a weakening brick's cues descend (tier-3 > tier-2 > tier-1), and
// every entry sits below the destruction pop (SFX_BRICK_BREAK.freq
// = 900) so chip and pop read differently. Declared before the recipe
// so the recipe's initial freq cannot drift from the table.
var SFX_BRICK_CHIP_FREQ = [0, 440, 550, 660];
var SFX_BRICK_CHIP    = { wave: WAVE_SINE,   freq: SFX_BRICK_CHIP_FREQ[3], dur: 0.04 };
var SFX_POWERUP_CATCH = { wave: WAVE_SQUARE, freq: 660, dur: 0.12 };
// EXCITING-mode capture blips (ticket #75): each new capsule gets a
// small blip distinct from the legacy catch blip and from its
// siblings, scheduled through the SAME scheduleSound() bus/envelope
// path — the mute/volume plumbing therefore applies unchanged.
var SFX_CATCH_INVULNERABLE = { wave: WAVE_SINE,   freq: 880,  dur: 0.10 };
var SFX_CATCH_MULTIBALL    = { wave: WAVE_SQUARE, freq: 990,  dur: 0.12 };
var SFX_CATCH_BLAST        = { wave: WAVE_NOISE,  freq: 1200, dur: 0.15 };
var SFX_GAME_OVER     = { wave: WAVE_SINE,   freq: 110, dur: 0.50 };
var SFX_PEAK = 0.5;                    // every envelope peaks here; the bus scales it
var SFX_DECAY_FLOOR = 0.001;           // decay target: exp ramps cannot reach exact 0
var SFX_EXP_EPS = 1e-4;                // exp-ramp guard: start and target stay positive
var SFX_NOISE_BUFFER_SECONDS = 0.25;   // shared noise source length
var audioCtx = null;                   // AudioContext, built on the first gesture
var MASTER_BUS = null;                 // the one gain node wired to destination
var noiseBuffer = null;                // white noise, built once, reused per hit
// Build the audio graph on the first user gesture; later calls reuse
// the existing context, resuming it if the browser has suspended it.
// Silently no-ops when the platform has no Web Audio.
function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return;
  }
  if (typeof AudioContext === "undefined") return; // silent, no error
  audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  MASTER_BUS = audioCtx.createGain();
  MASTER_BUS.gain.value = MASTER_GAIN;
  MASTER_BUS.connect(audioCtx.destination);
  var frames = Math.max(1, Math.ceil(audioCtx.sampleRate * SFX_NOISE_BUFFER_SECONDS));
  noiseBuffer = audioCtx.createBuffer(1, frames, audioCtx.sampleRate);
  var data = noiseBuffer.getChannelData(0);
  for (var i = 0; i < data.length; i += 1) data[i] = random() * 2 - 1;
}
// Schedule one shot of a named recipe: the source — an oscillator for
// sine/square, or the shared noise buffer through a lowpass at the
// recipe frequency for noise — feeds a freshly shaped envelope gain,
// which connects to the single MASTER_BUS. The envelope peaks at
// SFX_PEAK, then decays to SFX_DECAY_FLOOR at the recipe duration,
// so the node's audio is bounded. Both ramp values are clamped to
// SFX_EXP_EPS (exp ramps must stay positive); the start is set at the
// schedule time, so a console zeroed SFX_PEAK/SFX_DECAY_FLOOR can
// never make the scheduler throw.
function scheduleSound(recipe) {
  if (!audioCtx) return; // audio not enabled yet: silent no-op
  var t0 = audioCtx.currentTime;
  MASTER_BUS.gain.value = MASTER_GAIN; // live console retunes apply
  var input = null; // node feeding the envelope
  if (recipe.wave === WAVE_NOISE) {
    input = audioCtx.createBiquadFilter();
    input.type = "lowpass";
    input.frequency.value = recipe.freq;
    var noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    noiseSrc.connect(input);
    noiseSrc.start(t0);
    noiseSrc.stop(t0 + recipe.dur);
  } else {
    input = audioCtx.createOscillator();
    input.type = recipe.wave;
    input.frequency.value = recipe.freq;
  }
  var env = audioCtx.createGain();
  env.gain.setValueAtTime(Math.max(SFX_PEAK, SFX_EXP_EPS), t0);
  env.gain.exponentialRampToValueAtTime(
    Math.max(SFX_DECAY_FLOOR, SFX_EXP_EPS), t0 + recipe.dur);
  input.connect(env);
  env.connect(MASTER_BUS);
  if (input.start) { // oscillator path (buffer sources started above)
    input.start(t0);
    input.stop(t0 + recipe.dur);
  }
}
// Schedule the non-lethal chip cue for a multi-hit brick (ticket
// #72): pitch keyed on the hp the brick had at impact, so a 3-hp
// brick's first chip is higher than its second. Reuses the shared
// SFX_BRICK_CHIP recipe in place — no per-hit allocation. The fatal
// hit plays the destruction pop instead and never calls here.
function scheduleBrickChip(hpAtHit) {
  // Clamp assumes the table covers exactly [1..3] hp (the current max
  // tier hp); a future >3-hp tier would silently chip at the 3-hp
  // pitch — extend SFX_BRICK_CHIP_FREQ before raising any tier's hp.
  var i = Math.min(Math.max(1, hpAtHit), SFX_BRICK_CHIP_FREQ.length - 1);
  SFX_BRICK_CHIP.freq = SFX_BRICK_CHIP_FREQ[i];
  scheduleSound(SFX_BRICK_CHIP);
}

    var value = JSON.parse(localStorage.getItem(HIGH_SCORE_KEY));

    // fresh-boot: 0 is the empty baseline, not a record to keep.
    return Number.isInteger(value) && value > 0 ? value : 0;
  } catch {
    return 0; // storage unavailable, blocked, or corrupt: play on
  }
}
function saveHighScore() {
  try {
    // Persisted as a JSON number: "600", not "\"600\"".

// ---- Leaderboard: the local top five (ticket #48) ----
// The in-memory mirror of the stored list: at most LEADERBOARD_MAX
// positive integers in descending order. The one insertion point is
// enterGameOver(): a final score records iff it is an integer > 0
// and the list has room, or strictly beats the list's lowest entry —
// a tie with the lowest of a FULL list never displaces it, and
// duplicates are kept while the list has room.
function loadLeaderboard() {
  try {
    var value = JSON.parse(localStorage.getItem(LEADERBOARD_KEY));
    if (!Array.isArray(value)) return [];
    var list = [];
    for (var i = 0; i < value.length; i += 1) {
      // One invalid entry voids the whole stored list: a botched
      // write must never leak into the ranking.
      if (!Number.isInteger(value[i]) || value[i] <= 0) return [];
      list.push(value[i]);
    }
    // The write path always stores descending order; re-sort and
    // re-cap at load so hand-edited storage is normalised, not
    // trusted.
    list.sort(function (a, b) { return b - a; });

// serve speed is RECOMPUTED as the level's own legitimate speed —
// the run's level-1 base grown by the named factor per level
// (capped exactly like the forward progression) — not a delta off
// whatever the drifted runtime speed holds. Score, lives and the
// multiplier window are untouched.
function stepLevelBack() {
  if (level <= 1) return; // the floor: level 1 cannot go back
  level -= 1;
  serveSpeed = Math.min(
    runServeBase * Math.pow(LEVEL_SPEED_GROWTH, level - 1),
    serveCeiling // the run's scaled ceiling, so back-steps agree with the forward chain under the slider
  );
  spawnLevel();
  serveBall();
  syncHud();
}

// ---- Power-ups (drop / fall / catch, ticket #25) ----
// A destroyed brick rolls its drop through the mutable `random` hook
// against the run's capsule table (the mode's list — the classic five
// kinds or the exciting eight, ticket #75); a hit takes the first free
// slot of the fixed pool, so a drop never allocates and quietly
// vanishes when the pool is full.
function maybeDropCapsule(x, y) {
  if (random() >= dropRate) return; // rolled against the run's snapshot
  for (var i = 0; i < capsules.length; i += 1) {
    var c = capsules[i];
    if (c.active) continue;
    c.active = true;
    c.kind = runCapsuleKinds[Math.floor(random() * runCapsuleKinds.length)];
    c.x = x;
    c.y = y;
    return;
  }
}
// One dispatch per kind; later effects slot in here. Catching expand
// (re)arms the widen: the expiry is set to now + the full duration,
// never added to whatever the previous arm had left. The blip is the
// shared catch sound for the legacy five kinds and a small distinct
// recipe per EXCITING kind (ticket #75) — both through the same bus.
function applyCapsule(kind) {
  if (kind === KIND_INVULNERABLE) {
    scheduleSound(SFX_CATCH_INVULNERABLE);
  } else if (kind === KIND_MULTIBALL) {
    scheduleSound(SFX_CATCH_MULTIBALL);
  } else if (kind === KIND_BLAST) {
    scheduleSound(SFX_CATCH_BLAST);
  } else {
    scheduleSound(SFX_POWERUP_CATCH); // the legacy catch blip
  }
  if (kind === KIND_EXPAND) {
    paddleW = basePaddleW * PADDLE_EXPAND_FACTOR;
    expandUntil = simTime + PADDLE_EXPAND_DURATION_S;
    clampPaddle();
  } else if (kind === KIND_EXTRA) {
    spawnExtraBall();
  } else if (kind === KIND_STICKY) {
    // (Re)arm the catch window: the expiry is set to now + the full
    // duration, never added to whatever the previous arm had left.
    stickyUntil = simTime + STICKY_DURATION_S;
  } else if (kind === KIND_LIFE) {
    // Restored in place; the cap is hard, so a catch at
    // PLAYER_LIVES spends the capsule without touching lives.
    if (lives < PLAYER_LIVES) {
      lives += 1;
      renderLives();
    }
  } else if (kind === KIND_MULTIPLIER) {
    // (Re)arm the score window: the expiry is set to now + the full
    // duration, never added to whatever the previous arm had left.
    multUntil = simTime + MULT_DURATION_S;
  } else if (kind === KIND_INVULNERABLE) {
    // (Re)arm the pass-through window: the expiry is set to now +
    // the full duration, never extended additively.
    invulnUntil = simTime + INVULNERABLE_DURATION_S;
  } else if (kind === KIND_MULTIBALL) {
    spawnMultiball(); // instant: no window, one fan per in-flight ball
  } else if (kind === KIND_BLAST) {
    // (Re)arm the detonation window: full duration, never extended.
    blastUntil = simTime + BLAST_DURATION_S;
  }
}
// The capture fan is built over a SNAPSHOT of the in-flight parents
// (collected in this one-shot scratch, allocated once at boot) so a
// clone can never clone itself: the pool doubles as its own roster.
// Sized at module load from MAX_BALLS_EXCITE: the live-ball cap can
// never exceed the pool, so np ≤ pool length = scratch length always
// holds; a console retune of the var takes effect from the next page
// load (the house-standard module-load capture).
var multiballParents = new Array(MAX_BALLS_EXCITE);
// MULTIBALL (ticket #75): every in-flight ball is replaced by TEN —
// the parent keeps its exact vector, nine clones spawn at the parent
// position with the same vector rotated by (j - 4) × the named
// spread step (a symmetric fan around the incoming direction, speed
// preserved). Fully deterministic and allocation-free: parents are
// iterated in pool order, clones take free slots in pool order, and
// spawning stops the moment the run's ball cap would be exceeded
// (excess spawns skipped, never queued). Parked (attached) balls
// are not in flight, so they do not fan — only live velocity can be
// meaningfully rotated.
function spawnMultiball() {
  var np = 0;
  for (var i = 0; i < balls.length; i += 1) {
    if (balls[i].active && !balls[i].attached) multiballParents[np++] = i;
  }
  for (var n = 0; n < np; n += 1) {
    if (liveBallCount() >= runBallCap) break;
    var p = balls[multiballParents[n]];
    var baseAngle = Math.atan2(p.vy, p.vx);
    var speed = Math.hypot(p.vx, p.vy);
    for (var j = 0; j < MULTIBALL_CLONES && liveBallCount() < runBallCap; j += 1) {
      var free = null;
      for (var s = 0; s < balls.length; s += 1) {
        if (!balls[s].active) { free = balls[s]; break; }
      }
      if (!free) break; // the cap equals the pool size: never both
      var a = baseAngle + (j - (MULTIBALL_CLONES - 1) / 2) * MULTIBALL_SPREAD_STEP;
      free.active = true;
      free.attached = false;
      free.attachOff = 0;
      free.x = p.x;
      free.y = p.y;
      free.vx = speed * Math.cos(a);
      free.vy = speed * Math.sin(a);
    }
  }
}
// BLAST (ticket #75): every breakable brick inside the named radius
// of the impact point detonates — one SCAN per hit event (no
// chaining: blast-destroyed bricks do not themselves detonate).
// Fixed bricks anchor blasts without breaking. The final-brick win
// respawns the board, so the scan aborts if the level changed.
function blastAround(x, y) {
  var r2 = BLAST_RADIUS_PX * BLAST_RADIUS_PX;
  var lvl = level;
  for (var i = 0; i < bricks.length; i += 1) {
    if (lvl !== level) return; // win mid-blast: the board respawned
    var k = bricks[i];
    if (!k.active || k.unbreakable) continue;
    var dx = k.x + k.w / 2 - x;
    var dy = k.y + k.h / 2 - y;
    if (dx * dx + dy * dy <= r2) destroyBrick(i);
  }
}
function updatePowerups(dt) {
  if (paddleW !== basePaddleW && simTime >= expandUntil) paddleW = basePaddleW;
  if (multUntil !== -1 && simTime >= multUntil) multUntil = -1; // window elapsed
  if (invulnUntil !== -1 && simTime >= invulnUntil) invulnUntil = -1; // invuln lapsed
  if (blastUntil !== -1 && simTime >= blastUntil) blastUntil = -1;   // blast lapsed
  var pt = paddleTop();
  var halfSpan = paddleW / 2 + CAPSULE_W / 2;
  for (var i = 0; i < capsules.length; i += 1) {
    var c = capsules[i];
    if (!c.active) continue;
    c.y += CAPSULE_FALL_SPEED * dt;
    var overPaddle = c.y + CAPSULE_H >= pt && c.y <= pt + PADDLE_HEIGHT;
    if (overPaddle && Math.abs(c.x - paddle.x) <= halfSpan) {
      c.active = false; // caught: consumed by its effect
      applyCapsule(c.kind);
    } else if (c.y - CAPSULE_H > canvas.height) {
      c.active = false; // missed: fell past the bottom edge
    }
  }
}

// ---- Balls (fixed pool, tickets #21/#26) ----
function liveBallCount() {
  var n = 0;
  for (var i = 0; i < balls.length; i += 1) if (balls[i].active) n += 1;
  return n;
}
// An extra-ball catch spawns at the paddle centre and joins active
// play immediately: straight up at the (level-grown) serve speed.
// The run's normal-play ball cap (MAX_BALLS on classic, the exciting
// ceiling on exciting) is hard — a catch beyond it is a no-op.
function spawnExtraBall() {
  if (liveBallCount() >= runBallCap) return;
  var free = null;
  for (var i = 0; i < balls.length; i += 1) {
    if (balls[i].active) continue;
    free = balls[i];
    break;
  }
  if (!free) return;
  free.active = true;
  free.attached = false;
  free.attachOff = 0;
  free.x = paddle.x;
  free.y = paddleTop() - BALL_RADIUS;
  free.vx = 0;
  free.vy = -serveSpeed;
}
// A click/tap launches EVERY attached ball at the (level-grown)
// serve speed, each inheriting the position-dependent paddle-angle
// logic for its own offset from the paddle centre.
function launchAttachedBalls() {
  ensureAudio(); // a click/tap is a user gesture: build the audio graph once
  if (gameState !== "playing") return;
  for (var i = 0; i < balls.length; i += 1) {
    var b = balls[i];
    if (!b.active || !b.attached) continue;
    var rel = (b.x - paddle.x) / (paddleW / 2);
    if (rel > 1) rel = 1;
    else if (rel < -1) rel = -1;
    b.attached = false;
    b.vx = serveSpeed * Math.sin(rel * MAX_PADDLE_BOUNCE_ANGLE);
    b.vy = -serveSpeed * Math.cos(rel * MAX_PADDLE_BOUNCE_ANGLE);
  }
}
canvas.addEventListener("click", launchAttachedBalls);
canvas.addEventListener("touchend", launchAttachedBalls);

function updateBalls(dt) {
  var pt = paddleTop();
  for (var i = 0; i < balls.length; i += 1) {
    var b = balls[i];
    if (!b.active) continue;
    if (b.attached) {
      // Rides the paddle at its catch offset; all motion is
      // paddle-driven while attached.
      b.x = paddle.x + b.attachOff;
      b.y = pt - BALL_RADIUS;
      continue;
    }
    var prevBottom = b.y + BALL_RADIUS;
    // Integrate in sub-steps of at most one ball radius, so a fast
    // ball can never skip a brick face inside a clamped frame.
    var travel = Math.hypot(b.vx, b.vy) * dt;
    var steps = Math.max(1, Math.ceil(travel / BALL_RADIUS));
    var sdt = dt / steps;
    var bricked = false;
    for (var s = 0; s < steps; s += 1) {
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;
      bounceWalls(b);
      if (collideBricks(b)) {
        bricked = true;
        // The gap is narrower than the ball: pinning to a brick face
        // can land the ball inside the seam neighbour. Drain the
        // residual overlap now. Bounded: in a seam the two pin faces
        // are mutually exclusive (ball wider than gap), so a wedged
        // ball can cycle the pins forever — a physically-wrong
        // position, but the frame must end (ticket #42 round 2).
        var rescans = 0;
        while (rescans < MAX_BRICK_RESCANS_PER_SUBSTEP && collideBricks(b)) {
          rescans += 1;
        }
        break;
      }
    }
    if (bricked) continue; // reflected by a brick (or re-served on a win)
    // Paddle: sweep test across the top face (no tunnelling even on a
    // clamped frame). While the sticky window is live the contact
    // catches; otherwise the outgoing angle derives from the hit
    // offset and the incoming speed is preserved.
    if (
      b.vy > 0 &&
      prevBottom <= pt &&
      b.y + BALL_RADIUS >= pt &&
      Math.abs(b.x - paddle.x) <= paddleW / 2 + BALL_RADIUS
    ) {
      if (simTime < stickyUntil) {
        b.attached = true;
        var catchOff = b.x - paddle.x;
        if (catchOff > paddleW / 2) catchOff = paddleW / 2;
        else if (catchOff < -paddleW / 2) catchOff = -paddleW / 2;
        b.attachOff = catchOff;
        b.vx = 0;
        b.vy = 0;
        b.x = paddle.x + catchOff;
        b.y = pt - BALL_RADIUS;
      } else {
        var rel = (b.x - paddle.x) / (paddleW / 2);
        if (rel > 1) rel = 1;
        else if (rel < -1) rel = -1;
        var speed = Math.hypot(b.vx, b.vy);
        var angle = rel * MAX_PADDLE_BOUNCE_ANGLE;
        b.vx = speed * Math.sin(angle);
        b.vy = -speed * Math.cos(angle);
        b.y = pt - BALL_RADIUS; // push out above the paddle
        scheduleSound(SFX_PADDLE_BOUNCE);
      }
    }
    // Dropped below the bottom edge: only the last live ball costs a
    // life; the others are simply gone and the run carries on.
    if (b.y - BALL_RADIUS > canvas.height) {
      b.active = false;
      if (liveBallCount() === 0) loseLife();
    }
  }
}
// Walls: mirror the velocity component, pin to the inner edge. The
// bottom is open — that is how a life is lost.
function bounceWalls(b) {
  if (b.x - BALL_RADIUS < 0) {
    b.x = BALL_RADIUS;
    b.vx = Math.abs(b.vx);
  } else if (b.x + BALL_RADIUS > canvas.width) {
    b.x = canvas.width - BALL_RADIUS;
    b.vx = -Math.abs(b.vx);
  }
  if (b.y - BALL_RADIUS < 0) {
    b.y = BALL_RADIUS;
    b.vy = Math.abs(b.vy);
  }
}
// Circle vs brick overlap resolved along the shallowest axis; the
// sign-based flip preserves the incoming speed exactly. One brick
// per call (the first contact in pool order); the sub-step loop
// drains follow-on seam overlaps after a hit. Multi-hit tiers
// (ticket #42): a brick may pay at most ONE hp per frame — the
// charge flag (cleared in update() at frame end) makes same-frame
// re-contacts resolve the overlap but cost no further hp. A
// non-lethal hit reflects the ball normally but scores nothing,
// drops nothing and leaves bricksLeft untouched; only the lethal
// hit routes to destroyBrick().
//
// EXCITING windows (ticket #75): while the invulnerability window
// is live, breakable bricks are SMASHED STRAIGHT THROUGH —
// destroyed and scored once each via the shared kill path, the ball
// keeps its exact vector (no reflection, no pinning) and the scan
// continues to the next contact; fixed bricks still STOP the ball.
// While the blast window is live, any reflected brick hit detonates
// every breakable brick in radius of the impact point (blastAround,
// one scan per hit, no chaining). The level is captured at entry:
// a final-brick win respawns the board MID-SCAN, so both paths
// abort instead of continuing against the fresh level.
//
// NOTE: a charged brick still RESOLVES (reflect + pin) on re-contact.
// In a seam narrower than the ball the two pin faces are mutually
// exclusive (the ball cannot clear both neighbours at once), so the
// drain must be bounded by MAX_BRICK_RESCANS_PER_SUBSTEP or a wedged
// ball would cycle the pins forever (ticket #42 review round 2).
function collideBricks(b) {
  var lvl = level; // win-during-scan guard (ticket #75)
  for (var i = 0; i < bricks.length; i += 1) {
    var k = bricks[i];
    if (!k.active) continue;
    var cx = k.x + k.w / 2;
    var cy = k.y + k.h / 2;
    var ovx = k.w / 2 + BALL_RADIUS - Math.abs(b.x - cx);
    var ovy = k.h / 2 + BALL_RADIUS - Math.abs(b.y - cy);
    if (ovx <= 0 || ovy <= 0) continue;
    if (!k.unbreakable && invulnActive()) {
      // Pass-through: destroy + score once, keep the vector, keep
      // scanning this sub-step for further contacts. No pinning —
      // the ball legally occupies the brick's face on the way.
      destroyBrick(i);
      if (lvl !== level) return false; // win: board respawned, serve done
      continue;
    }
    if (ovx < ovy) {
      b.vx = b.x < cx ? -Math.abs(b.vx) : Math.abs(b.vx);
      b.x = b.x < cx
        ? k.x - BALL_RADIUS - BRICK_PIN_EPS
        : k.x + k.w + BALL_RADIUS + BRICK_PIN_EPS;
    } else {
      b.vy = b.y < cy ? -Math.abs(b.vy) : Math.abs(b.vy);
      b.y = b.y < cy
        ? k.y - BALL_RADIUS - BRICK_PIN_EPS
        : k.y + k.h + BALL_RADIUS + BRICK_PIN_EPS;
    }
    // Unbreakable bricks only reflect: no destroy, no score, no
    // drop, no bricksLeft effect — the per-frame damage charge is
    // spent on breakable bricks only (the win counts breakables).
    if (!k.unbreakable && !k.charged) {
      k.charged = true; // spent this frame's single damage charge
      var hpAtHit = k.hp;
      k.hp -= 1;
      if (k.hp <= 0) destroyBrick(i);
      else scheduleBrickChip(hpAtHit); // non-lethal: chip, not the pop
    }
    // Blast: the hit detonates the radius around the impact point
    // (ball centre at contact). Suppressed while invuln is live —
    // pass-through resolves without a bounce (documented
    // interaction); skipped after a mid-hit win.
    if (lvl === level && blastActive() && !invulnActive()) {
      blastAround(b.x, b.y);
    }
    return true;
  }
  return false;
}

// ---- Flow ----
function setScreen(which) {
  screenStart.style.display = which === "start" ? "flex" : "none";
  screenPause.style.display = which === "paused" ? "flex" : "none";
  screenOver.style.display = which === "gameover" ? "flex" : "none";
}
function startGame() {
  ensureAudio(); // a click is a user gesture: build the audio graph once
  if (gameState !== "start") return; // the button only lives on the start screen
  gameState = "playing";
  setScreen("playing");
  beginRun();
}
function restartRun() {
  ensureAudio(); // a click is a user gesture: build the audio graph once
  if (gameState !== "gameover") return; // the button only lives on that screen
  gameState = "playing";
  setScreen("playing");
  beginRun();
}
// One reset path shared by first start and restart: a fresh
// attached serve, the level-1 pattern grid (spawnLevel below), and a
// drained power-up state (no capsule or widen carries over). The
// selected difficulty's knobs are snapshotted onto the run here.
function beginRun() {
  score = 0;
  level = 1;
  lives = PLAYER_LIVES;
  var preset = DIFFICULTY[selectedDifficulty];
  // The run's ball-speed percent scales the preset's serve and the
  // growth ceiling by the same factor (curve shape preserved); the
  // named var knobs above are multiplied, never replaced.
  var speedFactor = ballSpeedPct / 100;
  serveSpeed = preset.serveSpeed * speedFactor;
  serveCeiling = MAX_BALL_SPEED * speedFactor;
  // Includes speedFactor so the back-step recompute (#77) matches the
  // forward chain under the slider at any setting.
  runServeBase = preset.serveSpeed * speedFactor;
  basePaddleW = preset.paddleWidth;
  paddleW = basePaddleW;
  // The selected mode's knobs are snapshotted beside the
  // difficulty's: a mid-run mode click applies to the NEXT run.
  runMode = selectedMode;
  dropRate = preset.dropRate * MODES[runMode].dropFactor;
  // Stage geometry follows the mode (ticket #76): alleyway runs the
  // portrait arena with its own 5×10 grid; classic/exciting run the
  // landscape default. Setting the runtime size vars and re-running
  // the letterbox pass resizes the backing store at once, and a menu
  // return (quitToMenu → beginRun) restores the classic stage the
  // same way — the geometry is a pure function of the run's mode,
  // so no dimension or grid residue survives a mode switch.
  var portrait = runMode === "alleyway";
  GAME_W = portrait ? ALLEYWAY_W : CLASSIC_W;
  GAME_H = portrait ? ALLEYWAY_H : CLASSIC_H;
  BRICK_ROWS = portrait ? ALLEYWAY_BRICK_ROWS : CLASSIC_BRICK_ROWS;
  BRICK_COLS = portrait ? ALLEYWAY_BRICK_COLS : CLASSIC_BRICK_COLS;
  resizeCanvas();
  // A narrower portrait field may now trap a paddle the previous
  // landscape run parked wide: re-clamp after the resize above.
  clampPaddle();
  runCapsuleKinds = MODES[runMode].capsuleKinds;
  // Normal play keeps the classic MAX_BALLS cap; exciting raises it
  // to the multiball ceiling (the pool is sized to the larger at
  // boot). The exciting effect windows always drain with the run.
  runBallCap = runMode === "exciting" ? MAX_BALLS_EXCITE : MAX_BALLS;
  invulnUntil = -1;
  blastUntil = -1;
  simTime = 0;
  expandUntil = -1;
  stickyUntil = -1;
  multUntil = -1;
  for (var i = 0; i < capsules.length; i += 1) capsules[i].active = false;
  spawnLevel();
  serveBall();
  renderLives();
  syncHud();
}
btnStart.addEventListener("click", startGame);
btnRestart.addEventListener("click", restartRun);
// The one exit to the start screen, shared by the pause M-key and
// the game-over Menu button: the run drains through beginRun() —
// the same reset path first-start and restart already share, so
// there is no second state-clearing path — and the game is left at
// its boot position with the start overlay up. High score and
// leaderboard are persistence, not run state: they stay put.
function quitToMenu() {
  beginRun();
  gameState = "start";
  setScreen("start");
}
// The game-over Menu CTA: state-gated like its sibling #btn-restart.
function menuFromGameOver() {
  ensureAudio(); // a click is a user gesture: build the audio graph once
  if (gameState !== "gameover") return; // the button only lives on that screen
  quitToMenu();
}
btnMenu.addEventListener("click", menuFromGameOver);
btnResetHighScore.addEventListener("click", resetHighScoreAndLeaderboard);
// Pause / resume (ticket #24): a state-gated toggle bridging only
// "playing" <-> "paused"; every other state ignores the pause keys
// (campaign-1 edge-triggered, state-gated transition precedent).
// The simulation is frozen for free: frame() runs update(dt) only in
// "playing", so simTime, paddle, balls and power-ups all stand still
// while paused, and the next frame after resume moves on.
function togglePause() {
  if (gameState === "playing") {
    gameState = "paused";
    setScreen("paused");
  } else if (gameState === "paused") {
    gameState = "playing";
    setScreen("playing");
  }
}
// Edge trigger: a keydown counts as one press only if the key is not
// held already, so browser auto-repeat of a held Escape/KeyP never
// re-toggles the pause screen.
function onPauseKeyPress(code) {
  if (pauseKeys.has(code)) return; // held already: auto-repeat, not a press
  pauseKeys.add(code);
  togglePause();
}
function resumeGame() {
  ensureAudio(); // a click is a user gesture: build the audio graph once
  if (gameState !== "paused") return; // the button only lives on the pause screen
  gameState = "playing";
  setScreen("playing");
}
btnResume.addEventListener("click", resumeGame);

// ---- Lives / game over ----
// A fresh serve always parks ONE resting ball at the paddle centre:
// every slot is drained and slot 0 rides the paddle, so an extra ball
// never carries across a serve. The sticky WINDOW does: it is a fixed
// sim-time span anchored at the moment the capsule was caught, and a serve does
// not disarm it — a window still armed when the serve lands stays
// armed until stickyUntil (the run-level reset in beginRun() is the
// one place sticky state is cleared).
function serveBall() {
  for (var i = 0; i < balls.length; i += 1) {
    balls[i].active = false;
    balls[i].attached = false;
    balls[i].attachOff = 0;
    balls[i].vx = 0;
    balls[i].vy = 0;
  }
  var b0 = balls[0];
  b0.active = true;
  b0.attached = true;
  b0.x = paddle.x;
  b0.y = paddleTop() - BALL_RADIUS;
}
// A life was lost: fresh serve, or game over when none remain. The
// ball-drop path is the in-play caller and decides (via the live-
// ball count) whether the dropped ball was the last one in play.
function loseLife() {
  lives -= 1;
  renderLives();
  if (lives <= 0) {
    lives = 0;
    enterGameOver();
  } else {
    serveBall();
  }
}
function enterGameOver() {
  gameState = "gameover";
  scheduleSound(SFX_GAME_OVER);
  // Re-serve: the frozen field behind the overlay shows the ball at
  // rest on the paddle; no live ball carries over.
  serveBall();
  gameoverFinal.textContent = "Final score " + score;
  // Ticket #48: record the run's final score before the screen
  // shows; a qualifying insertion re-renders both containers.
  recordLeaderboardScore(score);
  setScreen("gameover");
  syncHud();
}
// The #lives node holds exactly one icon span per remaining life;
// it is rebuilt only when a life is gained or lost.
function renderLives() {
  while (livesEl.firstChild) livesEl.removeChild(livesEl.firstChild);
  for (var i = 0; i < lives; i += 1) {
    var icon = document.createElement("span");
    icon.className = "life-icon";
    livesEl.appendChild(icon);
  }
}

// ---- Frame loop ----
// Per-frame order: resize -> update(dt) -> syncScore -> draw, so a
// record overtaken inside update persists on the same frame it happens.
function frame(time) {
  var dt = lastFrameTime === null
    ? 0
    : Math.min(Math.max(0, (time - lastFrameTime) / 1000), MAX_FRAME_SECONDS);
  lastFrameTime = time;
  if (resizePending) {
    resizePending = false;
    resizeCanvas();
  }
  if (gameState === "playing") update(dt);
  syncScore();
  draw();
  requestAnimationFrame(frame);
}
// Promote the live score to the persisted high score when it rises;
// the same frame also refreshes the #hiscore readout.
function syncScore() {
  if (score > highScore) {
    highScore = score;
    saveHighScore();
    syncHud();
  }
}
function update(dt) {
  simTime += dt;
  updatePaddle(dt);
  updateBalls(dt);
  updatePowerups(dt);
  // Frame end: reset the per-brick damage charges so the next
  // frame's contacts can cost hp again (ticket #42 cap).
  for (var i = 0; i < bricks.length; i += 1) bricks[i].charged = false;
}
function draw() {
  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (gameState === "start") return;
  drawBoundary();
  drawBricks();
  // Outside "playing" the field is frozen: capsules stay pooled but
  // undrawn, so the game-over screen shows a tidy board.
  if (gameState === "playing") drawPowerups();
  drawPaddle();
  drawBalls();
}
// Ticket #69: dress the ball's actual travel boundary. The three
// solid segments are the exact surfaces bounceWalls() reflects from
// (it compares the ball against 0 / canvas.width for the sides and
// 0 for the top, and reads canvas.width/height here too — no second
// source of truth), and the dashed segment is the open bottom edge
// where a life is lost (updateBalls drops the ball once it is fully
// past the bottom edge: b.y - BALL_RADIUS > canvas.height). Decorative: one fixed path each, theme-indexed
// colour lookups (COLOR_WALL/COLOR_DANGER follow applyTheme), and
// the prebuilt DANGER_DASH/NO_DASH arrays — zero per-frame
// allocation. Drawn under bricks/paddle/balls.
function drawBoundary() {
  ctx.lineWidth = WALL_LINE_W;
  ctx.strokeStyle = COLOR_WALL;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(canvas.width, 0); // top
  ctx.moveTo(0, 0);
  ctx.lineTo(0, canvas.height); // left
  ctx.moveTo(canvas.width, 0);
  ctx.lineTo(canvas.width, canvas.height); // right
  ctx.stroke();
  ctx.lineWidth = DANGER_LINE_W;
  ctx.strokeStyle = COLOR_DANGER;
  ctx.setLineDash(DANGER_DASH);
  ctx.beginPath();
  ctx.moveTo(0, canvas.height); // the open edge a life falls out of
  ctx.lineTo(canvas.width, canvas.height);
  ctx.stroke();
  ctx.setLineDash(NO_DASH);
}
function drawBricks() {
  for (var i = 0; i < bricks.length; i += 1) {
    var b = bricks[i];
    if (!b.active) continue;
    var tier = BRICK_TIERS[b.tier];
    // Wear (ticket #71): the fill is the tier's precomputed ramp
    // indexed by damage taken — full hp paints ramp[0], the base
    // colour, exactly as before; the unbreakable tier (hp 0, delta
    // 0) keeps the bare fill path with no crack strokes.
    ctx.fillStyle = tier.ramp[tier.hp - b.hp];
    ctx.fillRect(b.x, b.y, b.w, b.h);
    var dmg = tier.hp - b.hp;
    if (dmg > 0) drawBrickCracks(i, b, tier, dmg);
  }
}
// Crack overlay (ticket #71): at every intermediate damage stage a
// brick also strokes short crack polylines — one per damage taken,
// capped at CRACK_LINES_MAX, so a deeper crack keeps the stage-1
// polyline untouched (prefix stability). Each polyline is three
// points (near top / middle / near bottom of the brick). All
// coordinates are NORMALISED [0,1] pairs precomputed ONCE at module
// load from the brick's pool index by a fixed integer scramble — no
// `random` hook, so a brick keeps its own crack forever, a respawn
// inherits the same one, and the draw path only indexes:
// zero per-frame allocation.
var CRACK_LINE_W = 2;                 // crack stroke width, canvas px
var CRACK_LINES_MAX = 2;              // polylines at the deepest stage
var CRACK_POINTS_PER = 6;             // three normalised (x, y) points
var CRACK_POINTS = [];                // per pool index: CRACK_LINES_MAX × 6 floats
// Deterministic float in [0, 1) from a small integer seed: a fixed
// multiply-XOR scramble, not the testable `random` hook.
function crackScramble(seed) {
  var h = (seed * 2654435761) >>> 0;
  h = ((h ^ (h >>> 15)) * 2246822519) >>> 0;
  return ((h >>> 13) & 0xffff) / 0xffff;
}
function buildCrackPoints() {
  CRACK_POINTS.length = 0; // rebuild from scratch (module load)
  for (var i = 0; i < BRICK_ROWS * BRICK_COLS; i += 1) {
    var pts = [];
    for (var line = 0; line < CRACK_LINES_MAX; line += 1) {
      var seed = i * 73 + line * 191 + 1;
      // Keep the ink inside the brick face: x in [0.15, 0.85].
      pts.push(
        0.15 + 0.7 * crackScramble(seed + 0), 0.05,
        0.15 + 0.7 * crackScramble(seed + 1), 0.50,
        0.15 + 0.7 * crackScramble(seed + 2), 0.95
      );
    }
    CRACK_POINTS.push(pts);
  }
}
buildCrackPoints();
function drawBrickCracks(index, b, tier, dmg) {
  var lines = dmg > CRACK_LINES_MAX ? CRACK_LINES_MAX : dmg;
  var p = CRACK_POINTS[index];
  // The crack ink is the tier's DEEPEST wear shade (a precomputed
  // ramp entry, so theme-tracking and allocation-free alike).
  ctx.strokeStyle = tier.ramp[tier.hp - 1];
  ctx.lineWidth = CRACK_LINE_W;
  for (var l = 0; l < lines; l += 1) {
    var o = l * CRACK_POINTS_PER;
    ctx.beginPath();
    ctx.moveTo(b.x + p[o] * b.w, b.y + p[o + 1] * b.h);
    ctx.lineTo(b.x + p[o + 2] * b.w, b.y + p[o + 3] * b.h);
    ctx.lineTo(b.x + p[o + 4] * b.w, b.y + p[o + 5] * b.h);
    ctx.stroke();
  }
}
function drawPowerups() {
  for (var i = 0; i < capsules.length; i += 1) {
    var c = capsules[i];
    if (!c.active) continue;
    ctx.fillStyle = CAPSULE_DRAW_COLORS[c.kind];
    ctx.fillRect(c.x - CAPSULE_W / 2, c.y, CAPSULE_W, CAPSULE_H);
  }
}
function drawPaddle() {
  ctx.fillStyle = COLOR_PADDLE;
  ctx.fillRect(paddle.x - paddleW / 2, paddleTop(), paddleW, PADDLE_HEIGHT);
}
function drawBalls() {
  // EXCITING invulnerability (ticket #75): while the window is live
  // every active ball wears a tinted core plus one soft halo so the
  // state is legible at a glance. Both passes read the named colour
  // vars; the halo pass runs only while armed, so a lapsed window
  // costs the bare legacy draw exactly.
  var invuln = invulnActive();
  if (invuln) {
    ctx.globalAlpha = INVULN_GLOW_ALPHA;
    ctx.fillStyle = COLOR_BALL_INVLUN;
    for (var i = 0; i < balls.length; i += 1) {
      var h = balls[i];
      if (!h.active) continue;
      ctx.beginPath();
      ctx.arc(h.x, h.y, INVULN_GLOW_RADIUS_PX, 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = invuln ? COLOR_BALL_INVLUN : COLOR_BALL;
  for (var i = 0; i < balls.length; i += 1) {
    var b = balls[i];
    if (!b.active) continue;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_RADIUS, 0, 2 * Math.PI);
    ctx.fill();
  }
}

// ---- Boot ----
resizeCanvas();
paddle.x = canvas.width / 2;
serveBall();
setScreen("start");
renderLives();
renderLeaderboards();
syncHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
