<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Asteroid Horizon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070f;
      font-family: monospace; /* retro face for the page itself too */
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    "use strict";

    // ================================================================
    // CONFIG — named tuning constants (tweak gameplay here)
    // ================================================================
    // "var" on purpose: these are the runtime tuning knobs — reassigning
    // them from the DevTools console must work (accepted behavior).
    var THRUST = 420;          // px/s^2 applied along the ship's heading
    var FRICTION = 0.90;       // per-frame velocity retention at 60 fps (framerate-independent)
    var TURN_SPEED = 3.6;      // rad/s of rotation while turning
    const BASE_FPS = 60;         // reference rate that FRICTION is defined against
    const STOP_SPEED = 1;        // px/s — below this the ship snaps to stillness
    const MAX_FRAME_SECONDS = 1 / 30; // clamp long frames (tab switches) to avoid teleporting
    const SHIP_RADIUS = 14;      // px, hull size and wrap margin
    var ENGINE_FLAME_MIN_PX = 6;   // px, shortest flicker of the held-thrust engine flame
    var ENGINE_FLAME_MAX_PX = 16;  // px, longest flicker of the held-thrust engine flame
    // Shared amber of the impact fragments and the engine flame: the
    // flame is meant to read as the same material as the debris it
    // throws, so both draw paths take their colour from this one knob.
    var AMBER_FRAGMENT = "#fbbf24";
    var LASER_COOLDOWN_MS = 150; // ms between shots while Space is held
    var LASER_SPEED = 700;        // px/s along the ship's heading
    const LASER_POOL_SIZE = 32;   // pre-allocated laser slots, recycled (never reallocated)
    const LASER_LENGTH = 18;      // px, visual length of the beam
    var ASTEROID_BASE = 6;        // asteroids in wave 1; wave N fields ASTEROID_BASE + ASTEROID_GROWTH * (N - 1)
    var ASTEROID_GROWTH = 2;      // extra asteroids each wave above the first
    var SCORE_PER_ASTEROID = 10;  // HUD score credited per laser kill
    const SPAWN_SAFE_RADIUS = 200; // px — new asteroids spawn at least this far from the ship
    const ASTEROID_MIN_R = 12;    // px, smallest asteroid radius
    const ASTEROID_MAX_R = 20;    // px, largest asteroid radius
    const ASTEROID_SPEED_MIN = 40;   // px/s, slowest drift
    const ASTEROID_SPEED_MAX = 160;  // px/s, fastest drift
    const ASTEROID_SPAWN_EVERY = 0.25; // s between respawn attempts while below this wave's roster
    const ASTEROID_CANDIDATE_RETRIES = 8; // spawnAsteroid: candidate attempts per single spawn
    const ASTEROID_SPAWNS_PER_FRAME = 8;  // spawnAsteroids: spawn rounds per frame
    const ASTEROID_MIN_GAP = 40;     // px, extra spacing between live asteroids
    const ASTEROID_INWARD_MIN = 20;  // px/s, smallest inward velocity component accepted at spawn (bounds entry time)
    const ASTEROID_VERTS = 8;        // points per irregular polygon outline
    const ASTEROID_POOL_SIZE = 48;   // pre-allocated asteroid slots, recycled (never reallocated)
    var DRONE_BASE = 0;              // drones in wave 1; wave N fields DRONE_BASE + DRONE_GROWTH * (N - 1)
    var DRONE_GROWTH = 1;            // extra drones each wave above the first
    var BETWEEN_WAVES_S = 3;         // s of pause between a cleared wave and the next one
    var SCORE_PER_DRONE = 25;        // HUD score credited per laser kill
    const DRONE_RADIUS = 10;         // px, drone hull size
    var DRONE_SPEED = 120;           // px/s, constant forward speed
    const DRONE_TURN_SPEED = 2.4;    // rad/s, max heading change while tracking the ship
    const DRONE_SPAWN_EVERY = 0.35;  // s between respawn attempts while below this wave's roster
    const DRONE_MAX_SPAWNS = 4;      // spawn attempts per frame (bounds the rejection loop)
    const DRONE_POOL_SIZE = 24;      // pre-allocated drone slots, recycled (never reallocated)
    var PLAYER_MAX_HP = 3;           // starting hull points (shown as "HP n" in the HUD)
    var INVULN_MS = 1500;            // ms of invulnerability after taking a hit
    // UI — retro styling: one monospace face and one accent colour for
    // every HUD/overlay glyph (all UI is canvas-drawn through these).
    const UI_FONT = "monospace";     // retro face for all HUD/overlay text
    const UI_ACCENT = "#5eead4";     // single accent: HUD/overlay text, ship, lasers
    const UI_TITLE_PX = 48;          // px, screen titles (game name, GAME OVER)
    const UI_LINE_PX = 20;           // px, primary screen lines (prompts, final score)
    const UI_HUD_PX = 16;            // px, HUD rows and secondary screen lines
    const PARTICLES_PER_BURST = 16;  // particles per impact burst (ticket requires >= 10)
    const PARTICLE_LIFE_S = 0.7;     // s a particle lives before recycling
    const PARTICLE_SPEED_MIN = 60;   // px/s, slowest burst fragment
    const PARTICLE_SPEED_MAX = 260;  // px/s, fastest burst fragment
    const PARTICLE_POOL_SIZE = 128;  // pre-allocated particle slots, recycled (never reallocated)
    // Audio — procedural Web Audio SFX (no external files). Every sound
    // routes through a single master GainNode levelled by MASTER_GAIN;
    // setting it to 0 silences all SFX. Tuning knobs are "var" like the
    // rest of the console-retunable constants.
    var MASTER_GAIN = 0.2;           // master bus level (0..1); 0 silences every SFX
    const SFX_NOISE_S = 0.5;         // s, length of the pre-baked white-noise buffer
    // Shoot: one short square-wave blip, pitch dropping from FROM to TO.
    const SFX_SHOOT_FROM_HZ = 920;   // blip opening pitch
    const SFX_SHOOT_TO_HZ = 420;     // blip ending pitch
    const SFX_SHOOT_LEVEL = 0.5;     // blip amplitude into the master bus
    const SFX_SHOOT_S = 0.07;        // s, blip length
    // Impact sounds: all three are low-passed white-noise bursts that
    // differ only in their preset constants (cutoff, amplitude, decay).
    const SFX_ASTEROID_KILL_HZ = 500;   // lowpass cutoff — deep rock thud
    const SFX_ASTEROID_KILL_LEVEL = 1.0; // burst amplitude into the master bus
    const SFX_ASTEROID_KILL_S = 0.25;   // s, thud decay
    const SFX_DRONE_KILL_HZ = 900;      // sharper zap
    const SFX_DRONE_KILL_LEVEL = 0.8;
    const SFX_DRONE_KILL_S = 0.18;
    const SFX_PLAYER_HIT_HZ = 300;      // long, heavy hull hit
    const SFX_PLAYER_HIT_LEVEL = 1.0;
    const SFX_PLAYER_HIT_S = 0.45;

    // ================================================================
    // STATE
    // ================================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const ship = {
      x: 0,
      y: 0,
      heading: -Math.PI / 2, // pointing up
      vx: 0,
      vy: 0,
    };
    const keys = new Set();
    let gameTime = 0; // seconds of accumulated simulation time
    let score = 0;    // HUD score: one SCORE_PER_ASTEROID per rock kill, one SCORE_PER_DRONE per drone kill
    let hp = PLAYER_MAX_HP;          // current hull; one impact costs exactly 1. Snapshotted from
                                     // PLAYER_MAX_HP at load and again in startGame — the knob is
                                     // read at (re)start, not live (see docs/DECISIONS.md)
    let shipDead = false;            // hp reached 0: ship removed, all input ignored
    let invulnUntil = Number.NEGATIVE_INFINITY; // sim time until which a hit costs nothing
    let wave = 1;                     // current wave number (shown in the HUD)
    let waveBuilt = 0;                // hazards spawned since this wave started
    let inIntermission = false;       // BETWEEN_WAVES_S pause after a cleared wave
    let intermissionEndsAt = 0;       // sim time at which the next wave starts
    let gameState = "start";          // "start" | "playing" | "gameover": gates sim, input and screen
    // Random source lives in a mutable `var` so unit tests (and console
    // experiments) can install a deterministic sequence; the game itself
    // only ever CALLS it, never reassigns it.
    var random = Math.random;

    // Pre-allocated laser pool: every shot mutates an existing slot in
    // place, so sustained fire never creates new objects.
    const laserPool = { slots: [] };
    for (let i = 0; i < LASER_POOL_SIZE; i++) {
      laserPool.slots.push({ active: false, x: 0, y: 0, dx: 0, dy: 0, dt: 0 });
    }

    // Pre-allocated asteroid pool: every rock mutates an existing slot in
    // place (including its polygon outline), so spawning never allocates.
    // `entry` is the edge this rock is still drifting in from (0 top, 1
    // bottom, 2 left, 3 right); -1 once its centre is inside the field.
    // Wrap-around is suspended on that axis until then, so the fully
    // off-screen spawn offset can never trigger an instant teleport.

    // Pre-allocated particle pool: impact bursts mutate existing slots
    // in place, so rapid-fire combat never creates new objects.
    const particlePool = { slots: [] };
    for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
      particlePool.slots.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0 });
    }

    const asteroids = { slots: [] };
    for (let i = 0; i < ASTEROID_POOL_SIZE; i++) {
      asteroids.slots.push({
        active: false,
        x: 0,
        y: 0,
        r: ASTEROID_MIN_R,
        vx: 0,
        vy: 0,
        rot: 0,
        spin: 0,
        entry: -1,
        shape: [], // radial offsets in [0.75, 1], reused for every outline
      });
    }

    // Pre-allocated drone pool: every drone mutates an existing slot in
    // place, so spawning never allocates.
    const drones = { slots: [] };
    for (let i = 0; i < DRONE_POOL_SIZE; i++) {
      drones.slots.push({ active: false, x: 0, y: 0, heading: 0 });
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);
    ship.x = canvas.width / 2;
    ship.y = canvas.height / 2;

    // ================================================================
    // INPUT — arrow keys and WASD both handled
    // ================================================================
    const KEY_CODES = ["ArrowUp", "KeyW", "ArrowLeft", "KeyA", "ArrowRight", "KeyD", "Space"];

    window.addEventListener("keydown", (e) => {
      initAudio(); // first gesture: create/resume the AudioContext (no-op before then, silent without Web Audio)
      // Screen transitions are edge-triggered and state-gated: Enter
      // starts from the start screen; Enter or R restarts from game
      // over. Neither acts in any other state (a play-run is never
      // reset by stray presses).
      if ((e.code === "Enter" || e.code === "NumpadEnter") && gameState === "start") { startGame(); return; }
      if ((e.code === "Enter" || e.code === "KeyR") && gameState === "gameover") { startGame(); return; }
      if (gameState !== "playing") return; // menu screens: nothing else acts
      if (!KEY_CODES.includes(e.code)) return;
      e.preventDefault();
      keys.add(e.code);
    });
    window.addEventListener("keyup", (e) => {
      keys.delete(e.code);
    });
    window.addEventListener("blur", () => {
      keys.clear(); // focus lost (alt-tab, window switch): the held keys no longer
                    // reach us, and their keyups are lost — drop them all
    });

    // ================================================================
    // SCREENS — start screen -> play -> game over. startGame() is the
    // one reset path, used by both the first start and the restart:
    // it wipes every pool and puts the ship, hull, score and wave
    // back to their fresh-run values, so a restarted game has zero
    // live entities by construction.
    // ================================================================
    function startGame() {
      keys.clear(); // a movement key held at the moment of death (keyup lost to
                    // a focus blip) would otherwise ghost-thrust the fresh run
      for (const s of laserPool.slots) s.active = false;
      for (const a of asteroids.slots) a.active = false;
      for (const d of drones.slots) d.active = false;
      for (const p of particlePool.slots) p.active = false;
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.heading = -Math.PI / 2; // pointing up
      ship.vx = 0;
      ship.vy = 0;
      hp = PLAYER_MAX_HP;
      shipDead = false;
      invulnUntil = Number.NEGATIVE_INFINITY;
      score = 0;
      wave = 1;
      waveBuilt = 0;
      inIntermission = false;
      intermissionEndsAt = 0;
      lastFireAt = Number.NEGATIVE_INFINITY;
      lastSpawnAt = Number.NEGATIVE_INFINITY;
      lastDroneSpawnAt = Number.NEGATIVE_INFINITY;
      gameState = "playing";
    }

    // ================================================================
    // FIRING — Space releases one laser from the nose, cooldown-gated
    // ================================================================
    let lastFireAt = Number.NEGATIVE_INFINITY; // permits an instant first shot

    function tryFire() {
      if (!keys.has("Space")) return;
      if (gameTime - lastFireAt < LASER_COOLDOWN_MS / 1000) return;
      // Plain indexed scan: no .find closure allocated per shot.
      let slot = null;
      for (let i = 0; i < laserPool.slots.length; i++) {
        if (!laserPool.slots[i].active) { slot = laserPool.slots[i]; break; }
      }
      if (!slot) return; // pool exhausted — wait for a free slot, never allocate
      const dx = Math.cos(ship.heading);
      const dy = Math.sin(ship.heading);
      const nose = SHIP_RADIUS + LASER_LENGTH / 2; // spawn the beam just past the tip
      slot.active = true;
      slot.x = ship.x + dx * nose;
      slot.y = ship.y + dy * nose;
      slot.dx = dx;
      slot.dy = dy;
      lastFireAt = gameTime;
      playShoot();
    }

    function updateLasers(dt) {
      const w = canvas.width;
      const h = canvas.height;
      const CULL_MARGIN = LASER_LENGTH; // px — recycle only once fully off-screen
      for (let i = 0; i < laserPool.slots.length; i++) {
        const s = laserPool.slots[i];
        if (!s.active) continue;
        s.x += s.dx * LASER_SPEED * dt;
        s.y += s.dy * LASER_SPEED * dt;
        s.dt = dt; // last step, so hit tests can reconstruct the sweep segment
        if (s.x < -CULL_MARGIN || s.x > w + CULL_MARGIN || s.y < -CULL_MARGIN || s.y > h + CULL_MARGIN) s.active = false;
      }
    }

    // ================================================================
    // ASTEROIDS — pooled rocks that spawn at the edges, drift and
    // wrap; lasers destroy them for SCORE_PER_ASTEROID each
    // ================================================================
    // Pick one candidate at a random point just outside a random
    // edge, drifting back into the field (aimed at the centre with a
    // ±60° jitter, re-aimed if the jitter points it back out). Rejected
    // outright if it would start closer than SPAWN_SAFE_RADIUS to the
    // ship, or sit on top of a live rock.
    function spawnAsteroid() {
      const w = canvas.width;
      const h = canvas.height;
      const slot = asteroids.slots.find((a) => !a.active);
      if (!slot) return false; // pool exhausted — skip the spawn, never allocate

      for (let attempt = 0; attempt < ASTEROID_CANDIDATE_RETRIES; attempt++) {
        const u = random(); // which edge: ¼ of the roll per side (0 top, 1 bottom, 2 left, 3 right)
        const edge = u < 0.25 ? 0 : u < 0.5 ? 1 : u < 0.75 ? 2 : 3;
        const r = ASTEROID_MIN_R + (ASTEROID_MAX_R - ASTEROID_MIN_R) * random();
        let x;
        let y;
        if (edge === 0) {       // top
          x = random() * w;
          y = -(r + 1);
        } else if (edge === 1) { // bottom
          x = random() * w;
          y = h + r + 1;
        } else if (edge === 2) { // left
          x = -(r + 1);
          y = random() * h;
        } else {                 // right
          x = w + r + 1;
          y = random() * h;
        }

        let ok = true;
        const ds = Math.hypot(x - ship.x, y - ship.y);
        if (ds < SPAWN_SAFE_RADIUS) ok = false;
        if (ok) {
          for (const other of asteroids.slots) {
            if (other.active && Math.hypot(x - other.x, y - other.y) < r + other.r + ASTEROID_MIN_GAP) {
              ok = false;
              break;
            }
          }
        }
        if (!ok) continue; // retry from a fresh candidate

        // Irregular outline: regenerate in place (no per-spawn allocation).
        slot.shape.length = ASTEROID_VERTS;
        for (let v = 0; v < ASTEROID_VERTS; v++) slot.shape[v] = 0.75 + 0.25 * random();

        // Drift toward the centre with a ±60° jitter, at a random pace.
        const toCentre = Math.atan2(h / 2 - y, w / 2 - x);
        const heading = toCentre + (random() - 0.5) * ((2 * Math.PI) / 3);
        const speed = ASTEROID_SPEED_MIN + (ASTEROID_SPEED_MAX - ASTEROID_SPEED_MIN) * random();
        slot.vx = Math.cos(heading) * speed;
        slot.vy = Math.sin(heading) * speed;
        // Near a corner the jitter can point the rock back out of the
        // field along the spawn edge; mirror the outward component so
        // every rock is guaranteed to drift in (entry suppression below
        // relies on this).
        if (edge === 0 && slot.vy <= 0) slot.vy = -slot.vy;
        else if (edge === 1 && slot.vy >= 0) slot.vy = -slot.vy;
        else if (edge === 2 && slot.vx <= 0) slot.vx = -slot.vx;
        else if (edge === 3 && slot.vx >= 0) slot.vx = -slot.vx;
        // After the mirror the inward component is non-negative, but a
        // near-tangent drift could take an unbounded long to enter: reject
        // candidates below the named floor and retry.
        const inward = edge === 0 ? slot.vy : edge === 1 ? -slot.vy : edge === 2 ? slot.vx : -slot.vx;
        if (inward < ASTEROID_INWARD_MIN) continue;

        slot.active = true;
        slot.x = x;
        slot.y = y;
        slot.r = r;
        slot.entry = edge;
        slot.rot = random() * Math.PI * 2;
        slot.spin = (random() - 0.5) * 0.8; // slow, varied tumble (rad/s)
        return true;
      }
      return false; // every candidate was rejected: too close to the ship
                    // to be safe, or its inward component fell below
                    // ASTEROID_INWARD_MIN — try again later
    }

    let lastSpawnAt = Number.NEGATIVE_INFINITY; // sim time of the last spawn attempt

    function spawnAsteroids() {
      if (gameTime - lastSpawnAt < ASTEROID_SPAWN_EVERY) return;
      lastSpawnAt = gameTime;
      let count = 0;
      for (const a of asteroids.slots) if (a.active) count++;
      const cap = waveAsteroidCap(wave); // this wave's asteroid roster, clamped to the pool
      let budget = ASTEROID_SPAWNS_PER_FRAME;
      while (count < cap && budget-- > 0) {
        if (spawnAsteroid()) { count++; waveBuilt++; }
        else break;
      }
    }

    function updateAsteroids(dt) {
      const w = canvas.width;
      const h = canvas.height;
      for (const a of asteroids.slots) {
        if (!a.active) continue;
        a.x += a.vx * dt;
        a.y += a.vy * dt;
        a.rot += a.spin * dt;
        // A rock still drifting in from its spawn edge keeps that
        // axis's wrap suspended until its centre crosses the edge
        // (its inward velocity is guaranteed at spawn, so this
        // always happens). Normal wrap resumes once it is inside.
        if (a.entry === 0 && a.y > 0) a.entry = -1;
        else if (a.entry === 1 && a.y < h) a.entry = -1;
        else if (a.entry === 2 && a.x > 0) a.entry = -1;
        else if (a.entry === 3 && a.x < w) a.entry = -1;
        // Screen wrap: fully off one edge, re-enter the opposite one.
        if (a.entry !== 2 && a.entry !== 3 && a.x < -a.r) a.x += w + 2 * a.r;
        else if (a.entry !== 2 && a.entry !== 3 && a.x > w + a.r) a.x -= w + 2 * a.r;
        if (a.entry !== 0 && a.entry !== 1 && a.y < -a.r) a.y += h + 2 * a.r;
        else if (a.entry !== 0 && a.entry !== 1 && a.y > h + a.r) a.y -= h + 2 * a.r;
      }
    }

    // Shortest distance from point P to segment AB — sweeping segment
    // test so a fast beam can never tunnel through a rock in one frame.
    function segPointDistance(ax, ay, bx, by, px, py) {
      const abx = bx - ax;
      const aby = by - ay;
      const len2 = abx * abx + aby * aby;
      let t = len2 === 0 ? 0 : ((px - ax) * abx + (py - ay) * aby) / len2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (ax + abx * t), py - (ay + aby * t));
    }

    function checkLaserKills() {
      const slots = laserPool.slots;
      const rocks = asteroids.slots;
      const chasers = drones.slots;
      for (let li = 0; li < slots.length; li++) {
        const s = slots[li];
        if (!s.active) continue;
        const px = s.x - s.dx * LASER_SPEED * s.dt; // previous frame's position
        const py = s.y - s.dy * LASER_SPEED * s.dt;
        for (let ai = 0; ai < rocks.length; ai++) {
          const a = rocks[ai];
          if (!a.active) continue;
          if (segPointDistance(px, py, s.x, s.y, a.x, a.y) <= a.r) {
            a.active = false; // destroyed: removed from the field
            score += SCORE_PER_ASTEROID;
            playAsteroidKill();
          }
        }
        for (let di = 0; di < chasers.length; di++) {
          const d = chasers[di];
          if (!d.active) continue;
          if (segPointDistance(px, py, s.x, s.y, d.x, d.y) <= DRONE_RADIUS) {
            d.active = false; // destroyed: removed from the field
            score += SCORE_PER_DRONE;
            burst(d.x, d.y); // shared impact burst, same pool as hull hits
            playDroneKill();
          }
        }
      }
    }

    // ================================================================
    // SHIP DAMAGE — hull overlaps cost 1 hp, shatter the rock, burst
    // particles; the ship is immune for INVULN_MS after every hit
    // ================================================================
    function burst(x, y) {
      // Fill up to PARTICLES_PER_BURST inactive slots; if the pool is
      // exhausted the burst is capped, never allocated.
      let spawned = 0;
      for (const p of particlePool.slots) {
        if (spawned >= PARTICLES_PER_BURST) break;
        if (p.active) continue;
        const ang = random() * Math.PI * 2;
        const speed = PARTICLE_SPEED_MIN + (PARTICLE_SPEED_MAX - PARTICLE_SPEED_MIN) * random();
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(ang) * speed;
        p.vy = Math.sin(ang) * speed;
        p.age = 0;
        spawned++;
      }
    }

    function updateParticles(dt) {
      for (const p of particlePool.slots) {
        if (!p.active) continue;
        p.age += dt;
        if (p.age >= PARTICLE_LIFE_S) {
          p.active = false; // recycled
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }

    // One hull impact: burst, exactly 1 hp, invulnerability window —
    // or the game-over hand-off on the final blow.
    function hitShip(burstX, burstY) {
      burst(burstX, burstY);
      playPlayerHit();
      hp -= 1;
      if (hp <= 0) {
        shipDead = true;
        gameState = "gameover"; // final blow: hand the screen to the overlay
      } else {
        invulnUntil = gameTime + INVULN_MS / 1000;
      }
    }

    function checkShipHits() {
      if (shipDead) return;
      if (gameTime < invulnUntil) return; // immune: ignore every hazard
      // Rocks first, then drones; one damage event per frame, even if
      // several hazards overlap. The impact pipeline itself lives in
      // applyHullImpact so rock and drone hits can never diverge.
      for (const a of asteroids.slots) {
        if (!a.active) continue;
        if (Math.hypot(a.x - ship.x, a.y - ship.y) > a.r + SHIP_RADIUS) continue;
        applyHullImpact(a);
        return; // one impact per frame, even if several rocks overlap
      }
      for (const d of drones.slots) {
        if (!d.active) continue;
        if (Math.hypot(d.x - ship.x, d.y - ship.y) > DRONE_RADIUS + SHIP_RADIUS) continue;
        applyHullImpact(d);
        return;
      }
    }

    // The one hull-impact pipeline (rocks and drones alike): the hazard
    // is destroyed at the point of contact, then exactly 1 hp is taken
    // at the overlap midpoint (burst, invulnerability, game-over there).
    function applyHullImpact(hazard) {
      hazard.active = false; // the impact shatters the rock / destroys the drone
      hitShip((ship.x + hazard.x) / 2, (ship.y + hazard.y) / 2); // mid-point of the overlap
    }

    // ================================================================
    // DRONES — pooled chasers that spawn at the edges and turn their
    // heading toward the ship each frame at a bounded turn rate
    // ================================================================
    // Pick one candidate just outside a random edge, born facing the
    // ship. Rejected outright if it would start closer than
    // SPAWN_SAFE_RADIUS to the ship.
    function spawnDrone() {
      const w = canvas.width;
      const h = canvas.height;
      const slot = drones.slots.find((d) => !d.active);
      if (!slot) return false; // pool exhausted — skip the spawn, never allocate
      const r = DRONE_RADIUS;

      for (let attempt = 0; attempt < DRONE_MAX_SPAWNS; attempt++) {
        const u = random(); // which edge: ¼ of the roll per side (0 top, 1 bottom, 2 left, 3 right)
        const edge = u < 0.25 ? 0 : u < 0.5 ? 1 : u < 0.75 ? 2 : 3;
        let x;
        let y;
        if (edge === 0) {       // top
          x = random() * w;
          y = -(r + 1);
        } else if (edge === 1) { // bottom
          x = random() * w;
          y = h + r + 1;
        } else if (edge === 2) { // left
          x = -(r + 1);
          y = random() * h;
        } else {                 // right
          x = w + r + 1;
          y = random() * h;
        }

        const ds = Math.hypot(x - ship.x, y - ship.y);
        if (ds < SPAWN_SAFE_RADIUS) continue; // retry from a fresh candidate

        slot.active = true;
        slot.x = x;
        slot.y = y;
        slot.heading = Math.atan2(ship.y - y, ship.x - x); // born aiming at the ship
        return true;
      }
      return false; // field too crowded near the ship to be safe — try again later
    }

    let lastDroneSpawnAt = Number.NEGATIVE_INFINITY; // sim time of the last spawn attempt

    function spawnDrones() {
      if (gameTime - lastDroneSpawnAt < DRONE_SPAWN_EVERY) return;
      lastDroneSpawnAt = gameTime;
      let count = 0;
      for (const d of drones.slots) if (d.active) count++;
      const cap = waveDroneCap(wave); // this wave's drone roster, clamped to the pool
      let budget = DRONE_MAX_SPAWNS;
      while (count < cap && budget-- > 0) {
        if (spawnDrone()) { count++; waveBuilt++; }
        else break;
      }
    }

    function updateDrones(dt) {
      const limit = DRONE_TURN_SPEED * dt; // bounded turn: steer, never teleport
      for (const d of drones.slots) {
        if (!d.active) continue;
        const desired = Math.atan2(ship.y - d.y, ship.x - d.x);
        const err = Math.atan2(Math.sin(desired - d.heading), Math.cos(desired - d.heading));
        d.heading += Math.max(-limit, Math.min(limit, err));
        d.x += Math.cos(d.heading) * DRONE_SPEED * dt;
        d.y += Math.sin(d.heading) * DRONE_SPEED * dt;
      }
    }

    // ================================================================
    // AUDIO — procedural SFX via Web Audio. The AudioContext is created
    // (and resumed) only on the first user gesture, never on page load;
    // before then — and in engines without Web Audio — every generator
    // is a silent no-op. Each SFX is scheduled through a per-event
    // envelope gain into the single master GainNode, whose level tracks
    // MASTER_GAIN live so a console reassignment applies to the next
    // sound (and 0 silences everything).
    // ================================================================
    let audioCtx = null;   // null until the first gesture (or no Web Audio)
    let masterGain = null; // the one node every SFX routes through
    let noiseBuffer = null; // pre-baked white noise, created once, replayed per burst

    function initAudio() {
      if (audioCtx) {
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
        return;
      }
      if (typeof AudioContext === "undefined") return; // silent, no error
      audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      masterGain = audioCtx.createGain();
      masterGain.gain.value = MASTER_GAIN;
      masterGain.connect(audioCtx.destination);
      const frames = Math.max(1, Math.ceil(audioCtx.sampleRate * SFX_NOISE_S));
      noiseBuffer = audioCtx.createBuffer(1, frames, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = random() * 2 - 1; // the injectable random, like every other random value
    }

    // The shoot: one short square-wave blip with a falling pitch.
    function playShoot() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      masterGain.gain.value = MASTER_GAIN; // live console retunes apply
      const osc = audioCtx.createOscillator();
      osc.type = "square";
      osc.frequency.setValueAtTime(SFX_SHOOT_FROM_HZ, t);
      osc.frequency.exponentialRampToValueAtTime(SFX_SHOOT_TO_HZ, t + SFX_SHOOT_S);
      const env = audioCtx.createGain();
      env.gain.setValueAtTime(SFX_SHOOT_LEVEL, t);
      env.gain.exponentialRampToValueAtTime(0.001, t + SFX_SHOOT_S);
      osc.connect(env);
      env.connect(masterGain);
      osc.start(t);
      osc.stop(t + SFX_SHOOT_S);
    }

    // White-noise burst through a low-pass filter. Asteroid kill, drone
    // kill and the player hit all share this shape and differ only in
    // their preset constants (cutoff, amplitude, decay length).
    function playNoiseBurst(cutoffHz, level, durS) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      masterGain.gain.value = MASTER_GAIN; // live console retunes apply
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = cutoffHz;
      const env = audioCtx.createGain();
      env.gain.setValueAtTime(level, t);
      env.gain.exponentialRampToValueAtTime(0.001, t + durS);
      src.connect(filter);
      filter.connect(env);
      env.connect(masterGain);
      src.start(t);
      src.stop(t + durS);
    }
    function playAsteroidKill() {
      playNoiseBurst(SFX_ASTEROID_KILL_HZ, SFX_ASTEROID_KILL_LEVEL, SFX_ASTEROID_KILL_S);
    }
    function playDroneKill() {
      playNoiseBurst(SFX_DRONE_KILL_HZ, SFX_DRONE_KILL_LEVEL, SFX_DRONE_KILL_S);
    }
    function playPlayerHit() {
      playNoiseBurst(SFX_PLAYER_HIT_HZ, SFX_PLAYER_HIT_LEVEL, SFX_PLAYER_HIT_S);
    }

    // ================================================================
    // WAVES — wave N fields a fixed roster of hazards, sized by the
    // *_BASE / *_GROWTH tuning knobs and clamped to the pre-allocated
    // pool capacities (a roster without slots could never be built,
    // so its wave could never end). The roster is built through the
    // normal spawners at wave start; a hazard destroyed mid-wave is
    // never replaced. Clearing every hazard starts a BETWEEN_WAVES_S
    // pause, after which the wave number steps up by exactly one.
    // ================================================================
    function waveAsteroidCount(n) {
      return ASTEROID_BASE + ASTEROID_GROWTH * (n - 1);
    }
    function waveDroneCount(n) {
      return DRONE_BASE + DRONE_GROWTH * (n - 1);
    }
    // Effective rosters: the formulas above, floored by the fixed pool
    // sizes. Beyond the pools there is nowhere to spawn, and a wave
    // that can never reach its roster can never be cleared.
    function waveAsteroidCap(n) {
      return Math.min(waveAsteroidCount(n), ASTEROID_POOL_SIZE);
    }
    function waveDroneCap(n) {
      return Math.min(waveDroneCount(n), DRONE_POOL_SIZE);
    }
    function waveTotal(n) {
      return waveAsteroidCap(n) + waveDroneCap(n);
    }

    function hazardCount() {
      let n = 0;
      for (const a of asteroids.slots) if (a.active) n++;
      for (const d of drones.slots) if (d.active) n++;
      return n;
    }

    function updateWaves() {
      if (inIntermission) {
        if (gameTime >= intermissionEndsAt) {
          inIntermission = false;
          wave += 1; // exactly one step per wave
          waveBuilt = 0;
        }
        // Intentional: the advance frame returns WITHOUT building the new
        // roster — the build starts one frame later. Do not "fix" this
        // fall-through (review #7-3).
        return;
      }
      const total = waveTotal(wave);
      if (waveBuilt < total) {
        spawnAsteroids(); // stops at this wave's asteroid roster
        spawnDrones();    // stops at this wave's drone roster
      }
      // A zero-sized roster can never be "cleared": it stays empty and
      // holds the wave number steady (keeps zero-field setups stable).
      if (total > 0 && waveBuilt >= total && hazardCount() === 0) {
        inIntermission = true;
        intermissionEndsAt = gameTime + BETWEEN_WAVES_S;
      }
    }

    // ================================================================
    // UPDATE — physics with delta-time integration
    // ================================================================
    function update(dt) {
      // Impact fragments tick to completion regardless of screen so
      // the death burst still plays out behind the game-over overlay.
      updateParticles(dt);

      // Only the playing screen advances the simulation: the start
      // screen is a static, empty field, and game over freezes the
      // world behind the overlay (startGame wipes it on restart).
      if (gameState !== "playing") return;

      // A dead ship is inert: no physics, no firing, no further damage.
      if (!shipDead) {
        // Rotate: left or right (A/D or arrow keys).
        const turn =
          (keys.has("ArrowRight") || keys.has("KeyD") ? 1 : 0) -
          (keys.has("ArrowLeft") || keys.has("KeyA") ? 1 : 0);
        ship.heading += turn * TURN_SPEED * dt;

        // Thrust: up or W accelerates along the current heading.
        if (keys.has("ArrowUp") || keys.has("KeyW")) {
          ship.vx += Math.cos(ship.heading) * THRUST * dt;
          ship.vy += Math.sin(ship.heading) * THRUST * dt;
        }

        // Friction: decay velocity, framerate-independently; snap to rest.
        const retention = Math.pow(FRICTION, dt * BASE_FPS);
        ship.vx *= retention;
        ship.vy *= retention;
        if (ship.vx * ship.vx + ship.vy * ship.vy < STOP_SPEED * STOP_SPEED) {
          ship.vx = 0;
          ship.vy = 0;
        }

        // Integrate position.
        ship.x += ship.vx * dt;
        ship.y += ship.vy * dt;

        // Screen wrap: exiting any edge re-enters at the opposite edge
        // this same frame.
        const w = canvas.width;
        const h = canvas.height;
        if (ship.x < -SHIP_RADIUS) ship.x += w + 2 * SHIP_RADIUS;
        else if (ship.x > w + SHIP_RADIUS) ship.x -= w + 2 * SHIP_RADIUS;
        if (ship.y < -SHIP_RADIUS) ship.y += h + 2 * SHIP_RADIUS;
        else if (ship.y > h + SHIP_RADIUS) ship.y -= h + 2 * SHIP_RADIUS;

        // Fire, then test the hull against the field.
        tryFire();
        checkShipHits();
      }

      updateLasers(dt);
      checkLaserKills();

      // Drift the rocks, steer the chasers, then advance the wave
      // machine: build the current roster (destroyed hazards stay
      // destroyed) and end the wave once every hazard is cleared.
      updateAsteroids(dt);
      updateDrones(dt);
      updateWaves();
    }

    // ================================================================
    // RENDER
    // ================================================================
    // All HUD/overlay text shares the retro pair: UI_FONT (monospace)
    // in the single UI_ACCENT colour, centred for screens and left-
    // aligned for the HUD column.
    function drawStartScreen() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      ctx.textAlign = "center";
      ctx.fillStyle = UI_ACCENT;
      ctx.font = `${UI_TITLE_PX}px ${UI_FONT}`;
      ctx.fillText("ASTEROID HORIZON", cx, cy - 90);
      ctx.font = `${UI_LINE_PX}px ${UI_FONT}`;
      ctx.fillText("PRESS ENTER TO START", cx, cy);
      ctx.font = `${UI_HUD_PX}px ${UI_FONT}`;
      ctx.fillText("ARROWS / WASD  MOVE", cx, cy + 64);
      ctx.fillText("SPACE  FIRE", cx, cy + 92);
      ctx.textAlign = "left";
    }

    function drawGameOverScreen() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      ctx.textAlign = "center";
      ctx.fillStyle = UI_ACCENT;
      ctx.font = `${UI_TITLE_PX}px ${UI_FONT}`;
      ctx.fillText("GAME OVER", cx, cy - 40);
      ctx.font = `${UI_LINE_PX}px ${UI_FONT}`;
      ctx.fillText(`FINAL SCORE ${score}`, cx, cy + 10); // same `score` the HUD showed
      ctx.font = `${UI_HUD_PX}px ${UI_FONT}`;
      ctx.fillText("PRESS ENTER OR R TO RESTART", cx, cy + 52);
      ctx.textAlign = "left";
    }

    function render() {
      ctx.fillStyle = "#05070f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Start screen: title, prompt and control list — nothing else.
      if (gameState === "start") {
        drawStartScreen();
        return;
      }

      // Ship: hidden once destroyed; blinks while invulnerable.
      if (!shipDead) {
        ctx.save();
        if (gameTime < invulnUntil && Math.floor(gameTime * 12) % 2 === 0) {
          ctx.globalAlpha = 0.3;
        }
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.heading);
        ctx.beginPath();
        ctx.moveTo(SHIP_RADIUS, 0);
        ctx.lineTo(-SHIP_RADIUS * 0.7, SHIP_RADIUS * 0.6);
        ctx.lineTo(-SHIP_RADIUS * 0.4, 0);
        ctx.lineTo(-SHIP_RADIUS * 0.7, -SHIP_RADIUS * 0.6);
        ctx.closePath();
        ctx.fillStyle = "#101826";
        ctx.fill();
        ctx.strokeStyle = UI_ACCENT;
        ctx.lineWidth = 2;
        ctx.stroke();
        // Engine flame: while thrust (Up/W) is held, one flickering
        // triangle from the rear notch, sharing this exact transform so
        // it rotates with the hull. Coordinates are computed inline and
        // the path reuses the hull's stroke settings — a thrust frame
        // allocates nothing.
        if (keys.has("ArrowUp") || keys.has("KeyW")) {
          const flicker = random(); // the injectable random, like every other random value
          const len = ENGINE_FLAME_MIN_PX + (ENGINE_FLAME_MAX_PX - ENGINE_FLAME_MIN_PX) * flicker;
          ctx.beginPath();
          ctx.moveTo(-SHIP_RADIUS * 0.4, SHIP_RADIUS * 0.35);
          ctx.lineTo(-SHIP_RADIUS * 0.4 - len, 0); // the flickering tip
          ctx.lineTo(-SHIP_RADIUS * 0.4, -SHIP_RADIUS * 0.35);
          ctx.closePath();
          ctx.fillStyle = AMBER_FRAGMENT; // same amber as the impact fragments
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore(); // also restores globalAlpha
      }

      // Lasers: one batched path so a full pool costs a single stroke.
      // With nothing active there is no path to draw — skip it entirely.
      let anyLaser = false;
      for (let i = 0; i < laserPool.slots.length; i++) {
        if (laserPool.slots[i].active) { anyLaser = true; break; }
      }
      if (anyLaser) {
        ctx.strokeStyle = UI_ACCENT;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const half = LASER_LENGTH / 2;
        for (let i = 0; i < laserPool.slots.length; i++) {
          const s = laserPool.slots[i];
          if (!s.active) continue;
          ctx.moveTo(s.x - s.dx * half, s.y - s.dy * half);
          ctx.lineTo(s.x + s.dx * half, s.y + s.dy * half);
        }
        ctx.stroke();
      }

      // Particles: 4 px amber fragments fading over their short life.
      ctx.fillStyle = AMBER_FRAGMENT;
      for (const p of particlePool.slots) {
        if (!p.active) continue;
        ctx.globalAlpha = 1 - p.age / PARTICLE_LIFE_S;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      // Asteroids: irregular polygons, rotated in place, no assets.
      ctx.fillStyle = "#2a2f3a";
      ctx.strokeStyle = "#8b93a7";
      ctx.lineWidth = 2;
      for (const a of asteroids.slots) {
        if (!a.active) continue;
        ctx.beginPath();
        for (let v = 0; v < a.shape.length; v++) {
          const ang = a.rot + (v / a.shape.length) * Math.PI * 2;
          const rr = a.r * a.shape[v];
          const vx = a.x + Math.cos(ang) * rr;
          const vy = a.y + Math.sin(ang) * rr;
          if (v === 0) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Drones: small red arrowheads, rotated in place, no assets.
      ctx.fillStyle = "#2a1016";
      ctx.strokeStyle = "#f87171";
      ctx.lineWidth = 2;
      for (const d of drones.slots) {
        if (!d.active) continue;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.heading);
        ctx.beginPath();
        ctx.moveTo(DRONE_RADIUS, 0);
        ctx.lineTo(-DRONE_RADIUS * 0.7, DRONE_RADIUS * 0.7);
        ctx.lineTo(-DRONE_RADIUS * 0.4, 0);
        ctx.lineTo(-DRONE_RADIUS * 0.7, -DRONE_RADIUS * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // HUD: live score, hull and wave number, top-left.
      ctx.fillStyle = UI_ACCENT;
      ctx.font = `${UI_HUD_PX}px ${UI_FONT}`;
      ctx.textAlign = "left";
      ctx.fillText(`SCORE ${score}`, 16, 28);
      ctx.fillText(`HP ${Math.max(hp, 0)}`, 16, 52);
      ctx.fillText(`WAVE ${wave}`, 16, 76);

      // Game over: static centred overlay on the frozen world.
      if (gameState === "gameover") {
        drawGameOverScreen();
      }
    }

    // ================================================================
    // LOOP — requestAnimationFrame, ~60 fps
    // ================================================================
    let lastTime = 0;
    function frame(time) {
      const dt = lastTime ? Math.min((time - lastTime) / 1000, MAX_FRAME_SECONDS) : 0;
      lastTime = time;
      gameTime += dt;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
