<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Asteroid Horizon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070f;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    "use strict";

    // ================================================================
    // CONFIG — named tuning constants (tweak gameplay here)
    // ================================================================
    // "var" on purpose: these are the runtime tuning knobs — reassigning
    // them from the DevTools console must work (accepted behavior).
    var THRUST = 420;          // px/s^2 applied along the ship's heading
    var FRICTION = 0.90;       // per-frame velocity retention at 60 fps (framerate-independent)
    var TURN_SPEED = 3.6;      // rad/s of rotation while turning
    const BASE_FPS = 60;         // reference rate that FRICTION is defined against
    const STOP_SPEED = 1;        // px/s — below this the ship snaps to stillness
    const MAX_FRAME_SECONDS = 1 / 30; // clamp long frames (tab switches) to avoid teleporting
    const SHIP_RADIUS = 14;      // px, hull size and wrap margin
    var LASER_COOLDOWN_MS = 150; // ms between shots while Space is held
    var LASER_SPEED = 700;        // px/s along the ship's heading
    const LASER_POOL_SIZE = 32;   // pre-allocated laser slots, recycled (never reallocated)
    const LASER_LENGTH = 18;      // px, visual length of the beam
    var ASTEROID_TARGET = 6;      // desired number of live asteroids in the field
    var SCORE_PER_ASTEROID = 10;  // HUD score credited per laser kill
    const SPAWN_SAFE_RADIUS = 200; // px — new asteroids spawn at least this far from the ship
    const ASTEROID_MIN_R = 12;    // px, smallest asteroid radius
    const ASTEROID_MAX_R = 20;    // px, largest asteroid radius
    const ASTEROID_SPEED_MIN = 40;   // px/s, slowest drift
    const ASTEROID_SPEED_MAX = 160;  // px/s, fastest drift
    const ASTEROID_SPAWN_EVERY = 0.25; // s between respawn attempts while below target
    const ASTEROID_MAX_SPAWNS = 8;   // spawn attempts per frame (bounds the rejection loop)
    const ASTEROID_MIN_GAP = 40;     // px, extra spacing between live asteroids
    const ASTEROID_VERTS = 8;        // points per irregular polygon outline
    const ASTEROID_POOL_SIZE = 48;   // pre-allocated asteroid slots, recycled (never reallocated)
    var DRONE_TARGET = 3;            // desired number of live drones in the field; 0 disables them
    var SCORE_PER_DRONE = 25;        // HUD score credited per laser kill
    const DRONE_RADIUS = 10;         // px, drone hull size
    var DRONE_SPEED = 120;           // px/s, constant forward speed
    const DRONE_TURN_SPEED = 2.4;    // rad/s, max heading change while tracking the ship
    const DRONE_SPAWN_EVERY = 0.35;  // s between respawn attempts while below target
    const DRONE_MAX_SPAWNS = 4;      // spawn attempts per frame (bounds the rejection loop)
    const DRONE_POOL_SIZE = 24;      // pre-allocated drone slots, recycled (never reallocated)
    var PLAYER_MAX_HP = 3;           // starting hull points (shown as "HP n" in the HUD)
    var INVULN_MS = 1500;            // ms of invulnerability after taking a hit
    const PARTICLES_PER_BURST = 16;  // particles per impact burst (ticket requires >= 10)
    const PARTICLE_LIFE_S = 0.7;     // s a particle lives before recycling
    const PARTICLE_SPEED_MIN = 60;   // px/s, slowest burst fragment
    const PARTICLE_SPEED_MAX = 260;  // px/s, fastest burst fragment
    const PARTICLE_POOL_SIZE = 128;  // pre-allocated particle slots, recycled (never reallocated)

    // ================================================================
    // STATE
    // ================================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const ship = {
      x: 0,
      y: 0,
      heading: -Math.PI / 2, // pointing up
      vx: 0,
      vy: 0,
    };
    const keys = new Set();
    let gameTime = 0; // seconds of accumulated simulation time
    let score = 0;    // HUD score, one SCORE_PER_ASTEROID per laser kill
    let hp = PLAYER_MAX_HP;          // current hull; one impact costs exactly 1
    let shipDead = false;            // hp reached 0: ship removed, all input ignored
    let invulnUntil = Number.NEGATIVE_INFINITY; // sim time until which a hit costs nothing
    // Random source lives in a mutable `var` so unit tests (and console
    // experiments) can install a deterministic sequence; the game itself
    // only ever CALLS it, never reassigns it.
    var random = Math.random;

    // Pre-allocated laser pool: every shot mutates an existing slot in
    // place, so sustained fire never creates new objects.
    const laserPool = { slots: [] };
    for (let i = 0; i < LASER_POOL_SIZE; i++) {
      laserPool.slots.push({ active: false, x: 0, y: 0, dx: 0, dy: 0, dt: 0 });
    }

    // Pre-allocated asteroid pool: every rock mutates an existing slot in
    // place (including its polygon outline), so spawning never allocates.
    // `entry` is the edge this rock is still drifting in from (0 top, 1
    // bottom, 2 left, 3 right); -1 once its centre is inside the field.
    // Wrap-around is suspended on that axis until then, so the fully
    // off-screen spawn offset can never trigger an instant teleport.
    // Pre-allocated particle pool: impact bursts mutate existing slots
    // in place, so rapid-fire combat never creates new objects.
    const particlePool = { slots: [] };
    for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
      particlePool.slots.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0 });
    }

    const asteroids = { slots: [] };
    for (let i = 0; i < ASTEROID_POOL_SIZE; i++) {
      asteroids.slots.push({
        active: false,
        x: 0,
        y: 0,
        r: ASTEROID_MIN_R,
        vx: 0,
        vy: 0,
        rot: 0,
        spin: 0,
        entry: -1,
        shape: [], // radial offsets in [0.75, 1], reused for every outline
      });
    }

    // Pre-allocated drone pool: every drone mutates an existing slot in
    // place, so spawning never allocates.
    const drones = { slots: [] };
    for (let i = 0; i < DRONE_POOL_SIZE; i++) {
      drones.slots.push({ active: false, x: 0, y: 0, heading: 0 });
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);
    ship.x = canvas.width / 2;
    ship.y = canvas.height / 2;

    // ================================================================
    // INPUT — arrow keys and WASD both handled
    // ================================================================
    const KEY_CODES = ["ArrowUp", "KeyW", "ArrowLeft", "KeyA", "ArrowRight", "KeyD", "Space"];

    window.addEventListener("keydown", (e) => {
      if (!KEY_CODES.includes(e.code)) return;
      e.preventDefault();
      keys.add(e.code);
    });
    window.addEventListener("keyup", (e) => {
      keys.delete(e.code);
    });

    // ================================================================
    // FIRING — Space releases one laser from the nose, cooldown-gated
    // ================================================================
    let lastFireAt = Number.NEGATIVE_INFINITY; // permits an instant first shot

    function tryFire() {
      if (!keys.has("Space")) return;
      if (gameTime - lastFireAt < LASER_COOLDOWN_MS / 1000) return;
      const slot = laserPool.slots.find((s) => !s.active);
      if (!slot) return; // pool exhausted — wait for a free slot, never allocate
      const dx = Math.cos(ship.heading);
      const dy = Math.sin(ship.heading);
      const nose = SHIP_RADIUS + LASER_LENGTH / 2; // spawn the beam just past the tip
      slot.active = true;
      slot.x = ship.x + dx * nose;
      slot.y = ship.y + dy * nose;
      slot.dx = dx;
      slot.dy = dy;
      lastFireAt = gameTime;
    }

    function updateLasers(dt) {
      const w = canvas.width;
      const h = canvas.height;
      const m = LASER_LENGTH; // recycle only once fully off-screen
      for (let i = 0; i < laserPool.slots.length; i++) {
        const s = laserPool.slots[i];
        if (!s.active) continue;
        s.x += s.dx * LASER_SPEED * dt;
        s.y += s.dy * LASER_SPEED * dt;
        s.dt = dt; // last step, so hit tests can reconstruct the sweep segment
        if (s.x < -m || s.x > w + m || s.y < -m || s.y > h + m) s.active = false;
      }
    }

    // ================================================================
    // ASTEROIDS — pooled rocks that spawn at the edges, drift and
    // wrap; lasers destroy them for SCORE_PER_ASTEROID each
    // ================================================================
    // Pick one candidate at a random point just outside a random
    // edge, drifting back into the field (aimed at the centre with a
    // ±60° jitter, re-aimed if the jitter points it back out). Rejected
    // outright if it would start closer than SPAWN_SAFE_RADIUS to the
    // ship, or sit on top of a live rock.
    function spawnAsteroid() {
      const w = canvas.width;
      const h = canvas.height;
      const slot = asteroids.slots.find((a) => !a.active);
      if (!slot) return false; // pool exhausted — skip the spawn, never allocate

      for (let attempt = 0; attempt < ASTEROID_MAX_SPAWNS; attempt++) {
        const u = random(); // which edge: ¼ of the roll per side (0 top, 1 bottom, 2 left, 3 right)
        const edge = u < 0.25 ? 0 : u < 0.5 ? 1 : u < 0.75 ? 2 : 3;
        const r = ASTEROID_MIN_R + (ASTEROID_MAX_R - ASTEROID_MIN_R) * random();
        let x;
        let y;
        if (edge === 0) {       // top
          x = random() * w;
          y = -(r + 1);
        } else if (edge === 1) { // bottom
          x = random() * w;
          y = h + r + 1;
        } else if (edge === 2) { // left
          x = -(r + 1);
          y = random() * h;
        } else {                 // right
          x = w + r + 1;
          y = random() * h;
        }

        let ok = true;
        const ds = Math.hypot(x - ship.x, y - ship.y);
        if (ds < SPAWN_SAFE_RADIUS) ok = false;
        if (ok) {
          for (const other of asteroids.slots) {
            if (other.active && Math.hypot(x - other.x, y - other.y) < r + other.r + ASTEROID_MIN_GAP) {
              ok = false;
              break;
            }
          }
        }
        if (!ok) continue; // retry from a fresh candidate

        // Irregular outline: regenerate in place (no per-spawn allocation).
        slot.shape.length = ASTEROID_VERTS;
        for (let v = 0; v < ASTEROID_VERTS; v++) slot.shape[v] = 0.75 + 0.25 * random();

        // Drift toward the centre with a ±60° jitter, at a random pace.
        const toCentre = Math.atan2(h / 2 - y, w / 2 - x);
        const heading = toCentre + (random() - 0.5) * ((2 * Math.PI) / 3);
        const speed = ASTEROID_SPEED_MIN + (ASTEROID_SPEED_MAX - ASTEROID_SPEED_MIN) * random();
        slot.vx = Math.cos(heading) * speed;
        slot.vy = Math.sin(heading) * speed;
        // Near a corner the jitter can point the rock back out of the
        // field along the spawn edge; mirror the outward component so
        // every rock is guaranteed to drift in (entry suppression below
        // relies on this).
        if (edge === 0 && slot.vy <= 0) slot.vy = -slot.vy;
        else if (edge === 1 && slot.vy >= 0) slot.vy = -slot.vy;
        else if (edge === 2 && slot.vx <= 0) slot.vx = -slot.vx;
        else if (edge === 3 && slot.vx >= 0) slot.vx = -slot.vx;

        slot.active = true;
        slot.x = x;
        slot.y = y;
        slot.r = r;
        slot.entry = edge;
        slot.rot = random() * Math.PI * 2;
        slot.spin = (random() - 0.5) * 0.8; // slow, varied tumble (rad/s)
        return true;
      }
      return false; // field too crowded near the ship to be safe — try again later
    }

    let lastSpawnAt = Number.NEGATIVE_INFINITY; // sim time of the last spawn attempt

    function spawnAsteroids() {
      if (gameTime - lastSpawnAt < ASTEROID_SPAWN_EVERY) return;
      lastSpawnAt = gameTime;
      let count = 0;
      for (const a of asteroids.slots) if (a.active) count++;
      let budget = ASTEROID_MAX_SPAWNS;
      while (count < ASTEROID_TARGET && budget-- > 0) {
        if (spawnAsteroid()) count++;
        else break;
      }
    }

    function updateAsteroids(dt) {
      const w = canvas.width;
      const h = canvas.height;
      for (const a of asteroids.slots) {
        if (!a.active) continue;
        a.x += a.vx * dt;
        a.y += a.vy * dt;
        a.rot += a.spin * dt;
        // A rock still drifting in from its spawn edge keeps that
        // axis's wrap suspended until its centre crosses the edge
        // (its inward velocity is guaranteed at spawn, so this
        // always happens). Normal wrap resumes once it is inside.
        if (a.entry === 0 && a.y > 0) a.entry = -1;
        else if (a.entry === 1 && a.y < h) a.entry = -1;
        else if (a.entry === 2 && a.x > 0) a.entry = -1;
        else if (a.entry === 3 && a.x < w) a.entry = -1;
        // Screen wrap: fully off one edge, re-enter the opposite one.
        if (a.entry !== 2 && a.entry !== 3 && a.x < -a.r) a.x += w + 2 * a.r;
        else if (a.entry !== 2 && a.entry !== 3 && a.x > w + a.r) a.x -= w + 2 * a.r;
        if (a.entry !== 0 && a.entry !== 1 && a.y < -a.r) a.y += h + 2 * a.r;
        else if (a.entry !== 0 && a.entry !== 1 && a.y > h + a.r) a.y -= h + 2 * a.r;
      }
    }

    // Shortest distance from point P to segment AB — sweeping segment
    // test so a fast beam can never tunnel through a rock in one frame.
    function segPointDistance(ax, ay, bx, by, px, py) {
      const abx = bx - ax;
      const aby = by - ay;
      const len2 = abx * abx + aby * aby;
      let t = len2 === 0 ? 0 : ((px - ax) * abx + (py - ay) * aby) / len2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (ax + abx * t), py - (ay + aby * t));
    }

    function checkLaserKills() {
      const slots = laserPool.slots;
      const rocks = asteroids.slots;
      const chasers = drones.slots;
      for (let li = 0; li < slots.length; li++) {
        const s = slots[li];
        if (!s.active) continue;
        const px = s.x - s.dx * LASER_SPEED * s.dt; // previous frame's position
        const py = s.y - s.dy * LASER_SPEED * s.dt;
        for (let ai = 0; ai < rocks.length; ai++) {
          const a = rocks[ai];
          if (!a.active) continue;
          if (segPointDistance(px, py, s.x, s.y, a.x, a.y) <= a.r) {
            a.active = false; // destroyed: removed from the field
            score += SCORE_PER_ASTEROID;
          }
        }
        for (let di = 0; di < chasers.length; di++) {
          const d = chasers[di];
          if (!d.active) continue;
          if (segPointDistance(px, py, s.x, s.y, d.x, d.y) <= DRONE_RADIUS) {
            d.active = false; // destroyed: removed from the field
            score += SCORE_PER_DRONE;
            burst(d.x, d.y); // shared impact burst, same pool as hull hits
          }
        }
      }
    }

    // ================================================================
    // SHIP DAMAGE — hull overlaps cost 1 hp, shatter the rock, burst
    // particles; the ship is immune for INVULN_MS after every hit
    // ================================================================
    function burst(x, y) {
      // Fill up to PARTICLES_PER_BURST inactive slots; if the pool is
      // exhausted the burst is capped, never allocated.
      let spawned = 0;
      for (const p of particlePool.slots) {
        if (spawned >= PARTICLES_PER_BURST) break;
        if (p.active) continue;
        const ang = random() * Math.PI * 2;
        const speed = PARTICLE_SPEED_MIN + (PARTICLE_SPEED_MAX - PARTICLE_SPEED_MIN) * random();
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(ang) * speed;
        p.vy = Math.sin(ang) * speed;
        p.age = 0;
        spawned++;
      }
    }

    function updateParticles(dt) {
      for (const p of particlePool.slots) {
        if (!p.active) continue;
        p.age += dt;
        if (p.age >= PARTICLE_LIFE_S) {
          p.active = false; // recycled
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }

    function checkShipHits() {
      if (shipDead) return;
      if (gameTime < invulnUntil) return; // immune: ignore every hazard
      // Rocks first, then drones; one damage event per frame, even if
      // several hazards overlap. Each impact destroys its hazard.
      for (const a of asteroids.slots) {
        if (!a.active) continue;
        if (Math.hypot(a.x - ship.x, a.y - ship.y) > a.r + SHIP_RADIUS) continue;
        a.active = false; // the impact shatters the rock
        burst((ship.x + a.x) / 2, (ship.y + a.y) / 2); // mid-point of the overlap
        hp -= 1;
        if (hp <= 0) shipDead = true;
        else invulnUntil = gameTime + INVULN_MS / 1000;
        return; // one impact per frame, even if several rocks overlap
      }
      for (const d of drones.slots) {
        if (!d.active) continue;
        if (Math.hypot(d.x - ship.x, d.y - ship.y) > DRONE_RADIUS + SHIP_RADIUS) continue;
        d.active = false; // the impact destroys the drone
        burst((ship.x + d.x) / 2, (ship.y + d.y) / 2); // mid-point of the overlap
        hp -= 1;
        if (hp <= 0) shipDead = true;
        else invulnUntil = gameTime + INVULN_MS / 1000;
        return;
      }
    }

    // ================================================================
    // DRONES — pooled chasers that spawn at the edges and turn their
    // heading toward the ship each frame at a bounded turn rate
    // ================================================================
    // Pick one candidate just outside a random edge, born facing the
    // ship. Rejected outright if it would start closer than
    // SPAWN_SAFE_RADIUS to the ship.
    function spawnDrone() {
      const w = canvas.width;
      const h = canvas.height;
      const slot = drones.slots.find((d) => !d.active);
      if (!slot) return false; // pool exhausted — skip the spawn, never allocate
      const r = DRONE_RADIUS;

      for (let attempt = 0; attempt < DRONE_MAX_SPAWNS; attempt++) {
        const u = random(); // which edge: ¼ of the roll per side (0 top, 1 bottom, 2 left, 3 right)
        const edge = u < 0.25 ? 0 : u < 0.5 ? 1 : u < 0.75 ? 2 : 3;
        let x;
        let y;
        if (edge === 0) {       // top
          x = random() * w;
          y = -(r + 1);
        } else if (edge === 1) { // bottom
          x = random() * w;
          y = h + r + 1;
        } else if (edge === 2) { // left
          x = -(r + 1);
          y = random() * h;
        } else {                 // right
          x = w + r + 1;
          y = random() * h;
        }

        const ds = Math.hypot(x - ship.x, y - ship.y);
        if (ds < SPAWN_SAFE_RADIUS) continue; // retry from a fresh candidate

        slot.active = true;
        slot.x = x;
        slot.y = y;
        slot.heading = Math.atan2(ship.y - y, ship.x - x); // born aiming at the ship
        return true;
      }
      return false; // field too crowded near the ship to be safe — try again later
    }

    let lastDroneSpawnAt = Number.NEGATIVE_INFINITY; // sim time of the last spawn attempt

    function spawnDrones() {
      if (gameTime - lastDroneSpawnAt < DRONE_SPAWN_EVERY) return;
      lastDroneSpawnAt = gameTime;
      let count = 0;
      for (const d of drones.slots) if (d.active) count++;
      let budget = DRONE_MAX_SPAWNS;
      while (count < DRONE_TARGET && budget-- > 0) {
        if (spawnDrone()) count++;
        else break;
      }
    }

    function updateDrones(dt) {
      const limit = DRONE_TURN_SPEED * dt; // bounded turn: steer, never teleport
      for (const d of drones.slots) {
        if (!d.active) continue;
        const desired = Math.atan2(ship.y - d.y, ship.x - d.x);
        const err = Math.atan2(Math.sin(desired - d.heading), Math.cos(desired - d.heading));
        d.heading += Math.max(-limit, Math.min(limit, err));
        d.x += Math.cos(d.heading) * DRONE_SPEED * dt;
        d.y += Math.sin(d.heading) * DRONE_SPEED * dt;
      }
    }

    // ================================================================
    // UPDATE — physics with delta-time integration
    // ================================================================
    function update(dt) {
      // Advance the impact fragments regardless of ship state.
      updateParticles(dt);

      // A dead ship is inert: no physics, no firing, no further damage.
      if (!shipDead) {
        // Rotate: left or right (A/D or arrow keys).
        const turn =
          (keys.has("ArrowRight") || keys.has("KeyD") ? 1 : 0) -
          (keys.has("ArrowLeft") || keys.has("KeyA") ? 1 : 0);
        ship.heading += turn * TURN_SPEED * dt;

        // Thrust: up or W accelerates along the current heading.
        if (keys.has("ArrowUp") || keys.has("KeyW")) {
          ship.vx += Math.cos(ship.heading) * THRUST * dt;
          ship.vy += Math.sin(ship.heading) * THRUST * dt;
        }

        // Friction: decay velocity, framerate-independently; snap to rest.
        const retention = Math.pow(FRICTION, dt * BASE_FPS);
        ship.vx *= retention;
        ship.vy *= retention;
        if (ship.vx * ship.vx + ship.vy * ship.vy < STOP_SPEED * STOP_SPEED) {
          ship.vx = 0;
          ship.vy = 0;
        }

        // Integrate position.
        ship.x += ship.vx * dt;
        ship.y += ship.vy * dt;

        // Screen wrap: exiting any edge re-enters at the opposite edge
        // this same frame.
        const w = canvas.width;
        const h = canvas.height;
        if (ship.x < -SHIP_RADIUS) ship.x += w + 2 * SHIP_RADIUS;
        else if (ship.x > w + SHIP_RADIUS) ship.x -= w + 2 * SHIP_RADIUS;
        if (ship.y < -SHIP_RADIUS) ship.y += h + 2 * SHIP_RADIUS;
        else if (ship.y > h + SHIP_RADIUS) ship.y -= h + 2 * SHIP_RADIUS;

        // Fire, then test the hull against the field.
        tryFire();
        checkShipHits();
      }

      updateLasers(dt);
      checkLaserKills();

      // Drift the rocks, then top the field back up to ASTEROID_TARGET.
      updateAsteroids(dt);
      spawnAsteroids();

      // Steer the chasers, then top their field back up to DRONE_TARGET.
      updateDrones(dt);
      spawnDrones();
    }

    // ================================================================
    // RENDER
    // ================================================================
    function render() {
      ctx.fillStyle = "#05070f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ship: hidden once destroyed; blinks while invulnerable.
      if (!shipDead) {
        ctx.save();
        if (gameTime < invulnUntil && Math.floor(gameTime * 12) % 2 === 0) {
          ctx.globalAlpha = 0.3;
        }
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.heading);
        ctx.beginPath();
        ctx.moveTo(SHIP_RADIUS, 0);
        ctx.lineTo(-SHIP_RADIUS * 0.7, SHIP_RADIUS * 0.6);
        ctx.lineTo(-SHIP_RADIUS * 0.4, 0);
        ctx.lineTo(-SHIP_RADIUS * 0.7, -SHIP_RADIUS * 0.6);
        ctx.closePath();
        ctx.fillStyle = "#101826";
        ctx.fill();
        ctx.strokeStyle = "#5eead4";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore(); // also restores globalAlpha
      }

      // Lasers: one batched path so a full pool costs a single stroke.
      ctx.strokeStyle = "#5eead4";
      ctx.lineWidth = 2;
      ctx.beginPath();
      const half = LASER_LENGTH / 2;
      for (let i = 0; i < laserPool.slots.length; i++) {
        const s = laserPool.slots[i];
        if (!s.active) continue;
        ctx.moveTo(s.x - s.dx * half, s.y - s.dy * half);
        ctx.lineTo(s.x + s.dx * half, s.y + s.dy * half);
      }
      ctx.stroke();

      // Particles: 4 px amber fragments fading over their short life.
      ctx.fillStyle = "#fbbf24";
      for (const p of particlePool.slots) {
        if (!p.active) continue;
        ctx.globalAlpha = 1 - p.age / PARTICLE_LIFE_S;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      // Asteroids: irregular polygons, rotated in place, no assets.
      ctx.fillStyle = "#2a2f3a";
      ctx.strokeStyle = "#8b93a7";
      ctx.lineWidth = 2;
      for (const a of asteroids.slots) {
        if (!a.active) continue;
        ctx.beginPath();
        for (let v = 0; v < a.shape.length; v++) {
          const ang = a.rot + (v / a.shape.length) * Math.PI * 2;
          const rr = a.r * a.shape[v];
          const vx = a.x + Math.cos(ang) * rr;
          const vy = a.y + Math.sin(ang) * rr;
          if (v === 0) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Drones: small red arrowheads, rotated in place, no assets.
      ctx.fillStyle = "#2a1016";
      ctx.strokeStyle = "#f87171";
      ctx.lineWidth = 2;
      for (const d of drones.slots) {
        if (!d.active) continue;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.heading);
        ctx.beginPath();
        ctx.moveTo(DRONE_RADIUS, 0);
        ctx.lineTo(-DRONE_RADIUS * 0.7, DRONE_RADIUS * 0.7);
        ctx.lineTo(-DRONE_RADIUS * 0.4, 0);
        ctx.lineTo(-DRONE_RADIUS * 0.7, -DRONE_RADIUS * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // HUD: live score and hull, top-left.
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "16px monospace";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE ${score}`, 16, 28);
      ctx.fillText(`HP ${Math.max(hp, 0)}`, 16, 52);

      // Game over: static centred text (screen styling lands in the
      // state-machine ticket).
      if (shipDead) {
        ctx.font = "48px monospace";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
        ctx.textAlign = "left";
      }
    }

    // ================================================================
    // LOOP — requestAnimationFrame, ~60 fps
    // ================================================================
    let lastTime = 0;
    function frame(time) {
      const dt = lastTime ? Math.min((time - lastTime) / 1000, MAX_FRAME_SECONDS) : 0;
      lastTime = time;
      gameTime += dt;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
