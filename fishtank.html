<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Tank</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #06121e; }
#game { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- One-shot hub back link: static markup only, no JS (the vm suites
     boot this file — anything queried at boot needs a stub, so keep
     it inert, matching the other cabinets). -->
<style>
  #hub-back { position: fixed; right: 10px; bottom: 10px; z-index: 10; font: 10px/1 monospace; letter-spacing: .15em; color: #5a6b7d; text-decoration: none; padding: 4px 7px; border: 1px solid #1c2430; border-radius: 6px; background: rgba(5, 7, 15, .72); }
  #hub-back:hover { color: #e8f2fb; border-color: #5a6b7d; }
</style>
<a id="hub-back" href="index.html">&larr; ONE-SHOT</a>
<script>
"use strict";
(() => {
  // src/sim/constants.ts
  var FIXED_DT = 1 / 60;
  var TANK_WIDTH = 1600;
  var TANK_HEIGHT = 1e3;
  var MAX_FRAME_DELTA = 0.25;
  var TETRA_COUNT = 80;
  var STARTLE_RADIUS = 140;
  var STARTLE_IMPULSE = 200;
  var TETRA_MIN_SPEED = 30;
  var TETRA_MAX_SPEED = 220;
  var PREDATOR_PATROL_SPEED = 340;
  var PREDATOR_STALK_SPEED = 380;
  var PREDATOR_REST_SPEED = 30;
  var PREDATOR_HUNGER_RATE = 0.06;
  var PREDATOR_STALK_THRESHOLD = 0.7;
  var PREDATOR_SIGHT_RANGE = 400;
  var PREDATOR_ISOLATION_RADIUS = 160;
  var PREDATOR_CAPTURE_RADIUS = 28;
  var PREDATOR_REST_STEPS = 240;
  var PREDATOR_WAYPOINT_TOLERANCE = 48;

  // src/sim/rng.ts
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // src/sim/tail.ts
  var TAIL_FREQ_SPEED_GAIN = 0.04;
  var TAIL_FREQ_TORQUE_GAIN = 0.25;
  function tailFrequency(speed, torque) {
    return TAIL_FREQ_SPEED_GAIN * Math.abs(speed) + TAIL_FREQ_TORQUE_GAIN * Math.abs(torque);
  }

  // src/sim/steering.ts
  var MAX_STEERING_FORCE = 120;
  var MAX_SEPARATION_FORCE = 90;
  var MAX_ALIGNMENT_FORCE = 1;
  var MAX_COHESION_FORCE = 60;
  var MAX_BOUNDARY_AVOIDANCE_FORCE = MAX_STEERING_FORCE;
  var NEIGHBOUR_RADIUS = 64;
  var COHESION_GAIN = 0.35;
  var BOUNDARY_MARGIN = 120;
  var FISH_MAX_SPEED = 80;
  function zero() {
    return { x: 0, y: 0 };
  }
  function clampLength(v, maxLength) {
    const len = Math.hypot(v.x, v.y);
    if (len === 0) return v;
    if (len <= maxLength) return v;
    const s = maxLength / len;
    return { x: v.x * s, y: v.y * s };
  }
  function unit(x, y) {
    const len = Math.hypot(x, y);
    return len === 0 ? zero() : { x: x / len, y: y / len };
  }
  function separation(self, neighbours) {
    const sum = zero();
    const r2 = NEIGHBOUR_RADIUS * NEIGHBOUR_RADIUS;
    for (const n of neighbours) {
      const dx = self.x - n.x;
      const dy = self.y - n.y;
      const d2 = dx * dx + dy * dy;
      if (d2 === 0 || d2 > r2) continue;
      sum.x += dx / d2;
      sum.y += dy / d2;
    }
    return clampLength(sum, MAX_SEPARATION_FORCE);
  }
  function alignment(neighbours) {
    const sum = zero();
    let votes = 0;
    for (const n of neighbours) {
      const h = unit(n.vx, n.vy);
      if (h.x === 0 && h.y === 0) continue;
      sum.x += h.x;
      sum.y += h.y;
      votes += 1;
    }
    if (votes === 0) return zero();
    return clampLength({ x: sum.x / votes, y: sum.y / votes }, MAX_ALIGNMENT_FORCE);
  }
  function cohesion(self, neighbours) {
    if (neighbours.length === 0) return zero();
    let cx = 0;
    let cy = 0;
    for (const n of neighbours) {
      cx += n.x;
      cy += n.y;
    }
    const toCentroid = { x: cx / neighbours.length - self.x, y: cy / neighbours.length - self.y };
    return clampLength(
      { x: toCentroid.x * COHESION_GAIN, y: toCentroid.y * COHESION_GAIN },
      MAX_COHESION_FORCE
    );
  }
  function boundaryAvoidance(pos, width, height) {
    const f = zero();
    if (pos.x < BOUNDARY_MARGIN) f.x += (BOUNDARY_MARGIN - pos.x) / BOUNDARY_MARGIN * MAX_BOUNDARY_AVOIDANCE_FORCE;
    if (pos.x > width - BOUNDARY_MARGIN) f.x -= (pos.x - (width - BOUNDARY_MARGIN)) / BOUNDARY_MARGIN * MAX_BOUNDARY_AVOIDANCE_FORCE;
    if (pos.y < BOUNDARY_MARGIN) f.y += (BOUNDARY_MARGIN - pos.y) / BOUNDARY_MARGIN * MAX_BOUNDARY_AVOIDANCE_FORCE;
    if (pos.y > height - BOUNDARY_MARGIN) f.y -= (pos.y - (height - BOUNDARY_MARGIN)) / BOUNDARY_MARGIN * MAX_BOUNDARY_AVOIDANCE_FORCE;
    return clampLength(f, MAX_BOUNDARY_AVOIDANCE_FORCE);
  }

  // src/sim/spatialGrid.ts
  var SpatialGrid = class {
    cellSize;
    cols;
    rows;
    cells;
    /** Cell index per inserted item: makes update()/remove() O(1)
     *  lookups without scanning cells. */
    indexOf = /* @__PURE__ */ new Map();
    constructor(width, height, cellSize) {
      if (!(cellSize > 0)) throw new RangeError("SpatialGrid: cellSize must be positive");
      this.cellSize = cellSize;
      this.cols = Math.max(1, Math.ceil(width / cellSize));
      this.rows = Math.max(1, Math.ceil(height / cellSize));
      this.cells = Array.from({ length: this.cols * this.rows }, () => []);
    }
    /** Drop every item (cell arrays themselves are reused: no
     *  per-step allocation). */
    clear() {
      for (const cell of this.cells) cell.length = 0;
      this.indexOf.clear();
    }
    /** Place an item in the cell holding its current position.
     *  Re-inserting a present item moves it (idempotent count: an
     *  item never occupies two cells). The old-cell eviction splices
     *  ONLY at the item's verified own slot — if the bookkeeping ever
     *  goes stale the item is simply absent and nothing is removed:
     *  an implicit splice position (splice(-1)) would evict an
     *  innocent neighbour. */
    insert(item) {
      const cellIndex = this.indexOf.get(item);
      if (cellIndex !== void 0) {
        const cell = this.cells[cellIndex];
        const at = cell.indexOf(item);
        if (at >= 0) cell.splice(at, 1);
      }
      const index = this.rowOf(item.y) * this.cols + this.colOf(item.x);
      this.cells[index].push(item);
      this.indexOf.set(item, index);
    }
    /** Express intent at the call site that an already-inserted item
     *  moved. A plain alias of insert() — identical behaviour, no
     *  performance difference (an untracked item is simply put in);
     *  it exists so callers read "it moved", not "re-inserted it". */
    update(item) {
      this.insert(item);
    }
    /** Remove an item. Returns true if it was present. Removing an
     *  absent item is a pure no-op: it splices nothing, so a healthy
     *  neighbour (even the last occupant of the same cell) can never
     *  be disturbed. */
    remove(item) {
      const cellIndex = this.indexOf.get(item);
      if (cellIndex === void 0) return false;
      const cell = this.cells[cellIndex];
      const at = cell.indexOf(item);
      if (at >= 0) cell.splice(at, 1);
      this.indexOf.delete(item);
      return true;
    }
    /** All items within Euclidean distance <= radius of (x, y), as a
     *  fresh array (callers own it). Exact set semantics: the probe
     *  visits precisely the cells the closed ball overlaps and then
     *  filters by squared distance, so the result matches brute-force
     *  distance filtering over the same items bit-for-bit. */
    query(x, y, radius) {
      const found = [];
      const r2 = radius * radius;
      const c0 = this.colOf(x - radius);
      const c1 = this.colOf(x + radius);
      const r0 = this.rowOf(y - radius);
      const r1 = this.rowOf(y + radius);
      for (let row = r0; row <= r1; row++) {
        for (let col = c0; col <= c1; col++) {
          const cell = this.cells[row * this.cols + col];
          for (const item of cell) {
            const dx = item.x - x;
            const dy = item.y - y;
            if (dx * dx + dy * dy <= r2) found.push(item);
          }
        }
      }
      return found;
    }
    colOf(x) {
      return Math.min(this.cols - 1, Math.max(0, Math.floor(x / this.cellSize)));
    }
    rowOf(y) {
      return Math.min(this.rows - 1, Math.max(0, Math.floor(y / this.cellSize)));
    }
  };

  // src/sim/predator.ts
  var PREDATOR_PATROL_ROUTE = [
    { name: "north-west", x: 400, y: 300 },
    { name: "north-east", x: 1200, y: 300 },
    { name: "south-east", x: 1200, y: 700 },
    { name: "south-west", x: 400, y: 700 }
  ];
  var PREDATOR_SPAWN_X = 100;
  var PREDATOR_SPAWN_Y = 500;
  var ApexPredator = class {
    x = PREDATOR_SPAWN_X;
    y = PREDATOR_SPAWN_Y;
    /** Velocity (direction AND speed) in tank units/s — direct
     *  kinematics: the step re-sets this from the state every time. */
    vx;
    vy;
    state = "patrol";
    /** Hunger in [0, 1]: rises at PREDATOR_HUNGER_RATE (even during
     *  rest), resets to 0 on a feed. */
    hunger = 0;
    /** Index into PREDATOR_PATROL_ROUTE of the stop currently being
     *  sought; advances on each arrival (cyclically). */
    waypointIndex = 0;
    /** The locked prey (a live reference into world.agents) or null.
     *  A non-null lock is always live: the only removal path is a
     *  capture, which nulls the lock in the same step. */
    prey = null;
    /** Rest steps remaining: armed to PREDATOR_REST_STEPS on a feed,
     *  counts down during rest, hits 0 at the boundary step. */
    restRemaining = 0;
    /** How many tetras this predator has eaten (telemetry). */
    fedCount = 0;
    constructor() {
      const wp = PREDATOR_PATROL_ROUTE[0];
      const dx = wp.x - this.x;
      const dy = wp.y - this.y;
      const d = Math.hypot(dx, dy);
      this.vx = d > 0 ? dx / d * PREDATOR_PATROL_SPEED : PREDATOR_PATROL_SPEED;
      this.vy = d > 0 ? dy / d * PREDATOR_PATROL_SPEED : 0;
    }
    /** Advance the predator by exactly dt seconds against the world.
     *  Called by World.step AFTER the tetras have moved, so prey
     *  positions are current (the neighbor grid is rebuilt at the
     *  start of each step — the same one-step-stale view the tetras'
     *  own steering uses). May mutate world.agents: a capture splices
     *  the victim out. */
    step(dt, world) {
      this.hunger = Math.min(1, this.hunger + PREDATOR_HUNGER_RATE * dt);
      let dirX;
      let dirY;
      let speed;
      let drifting = false;
      if (this.state === "rest") {
        this.restRemaining -= 1;
        if (this.restRemaining <= 0) {
          this.state = "patrol";
        } else {
          drifting = true;
        }
      }
      if (drifting) {
        const m = Math.hypot(this.vx, this.vy);
        dirX = m > 0 ? this.vx / m : 1;
        dirY = m > 0 ? this.vy / m : 0;
        speed = PREDATOR_REST_SPEED;
      } else {
        if (this.state === "patrol" && this.hunger >= PREDATOR_STALK_THRESHOLD) {
          const target = this.findPrey(world);
          if (target) {
            this.state = "stalk";
            this.prey = target;
          }
        }
        let prey = this.state === "stalk" ? this.prey : null;
        if (prey && !this.isIsolated(prey, world)) {
          this.prey = null;
          prey = null;
        }
        if (prey) {
          const dx = prey.x - this.x;
          const dy = prey.y - this.y;
          const d = Math.hypot(dx, dy);
          dirX = d > 0 ? dx / d : 1;
          dirY = d > 0 ? dy / d : 0;
          speed = PREDATOR_STALK_SPEED;
        } else {
          this.prey = null;
          this.state = "patrol";
          let i = this.waypointIndex;
          const wp = PREDATOR_PATROL_ROUTE[i];
          if (Math.hypot(wp.x - this.x, wp.y - this.y) <= PREDATOR_WAYPOINT_TOLERANCE) {
            i = (i + 1) % PREDATOR_PATROL_ROUTE.length;
            this.waypointIndex = i;
          }
          const next = PREDATOR_PATROL_ROUTE[i];
          const dx = next.x - this.x;
          const dy = next.y - this.y;
          const d = Math.hypot(dx, dy);
          dirX = d > 0 ? dx / d : 1;
          dirY = d > 0 ? dy / d : 0;
          speed = PREDATOR_PATROL_SPEED;
        }
      }
      const victim = this.state === "stalk" ? this.prey : null;
      if (victim && Math.hypot(victim.x - this.x, victim.y - this.y) <= PREDATOR_CAPTURE_RADIUS) {
        const at = world.agents.indexOf(victim);
        if (at >= 0) world.agents.splice(at, 1);
        this.prey = null;
        this.hunger = 0;
        this.fedCount += 1;
        this.state = "rest";
        this.restRemaining = PREDATOR_REST_STEPS;
        speed = PREDATOR_REST_SPEED;
      }
      this.vx = dirX * speed;
      this.vy = dirY * speed;
      let x = this.x + this.vx * dt;
      let y = this.y + this.vy * dt;
      if (x < 0) {
        x = -x;
        this.vx = -this.vx;
      } else if (x > TANK_WIDTH) {
        x = 2 * TANK_WIDTH - x;
        this.vx = -this.vx;
      }
      if (y < 0) {
        y = -y;
        this.vy = -this.vy;
      } else if (y > TANK_HEIGHT) {
        y = 2 * TANK_HEIGHT - y;
        this.vy = -this.vy;
      }
      if (x < 0) x = 0;
      else if (x > TANK_WIDTH) x = TANK_WIDTH;
      if (y < 0) y = 0;
      else if (y > TANK_HEIGHT) y = TANK_HEIGHT;
      this.x = x;
      this.y = y;
    }
    /** The nearest ISOLATED tetra within PREDATOR_SIGHT_RANGE, or
     *  null: fixed agents order with a strict best-distance scan, so
     *  the choice is deterministic (ties keep the earliest swimmer). */
    findPrey(world) {
      let best = null;
      let bestDist = PREDATOR_SIGHT_RANGE;
      for (const t of world.agents) {
        const d = Math.hypot(t.x - this.x, t.y - this.y);
        if (d >= bestDist) continue;
        if (!this.isIsolated(t, world)) continue;
        best = t;
        bestDist = d;
      }
      return best;
    }
    /** A tetra is prey-eligible ("isolated") only when no other
     *  tetra lies within PREDATOR_ISOLATION_RADIUS. Neighbourhood is
     *  answered by the world's spatial grid (PRD §1). */
    isIsolated(t, world) {
      for (const n of world.grid.query(t.x, t.y, PREDATOR_ISOLATION_RADIUS)) {
        if (n !== t && Math.hypot(n.x - t.x, n.y - t.y) <= PREDATOR_ISOLATION_RADIUS) return false;
      }
      return true;
    }
  };

  // src/sim/world.ts
  var GRID_CELL_SIZE = 64;
  var SPAWN_CLUSTER_RADIUS = 120;
  var SPAWN_HEADING_JITTER = 0.5;
  var SPAWN_CLUSTER_SQUASH = 0.6;
  var SPAWN_SPEED_MIN = 40;
  var SPAWN_SPEED_MAX = 80;
  var ALIGNMENT_CRUISE_SPEED = FISH_MAX_SPEED;
  var TORQUE_SMOOTHING = 0.25;
  var SCHOOL_PERCEPTION_RADIUS = 180;
  var TAU = 2 * Math.PI;
  var World = class {
    /** World clock in seconds: advances in exact step-size multiples. */
    time = 0;
    /** Seconds carried over between frames from an incomplete step. */
    acc = 0;
    /** Numeric PRNG seed this world was built from: a plain number,
     *  not a stateful stream — the mulberry32 stream is (re)created
     *  from it at construction, and same seed ⇒ identical tank. */
    seed;
    /** The tetra school, in fixed iteration order. Named `agents` to
     *  stay the stable per-world surface (the #119 determinism test
     *  hashes on it); every entry is a Tetra. */
    agents = [];
    /** Neighbor grid (typed Tetra so queries hand back moving bodies
     *  straight into the steering forces), rebuilt every fixed step
     *  (PRD §1). The predator's isolation checks reuse it. */
    grid;
    /** The apex predator (PRD §2, ticket #124): owned by the world,
     *  stepped after the tetras each fixed step. */
    predator;
    /** Reused neighbour scratch per step (allocation-free hot path):
     *  steering forces only READ the list, so one shared buffer is
     *  safe across the fixed-order iteration. */
    neighbours = [];
    constructor(options = {}) {
      this.seed = options.seed ?? 1;
      this.grid = new SpatialGrid(TANK_WIDTH, TANK_HEIGHT, GRID_CELL_SIZE);
      this.spawn(options.population ?? TETRA_COUNT);
      this.predator = new ApexPredator();
    }
    /** Spawn n tetras as one loose cluster at the tank centre: a
     *  shared base heading (jittered ±SPAWN_HEADING_JITTER) so the
     *  school is born roughly aligned, with seeded random offsets and
     *  speeds inside the cluster (uniform disk: the square-root keeps
     *  the density flat, not rim-heavy). */
    spawn(count) {
      const rng = mulberry32(this.seed);
      const baseHeading = rng() * TAU;
      for (let i = 0; i < count; i++) {
        const heading = baseHeading + (rng() * 2 - 1) * SPAWN_HEADING_JITTER;
        const offAngle = rng() * TAU;
        const radius = SPAWN_CLUSTER_RADIUS * Math.sqrt(rng());
        const speed = SPAWN_SPEED_MIN + rng() * (SPAWN_SPEED_MAX - SPAWN_SPEED_MIN);
        this.agents.push({
          x: TANK_WIDTH / 2 + Math.cos(offAngle) * radius,
          y: TANK_HEIGHT / 2 + Math.sin(offAngle) * radius * SPAWN_CLUSTER_SQUASH,
          vx: Math.cos(heading) * speed,
          vy: Math.sin(heading) * speed,
          phase: rng() * TAU,
          torque: 0,
          heading
        });
      }
    }
    /** Feed up to deltaSeconds of wall time to the sim: consume it in
     *  exact FIXED_DT steps, carry the leftover. Returns the number of
     *  steps taken. The app's only entry point — tests drive step(dt)
     *  directly.
     *
     *  Precondition (enforced by the CALLER, not here): deltaSeconds
     *  must be clamped into [0, MAX_FRAME_DELTA] before this call —
     *  fishtank-main.ts does this via clampDelta() — so a tab switch
     *  or long pause cannot burst thousands of fixed steps in one
     *  frame. advance() deliberately does not clamp itself: silently
     *  dropping the excess would change the accumulator's accounting
     *  semantics.
     *
     *  WELL-FORMEDNESS (enforced here): a non-finite delta (NaN, ±∞)
     *  is rejected — returns 0, touches nothing. A NaN would poison
     *  the accumulator permanently (every later `acc >= FIXED_DT`
     *  compares false and the sim freezes silently); +∞ would spin
     *  the step loop forever. The rejected frame simply accounts as
     *  no progress; the next well-formed frame drives normally.
     */
    advance(deltaSeconds) {
      if (!Number.isFinite(deltaSeconds)) return 0;
      this.acc += Math.max(0, deltaSeconds);
      let steps = 0;
      while (this.acc >= FIXED_DT) {
        this.acc -= FIXED_DT;
        this.step(FIXED_DT);
        steps += 1;
      }
      return steps;
    }
    /** One deterministic step of EXACTLY dt seconds: rebuild the
     *  neighbor grid, then for every tetra (fixed array order)
     *  compose the steering forces, clamp the speed, integrate and
     *  keep the body INSIDE the tank (elastic reflection plus a hard
     *  clamp), and advance its articulated tail at
     *  tailFrequency(speed, torque).
     *
     *  WELL-FORMEDNESS (enforced here, same policy as advance()): a
     *  non-finite dt (NaN, ±∞) or a dt <= 0 is refused — step() is a
     *  no-op that touches nothing. A NaN/±∞ would divide through the
     *  torque measurement and permanently poison every tetra's
     *  torque/phase; a negative dt would integrate the tank
     *  backwards. Pinned by tests/fishtank-determinism.test.mjs:
     *  a refused step leaves the world byte-identical and drivable. */
    step(dt) {
      if (!Number.isFinite(dt) || dt <= 0) return;
      this.time += dt;
      this.rebuildGrid();
      for (const t of this.agents) {
        this.neighbours.length = 0;
        for (const n of this.grid.query(t.x, t.y, SCHOOL_PERCEPTION_RADIUS)) {
          if (n !== t) this.neighbours.push(n);
        }
        const sep = separation(t, this.neighbours);
        const ali = alignment(this.neighbours);
        const coh = cohesion(t, this.neighbours);
        const bou = boundaryAvoidance(t, TANK_WIDTH, TANK_HEIGHT);
        const ax = sep.x + ali.x * ALIGNMENT_CRUISE_SPEED + coh.x + bou.x;
        const ay = sep.y + ali.y * ALIGNMENT_CRUISE_SPEED + coh.y + bou.y;
        let vx = t.vx + ax * dt;
        let vy = t.vy + ay * dt;
        const speed = Math.hypot(vx, vy);
        if (speed > TETRA_MAX_SPEED) {
          const s = TETRA_MAX_SPEED / speed;
          vx *= s;
          vy *= s;
        } else if (speed > 0 && speed < TETRA_MIN_SPEED) {
          const s = TETRA_MIN_SPEED / speed;
          vx *= s;
          vy *= s;
        }
        let x = t.x + vx * dt;
        let y = t.y + vy * dt;
        if (x < 0) {
          x = -x;
          vx = -vx;
        } else if (x > TANK_WIDTH) {
          x = 2 * TANK_WIDTH - x;
          vx = -vx;
        }
        if (y < 0) {
          y = -y;
          vy = -vy;
        } else if (y > TANK_HEIGHT) {
          y = 2 * TANK_HEIGHT - y;
          vy = -vy;
        }
        if (x < 0) x = 0;
        else if (x > TANK_WIDTH) x = TANK_WIDTH;
        if (y < 0) y = 0;
        else if (y > TANK_HEIGHT) y = TANK_HEIGHT;
        const nx = Math.hypot(vx, vy);
        const heading = Math.atan2(vy, vx);
        const instantTorque = wrapPi(heading - t.heading) / dt;
        t.torque += TORQUE_SMOOTHING * (instantTorque - t.torque);
        t.x = x;
        t.y = y;
        t.vx = vx;
        t.vy = vy;
        t.heading = heading;
        t.phase += TAU * tailFrequency(nx, t.torque) * dt;
      }
      this.predator.step(dt, this);
    }
    /** Startle event (PRD §2: the school scatters when the user taps
     *  the glass): every tetra within STARTLE_RADIUS of (x, y)
     *  receives an OUTWARD impulse of STARTLE_IMPULSE straight away
     *  from the epicentre. A tetra sitting exactly ON the epicentre
     *  (undefined radial direction) is flung along its own heading,
     *  or +x if it has none — deterministic. Non-finite coordinates
     *  are rejected: the event is a no-op reporting 0, touching
     *  nothing (same well-formedness philosophy as advance()).
     *  Returns the number of startled tetras. */
    startleAt(x, y) {
      if (!Number.isFinite(x) || !Number.isFinite(y)) return 0;
      let startled = 0;
      for (const t of this.agents) {
        const dx = t.x - x;
        const dy = t.y - y;
        const d = Math.hypot(dx, dy);
        if (d > STARTLE_RADIUS) continue;
        let ux;
        let uy;
        if (d > 0) {
          ux = dx / d;
          uy = dy / d;
        } else {
          const s = Math.hypot(t.vx, t.vy);
          ux = s > 0 ? t.vx / s : 1;
          uy = s > 0 ? t.vy / s : 0;
        }
        t.vx += ux * STARTLE_IMPULSE;
        t.vy += uy * STARTLE_IMPULSE;
        startled += 1;
      }
      return startled;
    }
    /** Fixed-precision snapshot of the whole sim state: clock first,
     *  then one `x,y,vx,vy` line per tetra at 6 decimals, then one
     *  `P:` line for the predator (state, pose, hunger, route
     *  progress, rest window, feed count). The tail state (phase,
     *  torque) is excluded deliberately: heading is a pure function
     *  of (vx, vy) and the tail scalars are deterministic functions
     *  of the full history, so this fingerprint already proves replay
     *  identity — predator included. Two same-seed worlds hash this
     *  byte-identically (determinism proof). */
    serializeState() {
      const lines = [this.time.toFixed(6)];
      for (const t of this.agents) {
        lines.push(`${t.x.toFixed(6)},${t.y.toFixed(6)},${t.vx.toFixed(6)},${t.vy.toFixed(6)}`);
      }
      const p = this.predator;
      lines.push(
        `P:${p.state}:${p.x.toFixed(6)},${p.y.toFixed(6)},${p.vx.toFixed(6)},${p.vy.toFixed(6)},${p.hunger.toFixed(6)},${p.waypointIndex},${p.restRemaining},${p.fedCount}`

    }
    /** Clear + re-insert every tetra: the O(1)-average neighbor
     *  lookup the steering forces (PRD §2) consume each step. */
    rebuildGrid() {
      this.grid.clear();
      for (const t of this.agents) this.grid.insert(t);
    }
  };
  function wrapPi(angle) {
    let a = angle % TAU;
    if (a > Math.PI) a -= TAU;
    if (a < -Math.PI) a += TAU;
    return a;
  }

  // src/render/tetras.ts
  var TETRA_SPINE_SEGMENTS = 7;
  var TETRA_BODY_LENGTH = 24;
  var TETRA_TAIL_AMPLITUDE = 5;
  var TETRA_TAIL_WAVE_NUMBER = 0.9;
  var TETRA_STROKE_WIDTH = 4;
  var TETRA_HEAD_RADIUS = 3.5;
  var TAU2 = 2 * Math.PI;
  function tetraColour(cache, index) {
    let c = cache[index];
    if (c === void 0) {

      cache[index] = c;

    return c;
  }
  function drawTetras(ctx, width, height, tetras, colours) {
    const sx = width / TANK_WIDTH;
    const sy = height / TANK_HEIGHT;

      drawTetra(ctx, tetras[i], i, sx, sy, colours);
    }
  }
  function drawTetra(ctx, t, index, sx, sy, colours) {
    const speed = Math.hypot(t.vx, t.vy);
    const hx = speed > 0 ? t.vx / speed : 1;
    const hy = speed > 0 ? t.vy / speed : 0;
    const px = -hy;
    const py = hx;
    const headX = t.x * sx;
    const headY = t.y * sy;
    const colourForFish = tetraColour(colours, index);
    const tailSpan = TETRA_SPINE_SEGMENTS - 1;
    ctx.beginPath();
    ctx.moveTo(headX, headY);
    for (let seg = 1; seg < TETRA_SPINE_SEGMENTS; seg++) {
      const k = seg / tailSpan;
      const back = TETRA_BODY_LENGTH * k;
      const sway = TETRA_TAIL_AMPLITUDE * k * Math.sin(t.phase - seg * TETRA_TAIL_WAVE_NUMBER);
      ctx.lineTo((t.x - hx * back + px * sway) * sx, (t.y - hy * back + py * sway) * sy);

    ctx.strokeStyle = colourForFish;
    ctx.lineWidth = TETRA_STROKE_WIDTH;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(headX, headY, TETRA_HEAD_RADIUS, 0, TAU2);
    ctx.fillStyle = colourForFish;
    ctx.fill();
  }

  // src/render/water.ts
  var SURFACE_RIPPLES = 3;
  var RIPPLE_AMPLITUDE = 6;
  var RIPPLE_SPEED = 1.4;
  var RIPPLE_STEP = 16;
  var RIPPLE_COLOR = "230, 250, 255";
  function drawBackdrop(ctx, width, height, palette) {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, palette.surface);
    grad.addColorStop(1, palette.depth);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
  }
  function drawSurfaceRipples(ctx, width, t) {
    ctx.lineWidth = 1.5;
    for (let j = 0; j < SURFACE_RIPPLES; j++) {
      const yBase = 14 + j * 9;
      const alpha = 0.25 - j * 0.06;
      ctx.beginPath();
      for (let x = 0; x <= width; x += RIPPLE_STEP) {
        const y = yBase + Math.sin(x * 0.02 + t * RIPPLE_SPEED + j * 1.3) * RIPPLE_AMPLITUDE;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(${RIPPLE_COLOR}, ${alpha.toFixed(3)})`;
      ctx.stroke();
    }
  }

  // src/render/lighting.ts
  var LIGHT_DAY = {
    name: "LIGHT_DAY",
    surface: "#8fd8ea",
    depth: "#0a2c45",
    causticRgb: "220, 245, 255",
    causticBaseAlpha: 0.055,
    causticPulseAlpha: 0.03
  };
  var LIGHT_DUSK = {
    name: "LIGHT_DUSK",
    surface: "#e89a5e",
    depth: "#2a1638",
    causticRgb: "255, 216, 160",
    causticBaseAlpha: 0.065,
    causticPulseAlpha: 0.035
  };
  var LIGHT_NIGHT = {
    name: "LIGHT_NIGHT",
    surface: "#123650",
    depth: "#030e18",
    causticRgb: "130, 240, 255",
    causticBaseAlpha: 0.085,
    causticPulseAlpha: 0.05
  };
  var DAY_DURATION = 45;
  var DUSK_DURATION = 15;
  var NIGHT_DURATION = 20;
  var CYCLE_DURATION = DAY_DURATION + DUSK_DURATION + NIGHT_DURATION;
  var LIGHT_PHASES = [
    { palette: LIGHT_DAY, duration: DAY_DURATION },
    { palette: LIGHT_DUSK, duration: DUSK_DURATION },
    { palette: LIGHT_NIGHT, duration: NIGHT_DURATION }
  ];
  function lightPhaseAt(t) {
    const u = (t % CYCLE_DURATION + CYCLE_DURATION) % CYCLE_DURATION;
    let remaining = u;
    let resolved;
    for (const phase of LIGHT_PHASES) {
      if (remaining < phase.duration) {
        resolved = phase;
        break;
      }
      remaining -= phase.duration;
    }
    if (resolved === void 0) {
      throw new Error("lighting: phase table does not cover CYCLE_DURATION");
    }
    return resolved;
  }

  // src/render/caustics.ts
  var CAUSTIC_SHAFTS = 5;
  var CAUSTIC_SWEEP_SPEED = 6;
  var CAUSTIC_SWEEP_SPAN = 120;
  var CAUSTIC_WRAP_FADE = 0.25;
  var CAUSTIC_PULSE_SPEED = 1.5;
  var CAUSTIC_TOP_HALF_WIDTH = 0.03;
  var CAUSTIC_BOTTOM_HALF_WIDTH = 0.09;
  var CAUSTIC_LEAN = 0.1;
  function drawCausticShafts(ctx, width, height, t, palette) {
    const top = width * CAUSTIC_TOP_HALF_WIDTH;
    const bot = width * CAUSTIC_BOTTOM_HALF_WIDTH;
    const lean = width * CAUSTIC_LEAN;
    for (let i = 0; i < CAUSTIC_SHAFTS; i++) {
      const phase = (t * CAUSTIC_SWEEP_SPEED + i * CAUSTIC_SWEEP_SPAN / CAUSTIC_SHAFTS) % CAUSTIC_SWEEP_SPAN;
      const sway = phase - CAUSTIC_SWEEP_SPAN / 2;
      const distToWrap = Math.min(phase, CAUSTIC_SWEEP_SPAN - phase) / (CAUSTIC_SWEEP_SPAN * CAUSTIC_WRAP_FADE);
      const wrapFade = distToWrap >= 1 ? 1 : distToWrap <= 0 ? 0 : distToWrap * distToWrap * (3 - 2 * distToWrap);
      const alpha = wrapFade * (palette.causticBaseAlpha + palette.causticPulseAlpha * Math.sin(t * CAUSTIC_PULSE_SPEED + i * 2.6));
      ctx.save();
      ctx.translate(width * ((i + 0.5) / CAUSTIC_SHAFTS) + sway, 0);
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, `rgba(${palette.causticRgb}, ${alpha.toFixed(4)})`);
      grad.addColorStop(1, `rgba(${palette.causticRgb}, 0)`);
      ctx.beginPath();
      ctx.moveTo(-top, 0);
      ctx.lineTo(top, 0);
      ctx.lineTo(lean + bot, height);
      ctx.lineTo(lean - bot, height);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }
  }

  // src/render/bubbles.ts
  var BUBBLE_POOL_SIZE = 24;
  var BUBBLE_WOBBLE_AMP = 8;
  var BUBBLE_RISE_PERIODS = 3;
  var BUBBLE_MARGIN = 12;
  var BUBBLE_RISE_MIN = 40;
  var BUBBLE_RISE_MAX = 100;
  var BUBBLE_RADIUS_MIN = 1.5;
  var BUBBLE_RADIUS_MAX = 5;
  var BUBBLE_STROKE = "rgba(230, 250, 255, 0.35)";
  var TAU3 = 2 * Math.PI;
  function hash(unit2, salt) {
    const v = Math.sin(unit2 * 127.1 + salt * 311.7) * 43758.5453;

  }
  var BubbleColumn = class {
    slots = [];
    constructor() {
      for (let i = 0; i < BUBBLE_POOL_SIZE; i++) {
        this.slots.push({
          lane: 0.04 + 0.92 * hash(i, 1),
          radius: BUBBLE_RADIUS_MIN + (BUBBLE_RADIUS_MAX - BUBBLE_RADIUS_MIN) * hash(i, 3),
          speed: BUBBLE_RISE_MIN + (BUBBLE_RISE_MAX - BUBBLE_RISE_MIN) * hash(i, 2),
          offset: hash(i, 4),
          phase0: hash(i, 5) * TAU3
        });
      }
    }
    /** Release (paint) the whole pool at world time t: every slot,

     *  as the i-th bubble arc of each frame. Allocation-free: the
     *  loop only reads preallocated fields. */
    paint(ctx, width, height, t) {
      const column = height + BUBBLE_MARGIN * 2;
      ctx.lineWidth = 1;
      ctx.strokeStyle = BUBBLE_STROKE;
      for (let i = 0; i < this.slots.length; i++) {
        const s = this.slots[i];
        const rise = column / s.speed;
        const x = s.lane * width + Math.sin(t / rise * TAU3 * BUBBLE_RISE_PERIODS + s.phase0) * BUBBLE_WOBBLE_AMP;
        const y = height + BUBBLE_MARGIN - (t * s.speed + s.offset * column) % column;
        ctx.beginPath();
        ctx.arc(x, y, s.radius, 0, TAU3);
        ctx.stroke();
      }

  };

  // src/render/substrate.ts
  var SUBSTRATE_SEED = 4091;
  var SUBSTRATE_GRAVEL_COUNT = 44;
  var SUBSTRATE_DECOR_ROCKS = 6;
  var SUBSTRATE_KELP_TUFTS = 4;
  var SUBSTRATE_FAR_DRIFT = 1.2;
  var SUBSTRATE_NEAR_DRIFT = 3;
  var GRAVEL_BAND = 0.06;
  var GRAVEL_FILLS = ["#31506b", "#3c5f7d", "#466a8c", "#2b455c"];
  var ROCK_FILL = "#22384c";
  var KELP_STROKE = "rgba(38, 104, 74, 0.85)";
  var TAU4 = 2 * Math.PI;
  var Substrate = class {
    gravel = [];
    rocks = [];
    kelp = [];
    constructor() {
      const rng = mulberry32(SUBSTRATE_SEED);
      for (let i = 0; i < SUBSTRATE_GRAVEL_COUNT; i++) {
        this.gravel.push({
          u: rng(),
          v: rng(),
          rx: 3 + 5 * rng(),
          ry: 2 + 3.5 * rng(),
          fill: GRAVEL_FILLS[Math.floor(rng() * GRAVEL_FILLS.length) % GRAVEL_FILLS.length] ?? "#31506b"
        });
      }
      for (let i = 0; i < SUBSTRATE_DECOR_ROCKS; i++) {
        this.rocks.push({ u: rng(), rx: 18 + 24 * rng(), ry: 8 + 12 * rng() });
      }
      for (let i = 0; i < SUBSTRATE_KELP_TUFTS; i++) {
        this.kelp.push({ u: rng(), h: 0.06 + 0.07 * rng(), phase: rng() * TAU4 });
      }
    }
    /** Paint the FAR gravel layer (drawn first, i.e. behind the
     *  near layer): one save/translate/restore group for the layer
     *  drift, two tiles per element. */
    paintFar(ctx, width, height, t) {
      const tile = width;
      const off = t * SUBSTRATE_FAR_DRIFT % tile;
      const band = height * GRAVEL_BAND;
      ctx.save();
      ctx.translate(off, 0);
      for (const s of this.gravel) {
        const y = height - band * s.v;
        for (const dx of [0, -tile]) {
          const x = s.u * tile + dx;
          ctx.beginPath();
          ctx.ellipse(x, y, s.rx, s.ry, 0, 0, TAU4);
          ctx.fillStyle = s.fill;
          ctx.fill();
        }
      }
      ctx.restore();
    }
    /** Paint the NEAR top-decor band (rocks resting on the bed,
     *  kelp tufts idling with a slow sway): one save/translate/
     *  restore group per LAYER (the drift), two tiles per element. */
    paintNear(ctx, width, height, t) {
      const tile = width;
      const off = t * SUBSTRATE_NEAR_DRIFT % tile;
      ctx.save();
      ctx.translate(off, 0);
      for (const r of this.rocks) {
        const y = height - r.ry * 0.5;
        for (const dx of [0, -tile]) {
          const x = r.u * tile + dx;
          ctx.beginPath();
          ctx.ellipse(x, y, r.rx, r.ry, 0, 0, TAU4);
          ctx.fillStyle = ROCK_FILL;
          ctx.fill();
        }
      }
      ctx.strokeStyle = KELP_STROKE;
      ctx.lineWidth = 3;
      for (const k of this.kelp) {
        const baseX = k.u * tile;
        const topY = height - height * k.h;
        for (const dx of [0, -tile]) {
          const x = baseX + dx;
          const sway = Math.sin(t * 0.8 + k.phase) * 6;
          ctx.beginPath();
          ctx.moveTo(x, height);
          ctx.quadraticCurveTo(x + sway, (height + topY) / 2, x + sway * 1.6, topY);
          ctx.stroke();

      ctx.restore();

  };

  // src/render/renderer.ts
  var Renderer = class {
    /** Per-instance tetra colour cache (src/render/tetras.ts builds
     *  the render layer with NO module-level state — the only mutable
     *  render state a Renderer owns). */
    tetraColours = [];
    /** The pooled bubble emitter (src/render/bubbles.ts): built once
     *  per Renderer, recycled in place every frame. */
    bubbles = new BubbleColumn();
    /** The two parallax substrate layers (src/render/substrate.ts):
     *  built once per Renderer, seeded, reused forever. */
    substrate = new Substrate();
    /** Paint one frame of the given world state. The scene ambient is
     *  resolved from world.time (a paused sim freezes it); the rest
     *  of the frame is painted in the documented order above. */
    render(ctx, width, height, world) {
      const light = lightPhaseAt(world.time);
      drawBackdrop(ctx, width, height, light.palette);
      this.substrate.paintFar(ctx, width, height, world.time);
      this.substrate.paintNear(ctx, width, height, world.time);
      drawCausticShafts(ctx, width, height, world.time, light.palette);
      drawSurfaceRipples(ctx, width, world.time);
      drawTetras(ctx, width, height, world.agents, this.tetraColours);

  };

  // src/ui/stage.ts
  var Stage = class _Stage {
    canvas;
    ctx;
    win;
    constructor(canvas, ctx, win) {
      this.canvas = canvas;
      this.ctx = ctx;
      this.win = win;
    }
    /** Grab the 2d context, wire viewport resize, do the first fit. */
    static attach(canvas, win) {
      if (typeof canvas.getContext !== "function") {
        throw new Error("fishtank: the #game element is not a canvas");
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("fishtank: no 2d canvas context available");
      const stage = new _Stage(canvas, ctx, win);
      win.addEventListener("resize", () => stage.refit());

    }

    }
    get height() {
      return this.canvas.height;
    }
    /** Refit the backing store to the viewport (device-pixel aware). */
    refit() {

    }
  };

  // src/fishtank-main.ts
  function initFishtank(win, doc) {
    const canvasEl = doc.getElementById("game");
    if (!canvasEl) throw new Error("fishtank: the #game element is missing");
    const stage = Stage.attach(canvasEl, win);
    const world = new World();
    const renderer = new Renderer();
    exposeTestSeam(world);
    let lastTs = null;
    const frame = (ts) => {
      const elapsed = lastTs === null ? 0 : (ts - lastTs) / 1e3;
      lastTs = ts;
      world.advance(clampDelta(elapsed));
      renderer.render(stage.ctx, stage.width, stage.height, world);
      win.requestAnimationFrame(frame);
    };
    win.requestAnimationFrame(frame);

  }
  function clampDelta(seconds) {
    return Math.min(MAX_FRAME_DELTA, Math.max(0, seconds));
  }
  function exposeTestSeam(world) {
    const seam = globalThis;
    seam.FIXED_DT = FIXED_DT;
    seam.TETRA_COUNT = TETRA_COUNT;
    seam.FISH_TANK_WORLD = world;
  }
  if (typeof window !== "undefined" && typeof document !== "undefined") {
    initFishtank(window, document);
  }
})();

</script>
