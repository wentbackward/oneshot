<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Tank</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #06121e; }
#game { display: block; width: 100vw; height: 100vh; }

/* Click-region note: the nav box (buttons + gaps) sits over the
   canvas in the top-left corner. In place modes a first click there
   must not plant scenery hidden behind the toolbar — the buttons
   swallow their own clicks, and Toolbar's click-region guard
   (src/ui/toolbar.ts) drops any canvas click that lands inside
   this box. Restyles that widen/narrow the box need no JS change. */
#toolbar { position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; gap: 6px; font: 10px/1 monospace; letter-spacing: .15em; }
#toolbar button { color: #5a6b7d; background: rgba(5, 7, 15, .72); border: 1px solid #1c2430; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
#toolbar button:hover { color: #e8f2fb; border-color: #5a6b7d; }
#toolbar button.selected { color: #7fe3ff; border-color: #3d8bb0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- Tank toolbar: static markup (PRD §3 tools — Drop Food, Tap
     Glass, Place/Remove), wired at boot by src/ui/toolbar.ts. The
     vm suites boot this file with a document stub; every id lookup
     is null-guarded there, so the static buttons never break a
     headless boot. -->
<nav id="toolbar" aria-label="tank tools">
<button id="tool-drop-food" type="button">DROP FOOD</button>
<button id="tool-tap-glass" type="button">TAP GLASS</button>
<button id="tool-place-rock" class="selected" type="button">PLACE ROCK</button>
<button id="tool-place-kelp" type="button">PLACE KELP</button>
<button id="tool-remove" type="button">REMOVE</button>
</nav>
<!-- One-shot hub back link: static markup only, no JS (the vm suites
     boot this file — anything queried at boot needs a stub, so keep
     it inert, matching the other cabinets). -->
<style>
  #hub-back { position: fixed; right: 10px; bottom: 10px; z-index: 10; font: 10px/1 monospace; letter-spacing: .15em; color: #5a6b7d; text-decoration: none; padding: 4px 7px; border: 1px solid #1c2430; border-radius: 6px; background: rgba(5, 7, 15, .72); }
  #hub-back:hover { color: #e8f2fb; border-color: #5a6b7d; }
</style>
<a id="hub-back" href="index.html">&larr; ONE-SHOT</a>
<script>
"use strict";
(() => {
  // src/sim/constants.ts
  var FIXED_DT = 1 / 60;
  var TANK_WIDTH = 1600;
  var TANK_HEIGHT = 1e3;
  var MAX_FRAME_DELTA = 0.25;
  var TETRA_COUNT = 80;
  var STARTLE_RADIUS = 140;
  var STARTLE_IMPULSE = 200;
  var TETRA_MIN_SPEED = 30;
  var TETRA_MAX_SPEED = 220;
  var PREDATOR_PATROL_SPEED = 340;
  var PREDATOR_STALK_SPEED = 380;
  var PREDATOR_REST_SPEED = 30;
  var PREDATOR_HUNGER_RATE = 0.06;
  var PREDATOR_STALK_THRESHOLD = 0.7;
  var PREDATOR_SIGHT_RANGE = 400;
  var PREDATOR_ISOLATION_RADIUS = 160;
  var PREDATOR_CAPTURE_RADIUS = 28;
  var PREDATOR_REST_STEPS = 240;
  var PREDATOR_WAYPOINT_TOLERANCE = 48;
  var PELLET_MAX = 64;
  var PELLET_RADIUS = 5;
  var PELLET_GRAVITY = 120;
  var PELLET_DRAG = 2;
  var PELLET_TERMINAL_V = PELLET_GRAVITY / PELLET_DRAG;
  var PELLET_SENSE_RADIUS = 120;
  var PELLET_EAT_RADIUS = 16;
  var SHOCKWAVE_RING_SPEED = 400;
  var SHOCKWAVE_RING_MAX_RADIUS = 300;
  var SHOCKWAVE_MAX_RINGS = 16;
  var ROCK_MAX = 24;
  var KELP_MAX = 32;
  var ROCK_RADIUS = 40;
  var ROCK_COLLIDE_PAD = 6;
  var ROCK_PICK_SLACK = 24;
  var KELP_PICK_SLACK = 24;
  var KELP_PICK_BAND = 140;
  var KELP_SEED_STRIDE = 104729;
  var KELP_SEGMENTS = 8;
  var KELP_TOTAL_LENGTH = 220;
  var KELP_GROWTH = 150;
  var KELP_ANCHOR_PULL = 0.3;
  var KELP_DAMPING = 0.985;
  var KELP_CONSTRAINT_ITERS = 8;
  var KELP_JITTER = 2;
  var AMBIENT_CURRENT_X = 40;
  var KELP_FISH_RADIUS = 48;
  var KELP_FISH_PUSH_GAIN = 2;

  // src/sim/rng.ts
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // src/sim/kelp.ts
  var KelpStrand = class {
    /** Anchor x on the substrate (point 0's x, never moves). */
    anchorX;
    /** Anchor y — always TANK_HEIGHT (the substrate). */
    anchorY;
    /** Segment count (KELP_SEGMENTS, ≥ 6). */
    segments;
    /** Rest length of EVERY segment (they tile the strand evenly). */
    restLength;
    /** The base spring's rest point: restLength up the (jittered)
     *  base direction from the anchor — point 1 is pulled toward it
     *  every constraint pass (see KELP_ANCHOR_PULL). */
    baseRestX;
    baseRestY;
    /** points[0] is the pinned anchor; points[segments] is the tip. */
    points = [];
    /** Build the strand at (anchorX, anchorY) as a nearly vertical
     *  column of segments pointing UP (−y): the seeded jitter keeps
     *  it from being laser-straight, which would make the settle
     *  tests vacuous (a perfectly symmetric chain has nothing to
     *  relax). `seed` is the world's deterministic source for it. */
    constructor(anchorX, anchorY, seed) {
      if (!Number.isFinite(anchorX) || !Number.isFinite(anchorY)) {
        throw new RangeError("KelpStrand: anchor must be finite");
      }
      this.anchorX = anchorX;
      this.anchorY = anchorY;
      this.segments = KELP_SEGMENTS;
      this.restLength = KELP_TOTAL_LENGTH / KELP_SEGMENTS;
      const rng = mulberry32(seed >>> 0);
      for (let i = 0; i <= this.segments; i++) {
        const jitter = i === 0 ? 0 : (rng() * 2 - 1) * KELP_JITTER;
        const x = anchorX + jitter;
        const y = anchorY - this.restLength * i;
        this.points.push({ x, y, px: x, py: y });
      }
      const p0 = this.points[0];
      const p1 = this.points[1];
      const bx = p1.x - p0.x;
      const by = p1.y - p0.y;
      const bl = Math.hypot(bx, by);
      this.baseRestX = p0.x + bx / bl * this.restLength;
      this.baseRestY = p0.y + by / bl * this.restLength;
    }
    /** One fixed step: verlet-integrate current + growth, apply the
     *  fish drag, then satisfy every segment's rest length
     *  KELP_CONSTRAINT_ITERS times, re-pinning the anchor each pass
     *  and finishing each pass with the soft base-orientation pull.
     *
     *  `currentX` is the ambient horizontal flow (tank units/s², 0 =
     *  still water); `fish` is the world's agents in fixed order
     *  (each head drags any kelp point within KELP_FISH_RADIUS).
     *  A non-finite or non-positive `dt` is refused: the step is a
     *  no-op touching nothing (same policy as World.step). */
    step(dt, currentX, fish) {
      if (!Number.isFinite(dt) || dt <= 0) return;
      const dt2 = dt * dt;
      for (let i = 1; i < this.points.length; i++) {
        const p = this.points[i];
        const vx = (p.x - p.px) * KELP_DAMPING;
        const vy = (p.y - p.py) * KELP_DAMPING;
        p.px = p.x;
        p.py = p.y;
        p.x += vx + currentX * dt2;
        p.y += vy - KELP_GROWTH * dt2;
      }
      this.dragByFish(dt, fish);
      for (let iter = 0; iter < KELP_CONSTRAINT_ITERS; iter++) {
        const anchor = this.points[0];
        anchor.x = this.anchorX;
        anchor.y = this.anchorY;
        for (let i = 1; i < this.points.length; i++) {
          this.satisfy(this.points[i - 1], this.points[i]);
        }
        const base = this.points[1];
        base.x += (this.baseRestX - base.x) * KELP_ANCHOR_PULL;
        base.y += (this.baseRestY - base.y) * KELP_ANCHOR_PULL;
      }
    }
    /** Fish → kelp coupling: each fish drags every point inside
     *  KELP_FISH_RADIUS along its own velocity, scaled by the
     *  named gain and a linear (1 − d/R) falloff. Displacement per
     *  step is bounded by gain × speed × dt, so a fast fish whips
     *  the strand while a slow one barely stirs it. */
    dragByFish(dt, fish) {
      const r2 = KELP_FISH_RADIUS * KELP_FISH_RADIUS;
      for (const f of fish) {
        const fx = f.vx * dt;
        const fy = f.vy * dt;
        if (fx === 0 && fy === 0) continue;
        for (let i = 1; i < this.points.length; i++) {
          const p = this.points[i];
          const ex = p.x - f.x;
          const ey = p.y - f.y;
          const d2 = ex * ex + ey * ey;
          if (d2 >= r2) continue;
          const falloff = 1 - Math.sqrt(d2) / KELP_FISH_RADIUS;
          p.x += fx * KELP_FISH_PUSH_GAIN * falloff;
          p.y += fy * KELP_FISH_PUSH_GAIN * falloff;
        }
      }
    }
    /** Relax segment (a, b) to the rest length: split the correction
     *  between the endpoints, giving the pinned anchor zero weight
     *  (b is never pinned — only points[0] is). */
    satisfy(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      if (d === 0) return;
      const diff = (d - this.restLength) / d;
      const wA = a === this.points[0] ? 0 : 0.5;
      const wB = a === this.points[0] ? 1 : 0.5;
      a.x += dx * diff * wA;
      a.y += dy * diff * wA;
      b.x -= dx * diff * wB;
      b.y -= dy * diff * wB;
    }
  };

  // src/sim/pellets.ts
  function stepPellet(p, dt, currentX) {
    p.vy += (PELLET_GRAVITY - PELLET_DRAG * p.vy) * dt;
    p.vx += (currentX - PELLET_DRAG * p.vx) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  // src/sim/tail.ts
  var TAIL_FREQ_SPEED_GAIN = 0.04;
  var TAIL_FREQ_TORQUE_GAIN = 0.25;
  function tailFrequency(speed, torque) {
    return TAIL_FREQ_SPEED_GAIN * Math.abs(speed) + TAIL_FREQ_TORQUE_GAIN * Math.abs(torque);
  }

  // src/sim/steering.ts
  var MAX_STEERING_FORCE = 120;
  var MAX_SEPARATION_FORCE = 90;
  var MAX_ALIGNMENT_FORCE = 1;
  var MAX_COHESION_FORCE = 60;
  var MAX_BOUNDARY_AVOIDANCE_FORCE = MAX_STEERING_FORCE;
  var MAX_OBSTACLE_AVOIDANCE_FORCE = 100;
  var MAX_SEEK_FORCE = 100;
  var NEIGHBOUR_RADIUS = 64;
  var COHESION_GAIN = 0.35;
  var BOUNDARY_MARGIN = 120;
  var OBSTACLE_AVOID_DISTANCE = 150;
  var FISH_MAX_SPEED = 80;
  function zero() {
    return { x: 0, y: 0 };
  }
  function clampLength(v, maxLength) {
    const len = Math.hypot(v.x, v.y);
    if (len === 0) return v;
    if (len <= maxLength) return v;
    const s = maxLength / len;
    return { x: v.x * s, y: v.y * s };
  }
  function unit(x, y) {
    const len = Math.hypot(x, y);
    return len === 0 ? zero() : { x: x / len, y: y / len };
  }
  function separation(self, neighbours) {
    const sum = zero();
    const r2 = NEIGHBOUR_RADIUS * NEIGHBOUR_RADIUS;
    for (const n of neighbours) {
      const dx = self.x - n.x;
      const dy = self.y - n.y;
      const d2 = dx * dx + dy * dy;
      if (d2 === 0 || d2 > r2) continue;
      sum.x += dx / d2;
      sum.y += dy / d2;
    }
    return clampLength(sum, MAX_SEPARATION_FORCE);
  }
  function alignment(neighbours) {
    const sum = zero();
    let votes = 0;
    for (const n of neighbours) {
      const h = unit(n.vx, n.vy);
      if (h.x === 0 && h.y === 0) continue;
      sum.x += h.x;
      sum.y += h.y;
      votes += 1;
    }
    if (votes === 0) return zero();
    return clampLength({ x: sum.x / votes, y: sum.y / votes }, MAX_ALIGNMENT_FORCE);
  }
  function cohesion(self, neighbours) {
    if (neighbours.length === 0) return zero();
    let cx = 0;
    let cy = 0;
    for (const n of neighbours) {
      cx += n.x;
      cy += n.y;
    }
    const toCentroid = { x: cx / neighbours.length - self.x, y: cy / neighbours.length - self.y };
    return clampLength(
      { x: toCentroid.x * COHESION_GAIN, y: toCentroid.y * COHESION_GAIN },
      MAX_COHESION_FORCE
    );
  }
  function boundaryAvoidance(pos, width, height) {
    const f = zero();
    if (pos.x < BOUNDARY_MARGIN) f.x += (BOUNDARY_MARGIN - pos.x) / BOUNDARY_MARGIN * MAX_BOUNDARY_AVOIDANCE_FORCE;
    if (pos.x > width - BOUNDARY_MARGIN) f.x -= (pos.x - (width - BOUNDARY_MARGIN)) / BOUNDARY_MARGIN * MAX_BOUNDARY_AVOIDANCE_FORCE;
    if (pos.y < BOUNDARY_MARGIN) f.y += (BOUNDARY_MARGIN - pos.y) / BOUNDARY_MARGIN * MAX_BOUNDARY_AVOIDANCE_FORCE;
    if (pos.y > height - BOUNDARY_MARGIN) f.y -= (pos.y - (height - BOUNDARY_MARGIN)) / BOUNDARY_MARGIN * MAX_BOUNDARY_AVOIDANCE_FORCE;
    return clampLength(f, MAX_BOUNDARY_AVOIDANCE_FORCE);
  }
  function obstacleAvoidance(self, obstacles) {
    const sum = zero();
    for (const o of obstacles) {
      const dx = self.x - o.x;
      const dy = self.y - o.y;
      const d = Math.hypot(dx, dy);
      const w = 1 - (d - o.r) / OBSTACLE_AVOID_DISTANCE;
      if (w <= 0) continue;
      const dir = d === 0 ? { x: 1, y: 0 } : { x: dx / d, y: dy / d };
      sum.x += dir.x * w;
      sum.y += dir.y * w;
    }
    return clampLength(sum, MAX_OBSTACLE_AVOIDANCE_FORCE);
  }
  function seek(self, target) {
    const dx = target.x - self.x;
    const dy = target.y - self.y;
    const d = Math.hypot(dx, dy);
    if (d === 0) return zero();
    const desired = { x: dx / d * FISH_MAX_SPEED, y: dy / d * FISH_MAX_SPEED };
    return clampLength({ x: desired.x - self.vx, y: desired.y - self.vy }, MAX_SEEK_FORCE);
  }

  // src/sim/spatialGrid.ts
  var SpatialGrid = class {
    cellSize;
    cols;
    rows;
    cells;
    /** Cell index per inserted item: makes update()/remove() O(1)
     *  lookups without scanning cells. */
    indexOf = /* @__PURE__ */ new Map();
    constructor(width, height, cellSize) {
      if (!(cellSize > 0)) throw new RangeError("SpatialGrid: cellSize must be positive");
      this.cellSize = cellSize;
      this.cols = Math.max(1, Math.ceil(width / cellSize));
      this.rows = Math.max(1, Math.ceil(height / cellSize));
      this.cells = Array.from({ length: this.cols * this.rows }, () => []);
    }
    /** Drop every item (cell arrays themselves are reused: no
     *  per-step allocation). */
    clear() {
      for (const cell of this.cells) cell.length = 0;
      this.indexOf.clear();
    }
    /** Place an item in the cell holding its current position.
     *  Re-inserting a present item moves it (idempotent count: an
     *  item never occupies two cells). The old-cell eviction splices
     *  ONLY at the item's verified own slot — if the bookkeeping ever
     *  goes stale the item is simply absent and nothing is removed:
     *  an implicit splice position (splice(-1)) would evict an
     *  innocent neighbour. */
    insert(item) {
      const cellIndex = this.indexOf.get(item);
      if (cellIndex !== void 0) {
        const cell = this.cells[cellIndex];
        const at = cell.indexOf(item);
        if (at >= 0) cell.splice(at, 1);
      }
      const index = this.rowOf(item.y) * this.cols + this.colOf(item.x);
      this.cells[index].push(item);
      this.indexOf.set(item, index);
    }
    /** Express intent at the call site that an already-inserted item
     *  moved. A plain alias of insert() — identical behaviour, no
     *  performance difference (an untracked item is simply put in);
     *  it exists so callers read "it moved", not "re-inserted it". */
    update(item) {
      this.insert(item);
    }
    /** Remove an item. Returns true if it was present. Removing an
     *  absent item is a pure no-op: it splices nothing, so a healthy
     *  neighbour (even the last occupant of the same cell) can never
     *  be disturbed. */
    remove(item) {
      const cellIndex = this.indexOf.get(item);
      if (cellIndex === void 0) return false;
      const cell = this.cells[cellIndex];
      const at = cell.indexOf(item);
      if (at >= 0) cell.splice(at, 1);
      this.indexOf.delete(item);
      return true;
    }
    /** All items within Euclidean distance <= radius of (x, y), as a
     *  fresh array (callers own it). Exact set semantics: the probe
     *  visits precisely the cells the closed ball overlaps and then
     *  filters by squared distance, so the result matches brute-force
     *  distance filtering over the same items bit-for-bit. */
    query(x, y, radius) {
      const found = [];
      const r2 = radius * radius;
      const c0 = this.colOf(x - radius);
      const c1 = this.colOf(x + radius);
      const r0 = this.rowOf(y - radius);
      const r1 = this.rowOf(y + radius);
      for (let row = r0; row <= r1; row++) {
        for (let col = c0; col <= c1; col++) {
          const cell = this.cells[row * this.cols + col];
          for (const item of cell) {
            const dx = item.x - x;
            const dy = item.y - y;
            if (dx * dx + dy * dy <= r2) found.push(item);
          }
        }
      }
      return found;
    }
    colOf(x) {
      return Math.min(this.cols - 1, Math.max(0, Math.floor(x / this.cellSize)));
    }
    rowOf(y) {
      return Math.min(this.rows - 1, Math.max(0, Math.floor(y / this.cellSize)));
    }
  };

  // src/sim/predator.ts
  var PREDATOR_PATROL_ROUTE = [
    { name: "north-west", x: 400, y: 300 },
    { name: "north-east", x: 1200, y: 300 },
    { name: "south-east", x: 1200, y: 700 },
    { name: "south-west", x: 400, y: 700 }
  ];
  var PREDATOR_SPAWN_X = 100;
  var PREDATOR_SPAWN_Y = 500;
  var ApexPredator = class {
    x = PREDATOR_SPAWN_X;
    y = PREDATOR_SPAWN_Y;
    /** Velocity (direction AND speed) in tank units/s — direct
     *  kinematics: the step re-sets this from the state every time. */
    vx;
    vy;
    state = "patrol";
    /** Hunger in [0, 1]: rises at PREDATOR_HUNGER_RATE (even during
     *  rest), resets to 0 on a feed. */
    hunger = 0;
    /** Index into PREDATOR_PATROL_ROUTE of the stop currently being
     *  sought; advances on each arrival (cyclically). */
    waypointIndex = 0;
    /** The locked prey (a live reference into world.agents) or null.
     *  A non-null lock is always live: the only removal path is a
     *  capture, which nulls the lock in the same step. */
    prey = null;
    /** Rest steps remaining: armed to PREDATOR_REST_STEPS on a feed,
     *  counts down during rest, hits 0 at the boundary step. */
    restRemaining = 0;
    /** How many tetras this predator has eaten (telemetry). */
    fedCount = 0;
    constructor() {
      const wp = PREDATOR_PATROL_ROUTE[0];
      const dx = wp.x - this.x;
      const dy = wp.y - this.y;
      const d = Math.hypot(dx, dy);
      this.vx = d > 0 ? dx / d * PREDATOR_PATROL_SPEED : PREDATOR_PATROL_SPEED;
      this.vy = d > 0 ? dy / d * PREDATOR_PATROL_SPEED : 0;
    }
    /** Advance the predator by exactly dt seconds against the world.
     *  Called by World.step AFTER the tetras have moved, so prey
     *  positions are current (the neighbor grid is rebuilt at the
     *  start of each step — the same one-step-stale view the tetras'
     *  own steering uses). May mutate world.agents: a capture splices
     *  the victim out. */
    step(dt, world) {
      this.hunger = Math.min(1, this.hunger + PREDATOR_HUNGER_RATE * dt);
      let dirX;
      let dirY;
      let speed;
      let drifting = false;
      if (this.state === "rest") {
        this.restRemaining -= 1;
        if (this.restRemaining <= 0) {
          this.state = "patrol";
        } else {
          drifting = true;
        }
      }
      if (drifting) {
        const m = Math.hypot(this.vx, this.vy);
        dirX = m > 0 ? this.vx / m : 1;
        dirY = m > 0 ? this.vy / m : 0;
        speed = PREDATOR_REST_SPEED;
      } else {
        if (this.state === "patrol" && this.hunger >= PREDATOR_STALK_THRESHOLD) {
          const target = this.findPrey(world);
          if (target) {
            this.state = "stalk";
            this.prey = target;
          }
        }
        let prey = this.state === "stalk" ? this.prey : null;
        if (prey && !this.isIsolated(prey, world)) {
          this.prey = null;
          prey = null;
        }
        if (prey) {
          const dx = prey.x - this.x;
          const dy = prey.y - this.y;
          const d = Math.hypot(dx, dy);
          dirX = d > 0 ? dx / d : 1;
          dirY = d > 0 ? dy / d : 0;
          speed = PREDATOR_STALK_SPEED;
        } else {
          this.prey = null;
          this.state = "patrol";
          let i = this.waypointIndex;
          const wp = PREDATOR_PATROL_ROUTE[i];
          if (Math.hypot(wp.x - this.x, wp.y - this.y) <= PREDATOR_WAYPOINT_TOLERANCE) {
            i = (i + 1) % PREDATOR_PATROL_ROUTE.length;
            this.waypointIndex = i;
          }
          const next = PREDATOR_PATROL_ROUTE[i];
          const dx = next.x - this.x;
          const dy = next.y - this.y;
          const d = Math.hypot(dx, dy);
          dirX = d > 0 ? dx / d : 1;
          dirY = d > 0 ? dy / d : 0;
          speed = PREDATOR_PATROL_SPEED;
        }
      }
      const victim = this.state === "stalk" ? this.prey : null;
      if (victim && Math.hypot(victim.x - this.x, victim.y - this.y) <= PREDATOR_CAPTURE_RADIUS) {
        const at = world.agents.indexOf(victim);
        if (at >= 0) world.agents.splice(at, 1);
        this.prey = null;
        this.hunger = 0;
        this.fedCount += 1;
        this.state = "rest";
