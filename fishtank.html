<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Tank</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #06121e; }
#game { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
(() => {
  // src/sim/constants.ts
  var FIXED_DT = 1 / 60;
  var MAX_FRAME_DELTA = 0.25;

  // src/sim/spatialGrid.ts
  var SpatialGrid = class {
    cellSize;
    cols;
    rows;
    cells;
    constructor(width, height, cellSize) {
      if (!(cellSize > 0)) throw new RangeError("SpatialGrid: cellSize must be positive");
      this.cellSize = cellSize;
      this.cols = Math.max(1, Math.ceil(width / cellSize));
      this.rows = Math.max(1, Math.ceil(height / cellSize));
      this.cells = Array.from({ length: this.cols * this.rows }, () => []);
    }
    /** Drop every item (kept between cells: no per-step allocation). */
    clear() {
      for (const cell of this.cells) cell.length = 0;
    }
    /** Place an item into the cell holding its position. */
    insert(item) {
      const cell = this.cells[this.rowOf(item.y) * this.cols + this.colOf(item.x)];
      if (cell) cell.push(item);
    }
    /** Call cb for every item stored in the 3×3 block of cells around
     *  (x, y) — the uniform grid's constant-cost neighborhood probe. */
    queryNeighbors(x, y, cb) {
      const cx = this.colOf(x);
      const cy = this.rowOf(y);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const row = cy + dy;
          const col = cx + dx;
          if (row < 0 || row >= this.rows || col < 0 || col >= this.cols) continue;
          const cell = this.cells[row * this.cols + col];
          if (cell) for (const item of cell) cb(item);
        }
      }
    }
    colOf(x) {
      return Math.min(this.cols - 1, Math.max(0, Math.floor(x / this.cellSize)));
    }
    rowOf(y) {
      return Math.min(this.rows - 1, Math.max(0, Math.floor(y / this.cellSize)));
    }
  };

  // src/sim/world.ts
  var TANK_WIDTH = 1600;
  var TANK_HEIGHT = 1e3;
  var GRID_CELL_SIZE = 64;
  var World = class {
    /** World clock in seconds: advances in exact FIXED_DT multiples. */
    time = 0;
    /** Seconds carried over between frames from an incomplete step. */
    acc = 0;
    /** Every simulated entity (fish, pellets, obstacles) lives here. */
    entities = [];
    /** Neighbor grid, rebuilt every fixed step (PRD §1). */
    grid;
    constructor() {
      this.grid = new SpatialGrid(TANK_WIDTH, TANK_HEIGHT, GRID_CELL_SIZE);
    }
    /** Feed up to deltaSeconds of wall time to the sim: consume it in
     *  exact FIXED_DT steps, carry the leftover. Returns the number of
     *  steps taken. */
    advance(deltaSeconds) {
      this.acc += Math.max(0, deltaSeconds);
      let steps = 0;
      while (this.acc >= FIXED_DT) {
        this.acc -= FIXED_DT;
        this.step();
        steps += 1;
      }
      return steps;
    }
    /** One fixed step: advance the clock and rebuild the neighbor
     *  grid. Per-entity behaviours (steering, PRD §2) plug into this
     *  method in a later ticket. */
    step() {
      this.time += FIXED_DT;
      this.grid.clear();
      for (const entity of this.entities) this.grid.insert(entity);
    }
  };

  // src/render/water.ts
  var WATER_SURFACE = "#8fd8ea";
  var WATER_DEPTH = "#0a2c45";
  var CAUSTIC_SHAFTS = 5;
  var CAUSTIC_BASE_ALPHA = 0.055;
  var CAUSTIC_PULSE_ALPHA = 0.03;
  var CAUSTIC_DRIFT = 0.06;
  var CAUSTIC_SPEED = 0.35;
  var SURFACE_RIPPLES = 3;
  var RIPPLE_AMPLITUDE = 6;
  var RIPPLE_SPEED = 1.4;
  var RIPPLE_STEP = 16;
  var BUBBLES = 12;
  var BUBBLE_MARGIN = 12;
  function hash(unit, salt) {
    const v = Math.sin(unit * 127.1 + salt * 311.7) * 43758.5453;
    return v - Math.floor(v);
  }
  function drawWater(ctx, width, height, t) {
    drawBackdrop(ctx, width, height);
    drawCausticShafts(ctx, width, height, t);
    drawSurfaceRipples(ctx, width, t);
    drawBubbles(ctx, width, height, t);
  }
  function drawBackdrop(ctx, width, height) {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, WATER_SURFACE);
    grad.addColorStop(1, WATER_DEPTH);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
  }
  function drawCausticShafts(ctx, width, height, t) {
    for (let i = 0; i < CAUSTIC_SHAFTS; i++) {
      const sway = Math.sin(t * CAUSTIC_SPEED + i * 1.9) * CAUSTIC_DRIFT * width;
      const alpha = CAUSTIC_BASE_ALPHA + CAUSTIC_PULSE_ALPHA * Math.sin(t * CAUSTIC_SPEED * 1.7 + i * 2.6);
      const centerX = width * ((i + 0.5) / CAUSTIC_SHAFTS);
      const topX = centerX + sway * 0.4;
      const botX = centerX + sway + width * 0.1;
      ctx.beginPath();
      ctx.moveTo(topX - width * 0.03, 0);
      ctx.lineTo(topX + width * 0.03, 0);
      ctx.lineTo(botX + width * 0.09, height);
      ctx.lineTo(botX - width * 0.09, height);
      ctx.closePath();
      ctx.fillStyle = `rgba(220, 245, 255, ${alpha.toFixed(4)})`;
      ctx.fill();
    }
  }
  function drawSurfaceRipples(ctx, width, t) {
    ctx.lineWidth = 1.5;
    for (let j = 0; j < SURFACE_RIPPLES; j++) {
      const yBase = 14 + j * 9;
      const alpha = 0.25 - j * 0.06;
      ctx.beginPath();
      for (let x = 0; x <= width; x += RIPPLE_STEP) {
        const y = yBase + Math.sin(x * 0.02 + t * RIPPLE_SPEED + j * 1.3) * RIPPLE_AMPLITUDE;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(230, 250, 255, ${alpha.toFixed(3)})`;
      ctx.stroke();
    }
  }
  function drawBubbles(ctx, width, height, t) {
    ctx.lineWidth = 1;
    const column = height + BUBBLE_MARGIN * 2;
    ctx.strokeStyle = "rgba(230, 250, 255, 0.35)";
    for (let i = 0; i < BUBBLES; i++) {
      const xBase = width * (0.04 + 0.92 * hash(i, 1));
      const speed = 36 + 64 * hash(i, 2);
      const radius = 1.5 + 3.5 * hash(i, 3);
      const lag = hash(i, 4) * column;
      const wobble = Math.sin(t * (1.2 + hash(i, 5) * 1.6) + i * 2.1) * 5;
      const y = height + BUBBLE_MARGIN - (t * speed + lag) % column;
      ctx.beginPath();
      ctx.arc(xBase + wobble, y, radius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // src/render/renderer.ts
  var Renderer = class {
    /** Paint one frame of the given world state. */
    render(ctx, width, height, world) {
      drawWater(ctx, width, height, world.time);
    }
  };

  // src/ui/stage.ts
  var Stage = class _Stage {
    canvas;
    ctx;
    win;
    constructor(canvas, ctx, win) {
      this.canvas = canvas;
      this.ctx = ctx;
      this.win = win;
    }
    /** Grab the 2d context, wire viewport resize, do the first fit. */
    static attach(canvas, win) {
      if (typeof canvas.getContext !== "function") {
        throw new Error("fishtank: the #game element is not a canvas");
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("fishtank: no 2d canvas context available");
      const stage = new _Stage(canvas, ctx, win);
      win.addEventListener("resize", () => stage.refit());
      stage.refit();
      return stage;
    }
    /** Backing-store width/height in device px. */
    get width() {
      return this.canvas.width;
    }
    get height() {
      return this.canvas.height;
    }
    /** Refit the backing store to the viewport (device-pixel aware). */
    refit() {
      const dpr = this.win.devicePixelRatio > 0 ? this.win.devicePixelRatio : 1;
      this.canvas.width = Math.max(1, Math.round(this.win.innerWidth * dpr));
      this.canvas.height = Math.max(1, Math.round(this.win.innerHeight * dpr));
    }
  };

  // src/fishtank-main.ts
  function initFishtank(win, doc) {
    const canvasEl = doc.getElementById("game");
    if (!canvasEl) throw new Error("fishtank: the #game element is missing");
    const stage = Stage.attach(canvasEl, win);
    const world = new World();
    const renderer = new Renderer();
    exposeTestSeam(world);
    let lastTs = null;
    const frame = (ts) => {
      const elapsed = lastTs === null ? 0 : (ts - lastTs) / 1e3;
      lastTs = ts;
      world.advance(clampDelta(elapsed));
      renderer.render(stage.ctx, stage.width, stage.height, world);
      win.requestAnimationFrame(frame);
    };
    win.requestAnimationFrame(frame);
    return world;
  }
  function clampDelta(seconds) {
    return Math.min(MAX_FRAME_DELTA, Math.max(0, seconds));
  }
  function exposeTestSeam(world) {
    const seam = globalThis;
    seam.FIXED_DT = FIXED_DT;
    seam.FISH_TANK_WORLD = world;
  }
  if (typeof window !== "undefined" && typeof document !== "undefined") {
    initFishtank(window, document);
  }
})();

</script>
</body>
</html>
